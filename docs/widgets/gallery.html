<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget gallery</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a; --red:#e06c6c;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#eeedea;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       padding:22px 26px;-webkit-font-smoothing:antialiased}
  h1{font-size:22px;font-weight:650;letter-spacing:-.015em}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
  .bar button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:5px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .bar button.on{color:var(--ink);border-color:var(--blue);background:rgba(91,147,211,.1)}
  .legend{font-size:11px;color:var(--faint);margin:8px 0 18px}
  .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 4px 0 12px;
     vertical-align:middle}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        overflow:hidden;display:flex;flex-direction:column}
  .card.keep{border-color:var(--green)}
  .card.cut{opacity:.62}
  .hd{padding:9px 11px;display:flex;align-items:center;justify-content:space-between;
      gap:8px;border-bottom:1px solid var(--hair)}
  .nm{font-size:12.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;
       border-radius:3px;background:var(--hair);color:var(--dim);white-space:nowrap}
  .tag.keep{background:rgba(95,168,122,.16);color:var(--green)}
  .tag.cut{background:rgba(224,108,108,.14);color:var(--red)}
  .tag.emb{background:rgba(91,147,211,.14);color:var(--blue)}
  .why{padding:7px 11px;font-size:11px;color:var(--dim);line-height:1.45;
       border-bottom:1px solid var(--hair);min-height:34px}
  .fr{width:100%;height:300px;border:0;background:var(--bg);display:block}
  .ft{padding:6px 11px;display:flex;justify-content:space-between;align-items:center;
      font-size:10.5px}
  .ft a{color:var(--blue);text-decoration:none}
  .ft a:hover{text-decoration:underline}
</style>
</head>
<body>
  <h1>Widget gallery</h1>
  <div class="sub" id="sub">—</div>

  <div class="bar">
    <button data-f="all" class="on">All</button>
    <button data-f="keep">Keep (6)</button>
    <button data-f="cut">Cut list</button>
    <button data-f="emb">Embedded in Notion</button>
    <button data-f="orphan">Not embedded</button>
  </div>
  <div class="legend">
    <span class="k" style="background:var(--green)"></span>green border = the keep-six
    <span class="k" style="background:var(--red)"></span>faded = recommended for deletion
  </div>

  <div class="grid" id="g"></div>

<script>
/* The keep-six come from the adversarial review of this project. Each one has a
   stated job; everything else is either duplicated, decorative, or measuring a
   non-event (streak/heatmap/burndown all read done=0). */
const W = [
 {f:'today',    keep:1, why:'The sidebar. Clock, weather, NOW/NEXT, one merged agenda, daily brief.'},
 {f:'day',      keep:1, why:'Hour grid 0600-2400. What is next and can I make it.'},
 {f:'nowbar',   keep:1, why:'Am I late right now. Zero interpretation.'},
 {f:'deadlines',keep:1, why:'Non-linear runway. The only widget that sees past 7 days.'},
 {f:'week2',    keep:1, why:'The week. 7 modes; agenda mode is the useful one.'},
 {f:'classes',  keep:1, why:'Which of 7 courses needs work. Now carries real syllabus dates.'},
 {f:'triage',   keep:1, why:'What am I abandoning. Names names instead of showing a scalar.'},
 {f:'nav',      keep:1, why:'Five dashboard tiles with live counts.'},

 {f:'agenda',   cut:1, why:'Overlaps today + day. Three names for one function.'},
 {f:'week',     cut:1, why:'Superseded by week2.'},
 {f:'grid-a',   cut:1, why:'Legacy week variant. Pick one week view.'},
 {f:'grid-b',   cut:1, why:'Legacy week variant.'},
 {f:'grid-c',   cut:1, why:'Legacy week variant; the Load view you already removed once.'},
 {f:'streak',   cut:1, why:'Reads done=0 for 14 straight days. A flat line pointing at a wall.'},
 {f:'heatmap',  cut:1, why:'Same non-event as streak.'},
 {f:'burndown', cut:1, why:'Same non-event. Three widgets measuring nothing.'},
 {f:'matrix',   cut:1, why:'Priority filled 4/15, energy 3/15. A 2x2 that is 70% empty.'},
 {f:'projects', cut:1, why:'Blocker 0/28, next 2/28, status 0/28. Three of four fields empty.'},
 {f:'portfolio',cut:1, why:'0 in flight, 0 blocked - no project is marked active.'},
 {f:'runway',   cut:1, why:'Duplicates deadlines with less rigour.'},
 {f:'countdown',cut:1, why:'Three-digit numbers with nothing near-term.'},
 {f:'termbar',  cut:1, why:'A semester progress bar changes nothing you decide.'},
 {f:'clock',    cut:1, why:'Your menu bar already does this. Now inside today.html anyway.'},
 {f:'weather',  cut:1, why:'Now inside today.html header.'},
 {f:'focus',    cut:1, why:'Unused.'},
 {f:'timeblock',cut:1, why:'Free-gap detection overstates free time - 9 of 34 events lack end times.'},
 {f:'prototype',cut:1, why:'The fake-Notion mockup. Served its purpose; the real page exists now.'},
 {f:'mockup',   cut:1, why:'Same - scaffolding, not product.'},
 {f:'scorecard',cut:0, why:'Executive KPI tiles. Keep if you want the blunt numbers on Home.'},
 {f:'okr',      cut:0, why:'Computed key results with visible formulas.'},
 {f:'pipeline', cut:0, why:'Funnel: 150 captured, 3 ever finished.'},
 {f:'velocity', cut:0, why:'Closed/day vs becoming-due/day. The gap explains the backlog.'},
 {f:'calendar-month', cut:0, why:'Month heat grid.'},
 {f:'network',  cut:0, why:'Stakeholder contact cadence. 8 people, 2 cold.'},
 {f:'research', cut:0, why:'Thesis status panel.'},
 {f:'brief-card',cut:0,why:'Brief summary card - now duplicated inside today.html.'},
 {f:'arxiv',    cut:0, why:'astro-ph.IM feed. The only widget bringing in outside information.'},
];

let EMB=[];
fetch('../data/embedded.json?t='+Date.now()).then(r=>r.json()).then(d=>{EMB=d;render();})
  .catch(()=>render());

function render(f){
  f=f||'all';
  const g=document.getElementById('g');
  const rows=W.filter(w=>{
    if(f==='keep') return w.keep;
    if(f==='cut') return w.cut;
    if(f==='emb') return EMB.includes(w.f);
    if(f==='orphan') return !EMB.includes(w.f);
    return true;
  });
  g.innerHTML=rows.map(w=>{
    const emb=EMB.includes(w.f);
    return `<div class="card ${w.keep?'keep':''} ${w.cut?'cut':''}">
      <div class="hd">
        <span class="nm">${w.f}</span>
        <span class="tags">
          ${w.keep?'<span class="tag keep">keep</span>':''}
          ${w.cut?'<span class="tag cut">cut</span>':''}
          ${emb?'<span class="tag emb">embedded</span>':'<span class="tag">not embedded</span>'}
        </span>
      </div>
      <div class="why">${w.why}</div>
      <iframe class="fr" src="${w.f}.html" loading="lazy" title="${w.f}"></iframe>
      <div class="ft">
        <a href="${w.f}.html" target="_blank">open \u2197</a>
        <span style="color:var(--faint)">${w.f}.html</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('sub').textContent =
    `${rows.length} shown of ${W.length} widgets \u00b7 ${W.filter(x=>x.keep).length} keep \u00b7 ${W.filter(x=>x.cut).length} on the cut list`;
}

document.querySelectorAll('.bar button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); render(b.dataset.f);
  };
});
</script>
</body>
</html>

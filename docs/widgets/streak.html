<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streak</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#252525;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --blue:#5b93d3; --gold:#c9a227; --red:#e06c6c; --green:#5fa87a; --purple:#9a6dd7;
    --empty:#2a2a2a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; --empty:#e3e2de; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);padding:12px 14px;
       font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .hd{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;
      padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:11px}
  .st{border-left:2px solid var(--hair);padding-left:9px}
  .st.on{border-left-color:var(--green)}
  .n{font-size:25px;font-weight:600;letter-spacing:-.035em;line-height:1;
     font-variant-numeric:tabular-nums}
  .n.zero{color:var(--faint)}
  .n.good{color:var(--green)}
  .u{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;
     display:block;margin-top:4px}
  .sub{font-size:10px;color:var(--dim);margin-top:3px}

  .striplab{font-size:9.5px;color:var(--faint);text-transform:uppercase;
            letter-spacing:.08em;display:flex;justify-content:space-between;
            padding-top:9px;border-top:1px solid var(--hair);margin-bottom:6px}
  .strip{display:flex;gap:3px;flex-wrap:wrap}
  .dot{width:15px;height:15px;border-radius:3px;background:var(--empty);
       position:relative;cursor:default}
  .dot.hit{background:var(--green)}
  .dot.today{outline:1.5px solid var(--blue);outline-offset:1px}
  .axis{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);
        margin-top:5px}

  .prompt{margin-top:10px;padding:9px 11px;background:var(--panel);
          border:1px solid var(--line);border-left:2px solid var(--gold);
          border-radius:3px;font-size:11.5px;color:var(--dim);line-height:1.45}
  .prompt b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px;font-size:12px}
  .note{font-size:9.5px;color:var(--faint);margin-top:8px;line-height:1.5}
  .note b{color:var(--dim);font-weight:500}
  .none{color:var(--faint);font-style:italic;padding:14px 0}
</style>
</head>
<body>
<div class="hd"><span>Streak</span><span id="win"></span></div>
<div id="out"><div class="none">loading…</div></div>

<script>
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ISO=/(\d{4}-\d{2}-\d{2})/;
const dayOf = v => { const m=ISO.exec(String(v||'')); return m?m[1]:null; };
const D = iso => new Date(iso+'T12:00:00');
const fmtShort = iso => { const d=D(iso); return d.getDate()+' '+MON[d.getMonth()]; };
const esc = s => String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).then(T=>{
  const out = document.getElementById('out');
  const hist = (Array.isArray(T.history)?T.history:[])
    .map(h=>({d:dayOf(h.date), total:Number(h.total)||0, done:Number(h.done)||0}))
    .filter(h=>h.d)
    .sort((a,b)=> a.d < b.d ? -1 : a.d > b.d ? 1 : 0);

  if(!hist.length){
    out.innerHTML = '<div class="none">no history rows — nothing to compute a streak from</div>';
    return;
  }

  const today = dayOf(T.today) || hist[hist.length-1].d;
  const first = hist[0].d, last = hist[hist.length-1].d;
  const N = hist.length;

  // ---- streaks over the observed window. A "hit" day = >=1 completion.
  // Current streak counts back from the most recent day in history.
  let current = 0;
  for(let i=N-1; i>=0; i--){ if(hist[i].done>0) current++; else break; }
  let longest = 0, run = 0;
  hist.forEach(h=>{ if(h.done>0){ run++; longest=Math.max(longest,run); } else run=0; });

  const doneWin  = hist.reduce((a,h)=>a+h.done,0);
  const totalWin = hist.reduce((a,h)=>a+h.total,0);
  const hitDays  = hist.filter(h=>h.done>0).length;
  const rate = totalWin>0 ? (doneWin/totalWin*100) : 0;

  const c = T.counts||{};
  const allDone = Number(c.done)||0, allTotal = Number(c.total)||0;
  const allRate = allTotal>0 ? (allDone/allTotal*100) : 0;

  document.getElementById('win').textContent = fmtShort(first)+' – '+fmtShort(last);

  const zero = current===0;

  const dots = hist.map(h=>{
    const hit = h.done>0;
    return `<div class="dot${hit?' hit':''}${h.d===today?' today':''}"
              title="${h.d} — ${h.done} done of ${h.total} scheduled"></div>`;
  }).join('');

  // Honest framing of the completion-rate figure: window rate is 0/0-safe and
  // we always show the all-time denominator alongside it so 0% is legible.
  const rateTxt = totalWin>0 ? rate.toFixed(0)+'%' : '—';
  const rateSub = totalWin>0
      ? doneWin+' of '+totalWin+' scheduled in window'
      : 'no items scheduled in window';

  out.innerHTML = `
    <div class="stats">
      <div class="st${current>0?' on':''}">
        <div class="n ${zero?'zero':'good'}">${current}</div>
        <span class="u">Current streak</span>
        <div class="sub">${zero?'no day with a completion':'day'+(current===1?'':'s')+' in a row'}</div>
      </div>
      <div class="st${longest>0?' on':''}">
        <div class="n ${longest===0?'zero':''}">${longest}</div>
        <span class="u">Longest (in ${N}d)</span>
        <div class="sub">${longest===0?'none recorded':'best run observed'}</div>
      </div>
      <div class="st">
        <div class="n ${doneWin===0?'zero':''}">${rateTxt}</div>
        <span class="u">Completion rate</span>
        <div class="sub">${esc(rateSub)}</div>
      </div>
    </div>

    <div class="striplab"><span>Last ${N} days</span>
      <span>${hitDays}/${N} with a completion</span></div>
    <div class="strip">${dots}</div>
    <div class="axis"><span>${fmtShort(first)}</span><span>${fmtShort(last)} · today</span></div>

    ${zero ? `<div class="prompt">
        <b>Streak is 0 — start one.</b>
        ${doneWin} items were checked off in the ${N} days from ${fmtShort(first)} to ${fmtShort(last)},
        against ${totalWin} scheduled. Closing any one item today starts a streak at 1.
      </div>` : ''}

    <div class="note"><b>Source:</b> history[] — ${N} daily rows,
      ${esc(first)} → ${esc(last)}. Streaks are computed only inside that window,
      so &ldquo;longest&rdquo; means longest observed here, not all time.
      All time across the whole base: <b>${allDone} done of ${allTotal}</b>
      (${allRate.toFixed(1)}%), ${Number(c.open)||0} open.
      ${doneWin===0 ? 'None of those completions fall inside the history window, which is why every dot is empty — that is the real reading, not missing data.' : ''}
    </div>`;
})
.catch(()=>{ document.getElementById('out').innerHTML='<div class="none">data unavailable</div>'; });
</script>
</body>
</html>

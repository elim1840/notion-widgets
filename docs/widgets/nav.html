<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboards</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a;
    --purple:#9a7fd0; --red:#e06c6c; --teal:#4fa3a0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#eeedea;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    padding:10px 2px; -webkit-font-smoothing:antialiased;
  }
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media (max-width:820px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:520px){ .grid{grid-template-columns:repeat(2,1fr)} }

  .t{
    display:block;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:11px 12px 10px;
    position:relative;overflow:hidden;
    transition:transform .12s ease, border-color .12s ease;
  }
  .t::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);
  }
  .t:hover{transform:translateY(-2px);border-color:var(--c)}
  .t .ic{font-size:17px;line-height:1;display:block;margin-bottom:7px}
  .t .nm{font-size:12.5px;font-weight:600;letter-spacing:-.005em;line-height:1.2}
  .t .st{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.35;
         font-variant-numeric:tabular-nums}
  .t .st b{color:var(--c);font-weight:600}

  .deck{--c:var(--blue)}
  .acad{--c:var(--gold)}
  .res {--c:var(--green)}
  .adm {--c:var(--purple)}
  .per {--c:var(--teal)}

  .foot{margin-top:8px;font-size:9.5px;color:var(--faint);text-align:right}
</style>
</head>
<body>
  <div class="grid" id="g">
    <a class="t deck" id="deck" href="#" target="_blank">
      <span class="ic">🏠</span>
      <div class="nm">Home</div>
      <div class="st" id="s-deck">&mdash;</div>
    </a>
    <a class="t acad" id="acad" href="#" target="_blank">
      <span class="ic">🎓</span>
      <div class="nm">Academics</div>
      <div class="st" id="s-acad">&mdash;</div>
    </a>
    <a class="t res" id="res" href="#" target="_blank">
      <span class="ic">🛰️</span>
      <div class="nm">Research</div>
      <div class="st" id="s-res">&mdash;</div>
    </a>
    <a class="t adm" id="admin" href="#" target="_blank">
      <span class="ic">📋</span>
      <div class="nm">Admin</div>
      <div class="st" id="s-adm">&mdash;</div>
    </a>
    <a class="t per" id="pers" href="#" target="_blank">
      <span class="ic">🌊</span>
      <div class="nm">Personal</div>
      <div class="st" id="s-per">&mdash;</div>
    </a>
  </div>
  <div class="foot" id="foot"></div>

<script>
// Tiles carry LIVE counts, not decoration. A link with a number on it tells you
// whether it is worth clicking; a bare button does not.
const THESIS = new Date('2027-01-15T12:00:00');

Promise.all([
  fetch('../data/nav.json?t='+Date.now()).then(r=>r.json()).catch(()=>({})),
  fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).catch(()=>null),
  fetch('../data/spokes.json?t='+Date.now()).then(r=>r.json()).catch(()=>null),
]).then(([nav, tk, sp])=>{

  for(const k of ['deck','acad','res','admin','pers']){
    const el=document.getElementById(k);
    if(nav[k] && el) el.href=nav[k];
  }

  if(tk){
    const c=tk.counts||{};
    document.getElementById('s-deck').innerHTML =
      `<b>${c.today_done??0}/${c.today_total??0}</b> today`;

    const od=c.overdue??0;
    document.getElementById('s-adm').innerHTML =
      od>0 ? `<b>${od}</b> overdue` : `<b>${c.open??0}</b> open`;
  }

  if(sp){
    // Academics: distinct course codes still ahead, and the next dated item.
    const today = tk ? tk.today : new Date().toISOString().slice(0,10);
    const future = (sp.classes||[]).filter(x=>(x.date||'').slice(0,10) >= today);
    const codes = new Set(future.map(x=>x.code).filter(Boolean));
    const next = future.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];
    document.getElementById('s-acad').innerHTML =
      codes.size
        ? `<b>${codes.size}</b> course${codes.size===1?'':'s'} \u00b7 ${future.length} ahead`
        : 'nothing scheduled';

    // Research: days to thesis is the number that actually governs this spoke.
    const days = Math.round((THESIS - new Date())/86400000);
    const active = (sp.projects||[]).filter(x=>(x.phase||'')==='Research').length;
    document.getElementById('s-res').innerHTML =
      `<b>${days}d</b> to thesis \u00b7 ${active} active`;

    document.getElementById('s-per').innerHTML =
      `<b>${(sp.projects||[]).length}</b> projects tracked`;
  }

  const g = tk && tk.generated ? tk.generated.slice(11,16) : '';
  document.getElementById('foot').textContent = g ? ('synced '+g) : '';
})
.catch(()=>{});
</script>
</body>
</html>

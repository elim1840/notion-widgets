<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nav</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --blue:#5b93d3; --purple:#9a6dd7; --green:#5fa87a; --amber:#c9a227; --red:#e06c6c;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);padding:10px 12px;
       font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  @media (max-width:620px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:380px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  a.t{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
      background:var(--panel);border:1px solid var(--line);border-radius:7px;
      padding:10px 11px;transition:border-color .12s,transform .12s;min-width:0}
  a.t:hover{transform:translateY(-1px)}
  a.t .ic{font-size:16px;line-height:1;flex:0 0 auto}
  a.t .tx{min-width:0}
  a.t b{font-size:12.5px;font-weight:500;display:block;line-height:1.2;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.t span{font-size:9.5px;color:var(--faint);display:block;margin-top:1px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.deck:hover {border-color:var(--blue)}
  a.acad:hover {border-color:var(--purple)}
  a.res:hover  {border-color:var(--green)}
  a.admin:hover{border-color:var(--amber)}
  a.pers:hover {border-color:var(--red)}
</style>
</head>
<body>
<div class="grid">
  <a class="t deck"  id="deck"  href="#" target="_blank">
    <span class="ic">&#127968;</span><span class="tx"><b>Home</b><span>today &middot; this week</span></span></a>
  <a class="t acad"  id="acad"  href="#" target="_blank">
    <span class="ic">&#127891;</span><span class="tx"><b>Academics</b><span>6 classes</span></span></a>
  <a class="t res"   id="res"   href="#" target="_blank">
    <span class="ic">&#128300;</span><span class="tx"><b>Research</b><span>thesis &middot; SERG</span></span></a>
  <a class="t admin" id="admin" href="#" target="_blank">
    <span class="ic">&#128206;</span><span class="tx"><b>Admin</b><span>deadlines &middot; forms</span></span></a>
  <a class="t pers"  id="pers"  href="#" target="_blank">
    <span class="ic">&#127947;&#65039;</span><span class="tx"><b>Personal</b><span>train &middot; eat</span></span></a>
</div>
<script>
fetch('../data/nav.json?t='+Date.now()).then(r=>r.json()).then(n=>{
  for(const k of ['deck','acad','res','admin','pers']){
    const el=document.getElementById(k);
    if(n[k] && el) el.href=n[k];
  }
}).catch(()=>{});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboards</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a;
    --purple:#9a7fd0; --red:#e06c6c; --teal:#4fa3a0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#eeedea;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    padding:10px 2px; -webkit-font-smoothing:antialiased;
  }
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media (max-width:820px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:520px){ .grid{grid-template-columns:repeat(2,1fr)} }

  /* Label-only tiles. The emoji and the count subline were two competing
     decorations on a control whose only job is "take me there". The colour
     rail already distinguishes the five spokes. */
  .t{
    display:flex;align-items:center;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:14px 12px 14px 15px;min-height:46px;
    position:relative;overflow:hidden;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .t::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);
  }
  .t:hover{transform:translateY(-2px);border-color:var(--c)}
  .t .nm{font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.2}

  .deck{--c:var(--blue)}
  .acad{--c:var(--gold)}
  .res {--c:var(--green)}
  .adm {--c:var(--purple)}
  .per {--c:var(--teal)}

  .foot{margin-top:8px;font-size:10px;color:var(--faint);text-align:right}
</style>
</head>
<body>
  <div class="grid" id="g">
    <a class="t deck" id="deck" href="#">
      <div class="nm">Home</div>
    </a>
    <a class="t acad" id="acad" href="#">
      <div class="nm">Academics</div>
    </a>
    <a class="t res" id="res" href="#">
      <div class="nm">Research</div>
    </a>
    <a class="t adm" id="admin" href="#">
      <div class="nm">Admin</div>
    </a>
    <a class="t per" id="pers" href="#">
      <div class="nm">Personal</div>
    </a>
  </div>
  <div class="foot" id="foot"></div>

<script>
// Tiles carry LIVE counts, not decoration. A link with a number on it tells you
// whether it is worth clicking; a bare button does not.
//
// NAVIGATION: Notion sandboxes embed iframes WITHOUT allow-top-navigation, so a
// plain link can only ever open a new tab -- the iframe is not permitted to move
// the page it sits in. There is no CSS or JS trick around that; it is a browser
// security boundary, not a Notion setting.
// The one thing that DOES navigate in place is the notion:// protocol, which the
// desktop app registers with the OS. Clicking it hands the URL to the already-open
// Notion app, which navigates its current window instead of spawning a browser tab.
// So: notion:// when the desktop app is likely present, https:// as the fallback.

function toDesktop(u){
  // https://www.notion.so/<id>  ->  notion://www.notion.so/<id>
  return (u||'').replace(/^https:\/\//, 'notion://');
}

function wireLink(el, url){
  if(!el || !url) return;
  el.href = url;                 // real href so hover/copy-link still work
  el.removeAttribute('target');  // no more forced new tab
  el.addEventListener('click', function(ev){
    ev.preventDefault();
    // Try the desktop app first: this navigates the existing Notion window.
    window.location.href = toDesktop(url);
    // If no protocol handler answers, nothing visible happens -- so fall back to
    // a top-level open shortly after. 400ms is long enough for the OS handoff.
    setTimeout(function(){
      try { window.top.location.href = url; }   // blocked by sandbox, but try
      catch(e) { window.open(url, '_blank'); }  // last resort
    }, 400);
  });
}

Promise.all([
  fetch('../data/nav.json?t='+Date.now()).then(r=>r.json()).catch(()=>({})),
  fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).catch(()=>null),
]).then(([nav, tk])=>{

  for(const k of ['deck','acad','res','admin','pers']){
    wireLink(document.getElementById(k), nav[k]);
  }

  // Counts removed from the tiles: the subline was a second, competing number
  // next to every label and read as clutter. The data still exists in the
  // widgets that own it (triage owns overdue, classes owns course load).

  const g = tk && tk.generated ? tk.generated.slice(11,16) : '';
  document.getElementById('foot').textContent = g ? ('synced '+g) : '';
})
.catch(()=>{});
</script>
</body>
</html>

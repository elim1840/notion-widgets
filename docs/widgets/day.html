<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --now:#e06c6c; --red:#e06c6c; --amber:#c9a227; --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a; --purple:#9a6dd7;
    --gut:54px;             /* left time gutter */
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
       font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
         padding:14px 18px 11px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .dnum{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1}
  .dow{font-size:11px;color:var(--dim);text-transform:uppercase;
       letter-spacing:.1em;margin-top:3px}
  .rt{text-align:right}
  .clk{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
       letter-spacing:-.01em}
  .meta{font-size:11px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}

  /* day navigation */
  .nav{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-bottom:2px}
  .nb{background:var(--panel);border:1px solid var(--line);color:var(--ink);
      border-radius:5px;width:24px;height:22px;line-height:1;cursor:pointer;
      font-size:11px;display:flex;align-items:center;justify-content:center;
      font-family:inherit;padding:0}
  .nb:hover{border-color:var(--blue)}
  .nb:disabled{opacity:.3;cursor:default}
  .nb.wide{width:auto;padding:0 8px;font-size:10px;text-transform:uppercase;
      letter-spacing:.09em;color:var(--dim);font-variant-numeric:tabular-nums}
  .nb.today.on{color:var(--now);border-color:var(--now)}
  .nb.fit.on{color:var(--blue);border-color:var(--blue)}
  .dots{display:flex;gap:3px;margin:0 2px}
  .dot{width:20px;height:22px;border-radius:4px;border:1px solid transparent;
      background:transparent;cursor:pointer;color:var(--faint);font-family:inherit;
      font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0;
      display:flex;align-items:center;justify-content:center}
  .dot:hover{color:var(--ink);border-color:var(--line)}
  .dot.sel{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
  .dot.isnow{color:var(--now)}

  /* all-day strip */
  .allday{flex:0 0 auto;padding:7px 18px;border-bottom:1px solid var(--line);
          display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .allday .lbl{font-size:10px;color:var(--faint);text-transform:uppercase;
       letter-spacing:.07em;flex:0 0 auto;margin-right:2px}
  /* names wrap; never truncated */
  .ad{font-size:12px;background:var(--panel);border:1px solid var(--line);
      border-radius:4px;padding:2px 8px;color:var(--ink);text-decoration:none;
      display:inline-block;max-width:100%;white-space:normal;overflow-wrap:break-word}
  .ad:hover{border-color:var(--blue)}
  /* completed: struck through but still legible (not faded into the background) */
  .ad.done{color:var(--dim);text-decoration:line-through;
      text-decoration-color:var(--green);text-decoration-thickness:1.5px}
  .ad.done::before{content:"\2713 ";color:var(--green);text-decoration:none;
      display:inline-block;text-decoration-line:none}
  /* an undone TASK whose date has passed = genuinely overdue */
  .ad.overdue{border-color:var(--now);color:var(--now)}
  .ad.overdue::before{content:"! ";font-weight:700}
  /* an undone MEETING whose date has passed simply happened; not a debt */
  .ad.ended{color:var(--faint);border-style:dashed}

  /* scrolling grid */
  .scroll{flex:1;overflow-y:auto;position:relative;min-height:0}
  .scroll.fits{overflow-y:hidden}
  .grid{position:relative;padding:0 18px 22px}
  .hour{position:relative;border-top:1px solid var(--hair)}
  .hour.major{border-top-color:var(--line)}
  .hour.night{background:linear-gradient(90deg,transparent,rgba(120,120,140,.035) 12%)}
  .hour.core{background:linear-gradient(90deg,transparent,rgba(91,147,211,.045) 12%)}
  .hour.dpstart{border-top:1px solid var(--line)}
  /* a compressed (event-free) hour: still present, still labelled, just thin */
  .hour.thin{background-image:none}
  .hour.thin .hl{font-size:10px;opacity:.5}
  .hour .dp{position:absolute;right:4px;top:2px;z-index:3;font-size:10px;color:var(--faint);
       letter-spacing:.12em;text-transform:uppercase;opacity:.55}
  .hour .hl{position:absolute;left:0;top:-7px;width:calc(var(--gut) - 12px);
       text-align:right;font-size:11px;color:var(--faint);
       font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .hour.wake .hl{color:var(--dim)}

  /* events layer */
  .layer{position:absolute;left:18px;right:18px;top:0;bottom:0;pointer-events:none}
  .ev{position:absolute;left:var(--gut);pointer-events:auto;
      border-radius:5px;padding:4px 8px;text-decoration:none;color:var(--ink);
      background:var(--panel);border:1px solid var(--line);
      border-left:3px solid var(--blue);overflow:visible;
      display:flex;flex-direction:column;gap:1px}
  .ev:hover{border-color:var(--blue);z-index:40}
  .ev.k-class{border-left-color:var(--gold)}
  .ev.k-res{border-left-color:var(--green)}
  .ev.k-admin{border-left-color:var(--purple)}
  /* a block taller than its own time span (grown so the name fits) */
  .ev.grown{border-bottom-style:dashed}
  /* pushed below its true start because the track was too narrow for
     another lane; the time on the block is still its real start time */
  .ev.stacked{border-top-style:dashed}

  /* ---- state layer -------------------------------------------------
     done    completed -> struck through, STILL READABLE (opacity .85)
     overdue an undone TASK whose time has passed -> red, a real debt
     ended   an undone MEETING whose time has passed -> it happened, dim
     -------------------------------------------------------------------*/
  .ev.done{opacity:.85;border-left-color:var(--green)}
  .ev.done .et,.ev.done .em{text-decoration:line-through;
      text-decoration-color:var(--green);text-decoration-thickness:1.5px;
      color:var(--dim)}
  .ev.overdue{border-left-color:var(--now);border-color:var(--now);
      background:linear-gradient(90deg,rgba(224,108,108,.10),var(--panel) 60%)}
  .ev.overdue .et{color:var(--now)}
  .ev.ended{opacity:.62;border-left-style:dashed}
  .ev .flag{font-size:10px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;
      font-weight:600;text-decoration:none;display:inline-block;flex:0 0 auto;
      white-space:nowrap;color:var(--faint)}
  .ev.done .flag{color:var(--green)}
  .ev.overdue .flag{color:var(--now)}
  .ev.ended .flag{color:var(--faint);font-weight:500}
  /* NAME: wraps, never clipped, never ellipsised. flex:0 0 auto so a
     fixed-height block can never compress the text lines. */
  .et{font-size:13px;font-weight:500;line-height:1.22;
      white-space:normal;overflow-wrap:break-word;word-break:normal;
      flex:0 0 auto}
  .erow{display:flex;align-items:baseline;justify-content:space-between;gap:7px;
      margin-top:1px;flex:0 0 auto}
  .em{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;
      white-space:normal;overflow-wrap:break-word;min-width:0}
  .ev.pt{border-left-style:solid}
  .ev.pt .em::before{content:"\25C6 ";font-size:10px;vertical-align:1px}

  /* now line - unmistakable, labelled in 24h */
  .nowline{position:absolute;left:calc(var(--gut) - 2px);right:0;height:0;
      border-top:2px solid var(--now);z-index:30;pointer-events:none;
      box-shadow:0 0 0 2px rgba(224,108,108,.14)}
  .nowline::before{content:"";position:absolute;left:-4px;top:-4px;
      width:8px;height:8px;border-radius:50%;background:var(--now)}
  .nowtag{position:absolute;left:0;transform:translateY(-50%);z-index:31;
      width:calc(var(--gut) - 8px);text-align:center;pointer-events:none;
      font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
      letter-spacing:.02em;color:#fff;background:var(--now);
      border-radius:3px;padding:1px 0 2px}

  .empty{color:var(--faint);font-style:italic;padding:24px 18px;font-size:13px}
  footer{flex:0 0 auto;padding:7px 18px;border-top:1px solid var(--line);
         font-size:10px;color:var(--faint);display:flex;justify-content:space-between;
         gap:10px;font-variant-numeric:tabular-nums}

  /* ---- DONE = RESULT, not decay (matches today.html) ----
     Completion gets green ink, a readable strike, and a solid rail, so a task
     finished at 0900 still reads as finished at 2100. Faded grey made
     completed work look the same as work that merely aged. */
  .done, .ev.done, .li.done, .agi.done, .cati.done, .ad.done{
    --doneg:#5fa87a;
  }
  .ev.done .lab, .li.done .ln, .agi.done .n2, .cati.done .n, .ad.done{
    color:#3f7a58 !important;
    text-decoration-color:rgba(95,168,122,.8) !important;
    text-decoration-thickness:1px !important;
  }
  .ev.done, .li.done, .agi.done, .cati.done{
    background:rgba(95,168,122,.10) !important;
    opacity:1 !important;
    filter:none !important;
  }
  /* filled check on timeline events too (all-day .ad already has one) */
  .ev.done .et::before{content:"\2713\00a0";color:#5fa87a;font-weight:700;
    text-decoration:none;display:inline-block;text-decoration-line:none}
  .li.done, .agi.done, .cati.done{
    border-left:3px solid #5fa87a !important;
  }
</style>
</head>
<body>
<header>
  <div><div class="dnum" id="dnum">—</div><div class="dow" id="dow"></div></div>
  <div class="nav" id="nav">
    <button class="nb" id="prev" title="Previous day (←)">&#9664;</button>
    <div class="dots" id="dots"></div>
    <button class="nb" id="next" title="Next day (→)">&#9654;</button>
    <button class="nb wide today" id="tbtn" title="Jump to today (T)">Today</button>
    <button class="nb wide fit" id="fitbtn"
      title="Compress event-free hours so the busy part of the day gets the space (F)">Fit</button>
  </div>
  <div class="rt"><div class="clk" id="clk">----</div><div class="meta" id="sum"></div></div>
</header>
<div class="allday" id="allday" style="display:none"></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
<footer><span id="gen"></span><span id="note"></span><span id="src">Tasks &amp; Meetings</span></footer>

<script>
const H0 = 6, H1 = 24;            // 0600 -> 2400
const NH = H1 - H0;               // 18 hour rows
const THIN = 15;                  // px height of a compressed, event-free hour
let HH = [], OFF = [];            // per-hour heights and cumulative offsets (px)
let COMPRESS = true;              // "Fit" mode: event-free hours are compressed
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// read wall-clock digits off the ISO string; never new Date() on the value
const mins = iso => { const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?(+m[1])*60+(+m[2]):null; };
const hhmm = iso => { const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?m[1]+m[2]:''; };
// date-only parts, also by regex - never new Date() on the raw value
function ymd(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?[+m[1],+m[2],+m[3]]:null; }
function dowOf(dateStr){ const p=ymd(dateStr); return p? new Date(p[0],p[1]-1,p[2]).getDay() : 0; }
function durTxt(a,b){
  const s=mins(a),e=mins(b); if(s==null||e==null||e<=s) return '';
  const d=e-s; return d>=60 ? (d%60?`${Math.floor(d/60)}h${d%60}`:`${Math.floor(d/60)}h`) : `${d}m`;
}
function kindClass(t){
  const k=((t.meeting_type||'')+' '+(t.type||'')+' '+(t.kind||'')).toLowerCase();
  if(t.src==='class'||/class|lecture|recitation/.test(k)) return 'k-class';
  if(/research|serg|thesis|deep/.test(k)) return 'k-res';
  if(/admin|meeting|travel/.test(k)) return 'k-admin';
  return '';
}
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function clkTxt(){ const n=new Date();
  return String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0'); }

/* ------------------------------------------------------------------
   Meeting vs. task, and what "past" means for each.

   A meeting OCCUPIES a span of time. Once it is over it simply
   happened -- leaving it unchecked is not a debt you owe, so it must
   never be coloured like one. A task is a due INSTANT: an all-day
   item, a zero-length item, or anything the source marks type="Task".
   When a task's instant passes with the box unchecked, that IS a debt.

   This mirrors scripts/build_data.py, which stopped counting past
   meetings as overdue (it had inflated "overdue" to 96 from ~19).
   ------------------------------------------------------------------ */
function isMeeting(t){
  if((t.type||'')==='Task') return false;        // source says task
  if(t.src==='class') return true;               // class DB row
  if((t.type||'')==='Meeting') return true;      // source says meeting
  // Blank type: fall back to shape. A block of 30 minutes or more is a
  // real appointment; a 15-minute sliver is a self-scheduled work slot,
  // i.e. still a task you owe. (Verified against the live data: this
  // reads "Grad Resource Fair"/60m as a meeting and "Check Merch Store
  // Progress"/15m as a task, which the type field alone gets wrong.)
  const s=mins(t.date), e=mins(t.end);
  return s!=null && e!=null && (e-s)>=30;
}
// '', 'done', 'overdue' (task past due) or 'ended' (meeting already happened)
function statusOf(t, dayDate, isToday){
  if(t.done) return 'done';
  const cmp = dayDate.localeCompare(TODAY_DATE);
  let past;
  if(cmp < 0) past = true;                       // whole day is behind us
  else if(cmp > 0) past = false;                 // day is ahead
  else {
    const s=mins(t.date), e=mins(t.end);
    if(s==null) past = false;                    // all-day today: still live
    else past = (e!=null && e>s ? e : s) < nowMin();
  }
  if(!past) return '';
  return isMeeting(t) ? 'ended' : 'overdue';
}
const FLAG={done:'done', overdue:'overdue', ended:'ended'};

document.getElementById('clk').textContent = clkTxt();

let DAYS=[], IDX=0, TODAY_IDX=0, COUNTS=null, nowTimer=null, TODAY_DATE='';

Promise.all([
  fetch('../data/week.json?t='+Date.now()).then(r=>r.json()),
  fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).catch(()=>null)
]).then(([w, tasks])=>{
  DAYS = (w && w.days) || [];
  if(!DAYS.length) throw new Error('no days');
  COUNTS = tasks && tasks.counts || null;
  TODAY_IDX = Math.max(0, DAYS.findIndex(d=>d.is_today));
  TODAY_DATE = (w.today) || (DAYS[TODAY_IDX] && DAYS[TODAY_IDX].date) || '';
  IDX = TODAY_IDX;

  const g=new Date(w.generated);
  document.getElementById('gen').textContent =
    'synced '+String(g.getHours()).padStart(2,'0')+String(g.getMinutes()).padStart(2,'0');

  buildDots();
  wireNav();
  render();
})
.catch(()=>{ document.getElementById('grid').innerHTML =
  '<div class="empty">data not built yet</div>'; });

function buildDots(){
  const box=document.getElementById('dots');
  box.innerHTML = DAYS.map((d,i)=>
    `<button class="dot ${i===TODAY_IDX?'isnow':''}" data-i="${i}"
       title="${d.date} · ${d.items.length} item${d.items.length===1?'':'s'}">${DOW3[dowOf(d.date)][0]}</button>`
  ).join('');
  box.querySelectorAll('.dot').forEach(b=>
    b.addEventListener('click',()=>{ IDX=+b.dataset.i; render(); }));
}

function wireNav(){
  document.getElementById('prev').addEventListener('click',()=>{ if(IDX>0){IDX--;render();} });
  document.getElementById('next').addEventListener('click',()=>{ if(IDX<DAYS.length-1){IDX++;render();} });
  document.getElementById('tbtn').addEventListener('click',()=>{ IDX=TODAY_IDX; render(); });
  document.getElementById('fitbtn').addEventListener('click',()=>{ COMPRESS=!COMPRESS; render(); });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'  && IDX>0){ IDX--; render(); }
    else if(e.key==='ArrowRight' && IDX<DAYS.length-1){ IDX++; render(); }
    else if(e.key==='t' || e.key==='T'){ IDX=TODAY_IDX; render(); }
    else if(e.key==='f' || e.key==='F'){ COMPRESS=!COMPRESS; render(); }
    else return;
    e.preventDefault();
  });
  window.addEventListener('resize', ()=>render());
}

// px y-position of a wall-clock minute, honouring per-hour heights
function yOf(m){
  if(m <= H0*60) return 0;
  if(m >= H1*60) return OFF[NH];
  const h = Math.floor(m/60) - H0;
  return OFF[h] + ((m - (h+H0)*60)/60) * HH[h];
}

function render(){
  const day   = DAYS[IDX];
  const isToday = IDX===TODAY_IDX && !!day.is_today;
  const items = day.items || [];
  const parts = ymd(day.date) || [1970,1,1];

  // ---- header
  document.getElementById('dnum').textContent = MON[parts[1]-1]+' '+parts[2];
  document.getElementById('dow').textContent  = DOW[dowOf(day.date)] +
    (isToday ? ' · today' : '');
  // No vanity counter row: this header states WHICH day you are looking at,
  // not a tally of open/overdue/done. Those live in the triage widget.
  let sum = '';
  if(!isToday){
    const delta = IDX - TODAY_IDX;
    if(delta!==0) sum = `${delta>0?'+':''}${delta}d from today`;
  }
  document.getElementById('sum').textContent = sum;
  document.getElementById('clk').textContent = clkTxt();

  document.getElementById('prev').disabled = IDX===0;
  document.getElementById('next').disabled = IDX===DAYS.length-1;
  document.getElementById('tbtn').classList.toggle('on', isToday);
  const fb=document.getElementById('fitbtn');
  fb.classList.toggle('on', COMPRESS);
  fb.textContent = COMPRESS ? 'Fit' : 'Full';
  document.querySelectorAll('.dot').forEach(b=>
    b.classList.toggle('sel', +b.dataset.i===IDX));

  const timed  = items.filter(t=>mins(t.date)!=null);
  const allday = items.filter(t=>mins(t.date)==null);

  // ---- all-day strip
  const ad=document.getElementById('allday');
  if(allday.length){
    ad.style.display='flex';
    ad.innerHTML='<span class="lbl">All day</span>'+allday.map(t=>{
      const st=statusOf(t, day.date, isToday);
      return `<a class="ad ${st}" data-status="${st||'open'}" href="${t.url}" target="_blank">${esc(t.name)||'(untitled)'}</a>`;
    }).join('');
  } else { ad.style.display='none'; ad.innerHTML=''; }

  /* ---- event geometry -------------------------------------------------
     `end` is empty or equal to `start` for a lot of rows. We do NOT invent
     a duration for those: they are point-in-time items (hasSpan=false),
     drawn as a small marked block at their instant, sized by their text.
     ------------------------------------------------------------------- */
  const ev = timed.map(t=>{
    const s=mins(t.date); let e=mins(t.end);
    const hasSpan = (e!=null && e>s);
    return {t, s, e: hasSpan ? Math.min(e, H1*60) : s, hasSpan};
  }).sort((a,b)=> a.s-b.s || a.e-b.e);

  /* ---- 1. DEAD SPACE: compress hours that contain no event ------------
     Every hour 0600-2400 is still rendered and still labelled - nothing is
     hidden - but an hour with nothing in it collapses to THIN px so the
     busy part of the day gets the height. "Full" restores uniform rows. */
  const occ = new Array(NH).fill(false);
  ev.forEach(x=>{
    const a=x.s, b=x.hasSpan ? x.e : x.s+1;
    for(let h=0;h<NH;h++){
      const lo=(h+H0)*60, hi=lo+60;
      if(a < hi && b > lo) occ[h]=true;
    }
  });
  if(isToday){                                   // never squash the live hour
    const nh = Math.floor(nowMin()/60) - H0;
    if(nh>=0 && nh<NH) occ[nh]=true;
  }
  const nThin = COMPRESS ? occ.filter(o=>!o).length : 0;
  const nFull = NH - nThin;

  const shell=document.getElementById('scroll');
  shell.classList.remove('fits');
  const avail = shell.clientHeight - 24;         // grid bottom padding
  let hr = Math.floor((avail - nThin*THIN) / Math.max(1,nFull));
  hr = Math.max(30, Math.min(104, hr));          // floor 30px keeps text legible
  HH = occ.map(o => (COMPRESS && !o) ? THIN : hr);
  OFF = [0];
  for(let h=0;h<NH;h++) OFF.push(OFF[h]+HH[h]);

  document.getElementById('note').textContent = COMPRESS && nThin
    ? `${nThin} empty hour${nThin===1?'':'s'} compressed · F for full scale`
    : (COMPRESS ? 'full scale' : 'full scale · F to fit');

  // ---- hour rows
  const grid=document.getElementById('grid');
  let html='';
  const PART = h => h<12 ? 'MORNING' : h<17 ? 'AFTERNOON' : h<21 ? 'EVENING' : 'NIGHT';
  for(let h=H0; h<H1; h++){
    const i=h-H0;
    const wake = h>=7 && h<=22;
    const core = h>=9 && h<18;
    const night= h>=21;
    const newPart = h===H0 || PART(h)!==PART(h-1);
    const thin = HH[i]===THIN && COMPRESS && !occ[i];
    html += `<div class="hour ${h%2===0?'major':''} ${wake?'wake':''} ${core?'core':''} ${night?'night':''} ${newPart?'dpstart':''} ${thin?'thin':''}"
       data-h="${h}" style="height:${HH[i]}px">
       <span class="hl">${String(h).padStart(2,'0')}00</span>
       ${newPart?`<span class="dp">${PART(h)}</span>`:''}</div>`;
  }
  html += `<div class="hour" style="height:0"><span class="hl">2400</span></div>`;
  html += `<div class="layer" id="layer"></div>`;
  grid.innerHTML=html;

  /* ---- 2 + 3. NO TRUNCATION, NO OVERLAP -------------------------------
     Two coupled problems, solved by one converging loop.

     (a) The old code packed overlap columns ONCE, globally: a single
         overlapping pair halved the width of every block in the day,
         which is what was chopping the names. Packing must be per
         cluster, so only events that actually collide share the width.

     (b) A block whose name needs more lines than its time span allows
         must GROW downward - the alternative is clipping the name, and
         that is exactly what he complained about. But a grown block then
         collides with whatever is below it, which the first version of
         this fix did (3 overlapping boxes at 820x760).

     So: pack lanes in PIXEL space using each block's REAL rendered
     height (time span or wrapped text, whichever is taller), measure,
     re-pack, and repeat until the heights stop changing. Converges in
     2-3 passes because widths only ever shrink.
     ------------------------------------------------------------------ */
  const layer=document.getElementById('layer');
  const st_  = ev.map(x=>statusOf(x.t, day.date, isToday));

  ev.forEach((x,i)=>{
    x.top0 = yOf(x.s);
    x.minH = x.hasSpan ? Math.max(26, yOf(x.e) - x.top0 - 3) : 26;
    x.top  = x.top0;
    x.h    = x.minH;                             // provisional; measured below
    x.col  = 0; x.lanes = 1;
  });

  /* Two independent dimensions, handled separately - this is what the
     earlier attempts got wrong by mixing them:

     TIME decides the LANES. Classic interval packing on the real time
     spans, so genuinely concurrent items (the two 1310 rows) are always
     side by side and can never cover each other. Width depends only on
     time, so there is no width<->height feedback loop.

     PIXELS decide the VERTICAL NUDGE. A block whose name needs more
     lines than its time span allows must grow downward (the alternative
     is clipping the name). If that makes it run into the next block in
     its own lane, the next block is pushed down and marked .stacked -
     its real start time is still printed on the block.

     Very narrow tracks: a lane thinner than MINLANE cannot hold a name,
     so such a cluster falls back to fewer, wider lanes and stacks the
     surplus vertically instead of shredding every lane. */
  const MINLANE = 132;
  const track = Math.max(120, layer.clientWidth - 54);

  function packPx(){
    ev.forEach(x=>{ x.top = x.top0; x.stacked=false; });

    // ---- 1. time clusters + time lanes
    const clusters=[]; let ci=-1, tEnd=-1;
    ev.forEach(x=>{
      const xEnd = x.hasSpan ? x.e : x.s+1;
      if(x.s >= tEnd){ ci++; clusters[ci]={ends:[], items:[]}; tEnd=-1; }
      x.ci=ci;
      const C=clusters[ci];
      let placed=false;
      for(let i=0;i<C.ends.length;i++){
        if(C.ends[i] <= x.s){ C.ends[i]=xEnd; x.tlane=i; placed=true; break; }
      }
      if(!placed){ x.tlane=C.ends.length; C.ends.push(xEnd); }
      C.items.push(x);
      tEnd = Math.max(tEnd, xEnd);
    });

    // ---- 2. lane count per cluster, floored by readable width
    clusters.forEach(C=>{
      const want = Math.max(1, C.ends.length);
      const fits = Math.max(1, Math.floor(track / MINLANE));
      C.n = Math.min(want, Math.max(1, fits));
      C.items.forEach(x=>{ x.lanes=C.n; x.col=Math.min(x.tlane, C.n-1); });
    });

    /* ---- 3. pixel pass. A block that grew taller than its time span can
       run into ANY later block it horizontally overlaps - including a
       full-width block belonging to the next time cluster, which is what
       an earlier same-lane-only check missed (3 overlapping boxes at
       820x760). So compute each block's real px x-extent and push a
       block down past every earlier block it would otherwise cover. */
    const GUT=54, GAP=3;
    ev.forEach(x=>{
      x.px_w = track / x.lanes - 5;
      x.px_l = GUT + track * (x.col / x.lanes);
    });
    const done=[];
    ev.forEach(x=>{
      for(let pass=0; pass<ev.length+2; pass++){
        let moved=false;
        for(const p of done){
          const xo = x.px_l < p.px_l + p.px_w - 1 && p.px_l < x.px_l + x.px_w - 1;
          if(!xo) continue;
          if(x.top < p.top + p.h + GAP - 0.5 && p.top < x.top + x.h - 0.5){
            x.top = p.top + p.h + GAP; x.stacked=true; moved=true;
          }
        }
        if(!moved) break;
      }
      done.push(x);
    });
  }

  function paint(){
    layer.innerHTML = ev.map((x,i)=>{
      const t=x.t, n=x.lanes, wpct=100/n;
      const style = `top:${x.top}px;min-height:${x.minH}px;z-index:${10+i};`+
                    `width:calc((100% - var(--gut)) * ${wpct/100} - 5px);`+
                    `left:calc(var(--gut) + (100% - var(--gut)) * ${x.col*wpct/100});`;
      const range = hhmm(t.date) + (x.hasSpan ? '–'+hhmm(t.end) : '');
      const dur   = x.hasSpan ? durTxt(t.date,t.end) : '';
      const meta  = [range, dur, t.location||''].filter(Boolean).join(' · ');
      const st    = st_[i];
      const flag  = st ? `<span class="flag">${FLAG[st]}</span>` : '';
      return `<a class="ev ${kindClass(t)} ${st} ${x.hasSpan?'':'pt'}" data-status="${st||'open'}"
              data-min="${x.minH}" data-lane="${x.col}" data-lanes="${n}" data-start="${range}"
              style="${style}" href="${t.url}" target="_blank" title="${esc(t.name)}">
       <span class="et">${esc(t.name)||'(untitled)'}</span>
       <span class="erow"><span class="em">${meta}</span>${flag}</span>
     </a>`;
    }).join('');
    return [...layer.querySelectorAll('.ev')];
  }

  let blocks=[];
  /* Measure the height the wrapped text ACTUALLY needs. Note: .ev is
     overflow:visible (clipping is what we are trying to eliminate), and
     an overflow:visible box does not report spilled children in
     scrollHeight - so scrollHeight would silently under-report and the
     text would draw outside the block. Measure the real content bottom
     from the last child's rect instead. */
  function needH(b){
    const box=b.getBoundingClientRect();
    const kids=[...b.children];
    let bot=box.top;
    kids.forEach(k=>{ const r=k.getBoundingClientRect(); if(r.bottom>bot) bot=r.bottom; });
    const cs=getComputedStyle(b);
    return Math.ceil(bot - box.top + parseFloat(cs.paddingBottom) + 2*parseFloat(cs.borderTopWidth));
  }
  for(let pass=0; pass<6; pass++){
    packPx();
    blocks = paint();
    let changed=false;
    blocks.forEach((b,i)=>{
      const h = Math.max(ev[i].minH, needH(b));
      if(Math.abs(h - ev[i].h) > 0.5){ ev[i].h = h; changed=true; }
    });
    if(!changed) break;
  }
  // pin the converged heights and mark blocks that outgrew their time span
  blocks.forEach((b,i)=>{
    b.style.height = ev[i].h+'px';
    const grew = ev[i].h > ev[i].minH + 1;
    b.classList.toggle('grown', grew);
    b.dataset.grew = grew ? '1' : '0';
    // only call it "stacked" if it moved meaningfully off its true time;
    // a couple of px of nudge is not worth a visual marker
    const moved = ev[i].top - ev[i].top0 > 6;
    b.classList.toggle('stacked', moved);
    b.dataset.stacked = moved ? '1' : '0';
    b.dataset.shift = Math.round(ev[i].top - ev[i].top0);
  });
  // make sure a block that grew past 2400 is still reachable, not clipped
  const maxBot = ev.length ? Math.max(...ev.map(x=>x.top+x.h)) : 0;
  grid.style.paddingBottom = Math.max(22, Math.ceil(maxBot - OFF[NH]) + 14)+'px';

  if(!items.length){
    grid.insertAdjacentHTML('afterbegin',
      `<div class="empty">nothing scheduled ${isToday?'today':'this day'}</div>`);
  }

  // ---- now line (only meaningful on today)
  if(nowTimer){ clearInterval(nowTimer); nowTimer=null; }
  function drawNow(){
    document.querySelectorAll('.nowline,.nowtag').forEach(n=>n.remove());
    document.getElementById('clk').textContent = clkTxt();
    if(!isToday) return;
    const m=nowMin();
    if(m < H0*60 || m > H1*60) return;
    const y=yOf(m);
    grid.insertAdjacentHTML('beforeend',
      `<div class="nowline" style="top:${y}px"></div>
       <div class="nowtag" style="top:${y}px">${clkTxt()}</div>`);
  }
  drawNow(); nowTimer=setInterval(drawNow, 30000);

  // whole day is visible when it fits; otherwise centre on now (today) or top
  if(shell.scrollHeight <= shell.clientHeight+4){ shell.classList.add('fits'); shell.scrollTop=0; }
  else if(isToday){ const m=nowMin(); shell.scrollTop = (m>=H0*60&&m<=H1*60) ? Math.max(0, yOf(m)-180) : 0; }
  else { shell.scrollTop = 0; }
}
</script>
</body>
</html>

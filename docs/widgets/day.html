<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#232323;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --now:#e06c6c; --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a; --purple:#9a6dd7;
    --hr:52px;              /* height of one hour row */
    --gut:54px;             /* left time gutter */
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
       font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
         padding:14px 18px 11px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .dnum{font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1}
  .dow{font-size:10.5px;color:var(--dim);text-transform:uppercase;
       letter-spacing:.1em;margin-top:3px}
  .rt{text-align:right}
  .clk{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
       letter-spacing:-.01em}
  .meta{font-size:10.5px;color:var(--faint);margin-top:4px}

  /* day navigation */
  .nav{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-bottom:2px}
  .nb{background:var(--panel);border:1px solid var(--line);color:var(--ink);
      border-radius:5px;width:24px;height:22px;line-height:1;cursor:pointer;
      font-size:11px;display:flex;align-items:center;justify-content:center;
      font-family:inherit;padding:0}
  .nb:hover{border-color:var(--blue)}
  .nb:disabled{opacity:.3;cursor:default}
  .nb.today{width:auto;padding:0 8px;font-size:9.5px;text-transform:uppercase;
      letter-spacing:.09em;color:var(--dim)}
  .nb.today.on{color:var(--now);border-color:var(--now)}
  .dots{display:flex;gap:3px;margin:0 2px}
  .dot{width:20px;height:22px;border-radius:4px;border:1px solid transparent;
      background:transparent;cursor:pointer;color:var(--faint);font-family:inherit;
      font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:0;
      display:flex;align-items:center;justify-content:center}
  .dot:hover{color:var(--ink);border-color:var(--line)}
  .dot.sel{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
  .dot.isnow{color:var(--now)}
  .dot.busy::after{content:"";position:absolute}

  /* all-day strip */
  .allday{flex:0 0 auto;padding:7px 18px;border-bottom:1px solid var(--line);
          display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .allday .lbl{font-size:9.5px;color:var(--faint);text-transform:uppercase;
       letter-spacing:.07em;flex:0 0 auto;margin-right:2px}
  .ad{font-size:11.5px;background:var(--panel);border:1px solid var(--line);
      border-radius:4px;padding:2px 8px;color:var(--ink);text-decoration:none;
      display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ad:hover{border-color:var(--blue)}
  .ad.done{color:var(--faint);text-decoration:line-through}

  /* scrolling grid */
  .scroll{flex:1;overflow-y:auto;position:relative;min-height:0}
  .scroll.fits{overflow-y:hidden}
  .grid{position:relative;padding:0 18px 30px}
  .hour{position:relative;height:var(--hr);border-top:1px solid var(--hair)}
  .hour.major{border-top-color:var(--line)}
  .hour.night{background:linear-gradient(90deg,transparent,rgba(120,120,140,.035) 12%)}
  .hour.core{background:linear-gradient(90deg,transparent,rgba(91,147,211,.045) 12%)}
  .hour.dpstart{border-top:1px solid var(--line)}
  .hour .dp{position:absolute;right:4px;top:3px;z-index:3;font-size:8.5px;color:var(--faint);
       letter-spacing:.12em;text-transform:uppercase;opacity:.55}
  .hour .hl{position:absolute;left:0;top:-8px;width:calc(var(--gut) - 12px);
       text-align:right;font-size:10.5px;color:var(--faint);
       font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .hour.wake .hl{color:var(--dim)}
  .lane{position:absolute;left:var(--gut);right:0;top:0;bottom:0}

  /* events layer */
  .layer{position:absolute;left:18px;right:18px;top:0;bottom:0;pointer-events:none}
  .ev{position:absolute;left:var(--gut);pointer-events:auto;
      border-radius:5px;padding:5px 9px;text-decoration:none;color:var(--ink);
      background:var(--panel);border:1px solid var(--line);
      border-left:3px solid var(--blue);overflow:hidden;
      display:flex;flex-direction:column;gap:1px}
  .ev:hover{border-color:var(--blue);z-index:5}
  .ev.k-class{border-left-color:var(--gold)}
  .ev.k-res{border-left-color:var(--green)}
  .ev.k-admin{border-left-color:var(--purple)}
  .ev.done{opacity:.5}
  .ev.done .et{text-decoration:line-through}
  .et{font-size:12.5px;font-weight:500;line-height:1.25;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .em{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ew{font-size:10.5px;color:var(--faint);overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}

  /* now line */
  .nowline{position:absolute;left:calc(var(--gut) - 6px);right:0;height:0;
      border-top:1.5px solid var(--now);z-index:8;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;
      width:8px;height:8px;border-radius:50%;background:var(--now)}
  .nowtag{position:absolute;left:0;transform:translateY(-50%);
      font-size:9.5px;color:var(--now);font-variant-numeric:tabular-nums;
      font-weight:600;z-index:9;pointer-events:none}

  .empty{color:var(--faint);font-style:italic;padding:24px 18px;font-size:12.5px}
  footer{flex:0 0 auto;padding:7px 18px;border-top:1px solid var(--line);
         font-size:10px;color:var(--faint);display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
  <div><div class="dnum" id="dnum">—</div><div class="dow" id="dow"></div></div>
  <div class="nav" id="nav">
    <button class="nb" id="prev" title="Previous day (←)">&#9664;</button>
    <div class="dots" id="dots"></div>
    <button class="nb" id="next" title="Next day (→)">&#9654;</button>
    <button class="nb today" id="tbtn" title="Jump to today (T)">Today</button>
  </div>
  <div class="rt"><div class="clk" id="clk">----</div><div class="meta" id="sum"></div></div>
</header>
<div class="allday" id="allday" style="display:none"></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
<footer><span id="gen"></span><span id="src">Tasks &amp; Meetings</span></footer>

<script>
const H0 = 6, H1 = 24;            // 0600 -> 2400
let HR = 52;                      // recomputed on each render to fit the viewport
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// read wall-clock digits off the ISO string; never new Date() on the value
const mins = iso => { const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?(+m[1])*60+(+m[2]):null; };
const hhmm = iso => { const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?m[1]+m[2]:''; };
// date-only parts, also by regex - never new Date() on the raw value
function ymd(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?[+m[1],+m[2],+m[3]]:null; }
function dowOf(dateStr){ const p=ymd(dateStr); return p? new Date(p[0],p[1]-1,p[2]).getDay() : 0; }
function durTxt(a,b){
  const s=mins(a),e=mins(b); if(s==null||e==null||e<=s) return '';
  const d=e-s; return d>=60 ? (d%60?`${Math.floor(d/60)}h${d%60}`:`${Math.floor(d/60)}h`) : `${d}m`;
}
function kindClass(t){
  const k=((t.meeting_type||'')+' '+(t.type||'')+' '+(t.kind||'')).toLowerCase();
  if(t.src==='class'||/class|lecture|recitation/.test(k)) return 'k-class';
  if(/research|serg|thesis|deep/.test(k)) return 'k-res';
  if(/admin|meeting|travel/.test(k)) return 'k-admin';
  return '';
}
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function clkTxt(){ const n=new Date();
  return String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0'); }

document.getElementById('clk').textContent = clkTxt();

let DAYS=[], IDX=0, TODAY_IDX=0, COUNTS=null, nowTimer=null;

Promise.all([
  fetch('../data/week.json?t='+Date.now()).then(r=>r.json()),
  fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).catch(()=>null)
]).then(([w, tasks])=>{
  DAYS = (w && w.days) || [];
  if(!DAYS.length) throw new Error('no days');
  COUNTS = tasks && tasks.counts || null;
  TODAY_IDX = Math.max(0, DAYS.findIndex(d=>d.is_today));
  IDX = TODAY_IDX;

  const g=new Date(w.generated);
  document.getElementById('gen').textContent =
    'synced '+String(g.getHours()).padStart(2,'0')+String(g.getMinutes()).padStart(2,'0');

  buildDots();
  wireNav();
  render();
})
.catch(()=>{ document.getElementById('grid').innerHTML =
  '<div class="empty">data not built yet</div>'; });

function buildDots(){
  const box=document.getElementById('dots');
  box.innerHTML = DAYS.map((d,i)=>
    `<button class="dot ${i===TODAY_IDX?'isnow':''}" data-i="${i}"
       title="${d.date} · ${d.items.length} item${d.items.length===1?'':'s'}">${DOW3[dowOf(d.date)][0]}</button>`
  ).join('');
  box.querySelectorAll('.dot').forEach(b=>
    b.addEventListener('click',()=>{ IDX=+b.dataset.i; render(); }));
}

function wireNav(){
  document.getElementById('prev').addEventListener('click',()=>{ if(IDX>0){IDX--;render();} });
  document.getElementById('next').addEventListener('click',()=>{ if(IDX<DAYS.length-1){IDX++;render();} });
  document.getElementById('tbtn').addEventListener('click',()=>{ IDX=TODAY_IDX; render(); });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'  && IDX>0){ IDX--; render(); }
    else if(e.key==='ArrowRight' && IDX<DAYS.length-1){ IDX++; render(); }
    else if(e.key==='t' || e.key==='T'){ IDX=TODAY_IDX; render(); }
    else return;
    e.preventDefault();
  });
  window.addEventListener('resize', ()=>render());
}

function render(){
  const day   = DAYS[IDX];
  const isToday = IDX===TODAY_IDX && !!day.is_today;
  const items = day.items || [];
  const parts = ymd(day.date) || [1970,1,1];

  // ---- header
  document.getElementById('dnum').textContent = MON[parts[1]-1]+' '+parts[2];
  document.getElementById('dow').textContent  = DOW[dowOf(day.date)] +
    (isToday ? ' · today' : '');
  const done = items.filter(t=>t.done).length;
  let sum = `${done}/${items.length} done`;
  if(isToday && COUNTS) sum += ` · ${COUNTS.open} open · ${COUNTS.overdue} overdue`;
  else {
    const delta = IDX - TODAY_IDX;
    sum += delta===0 ? '' : ` · ${delta>0?'+':''}${delta}d`;
  }
  document.getElementById('sum').textContent = sum;
  document.getElementById('clk').textContent = clkTxt();

  document.getElementById('prev').disabled = IDX===0;
  document.getElementById('next').disabled = IDX===DAYS.length-1;
  document.getElementById('tbtn').classList.toggle('on', isToday);
  document.querySelectorAll('.dot').forEach(b=>
    b.classList.toggle('sel', +b.dataset.i===IDX));

  const timed  = items.filter(t=>mins(t.date)!=null);
  const allday = items.filter(t=>mins(t.date)==null);

  // ---- all-day strip
  const ad=document.getElementById('allday');
  if(allday.length){
    ad.style.display='flex';
    ad.innerHTML='<span class="lbl">All day</span>'+allday.map(t=>
      `<a class="ad ${t.done?'done':''}" href="${t.url}" target="_blank">${esc(t.name)||'(untitled)'}</a>`).join('');
  } else { ad.style.display='none'; ad.innerHTML=''; }

  // ---- fit the whole 0600-2400 span into the available height (no scroll)
  const shell=document.getElementById('scroll');
  shell.classList.remove('fits');
  (function fit(){
    const avail=shell.clientHeight - 30;              // bottom padding
    const need =(H1-H0);
    const px   = Math.floor(avail/need);
    HR = Math.max(26, Math.min(64, px));              // floor 26px keeps text legible
    document.documentElement.style.setProperty('--hr', HR+'px');
  })();

  // ---- hour rows
  const grid=document.getElementById('grid');
  let html='';
  const PART = h => h<12 ? 'MORNING' : h<17 ? 'AFTERNOON' : h<21 ? 'EVENING' : 'NIGHT';
  for(let h=H0; h<H1; h++){
    const wake = h>=7 && h<=22;
    const core = h>=9 && h<18;
    const night= h>=21;
    const newPart = h===H0 || PART(h)!==PART(h-1);
    html += `<div class="hour ${h%2===0?'major':''} ${wake?'wake':''} ${core?'core':''} ${night?'night':''} ${newPart?'dpstart':''}">
       <span class="hl">${String(h).padStart(2,'0')}00</span>
       ${newPart?`<span class="dp">${PART(h)}</span>`:''}</div>`;
  }
  html += `<div class="hour" style="height:0"><span class="hl">2400</span></div>`;
  html += `<div class="layer" id="layer"></div>`;
  grid.innerHTML=html;

  // ---- lay out events, side-by-side when they overlap
  const top = m => ((m - H0*60)/60)*HR;
  const ev = timed.map(t=>{
    const s=mins(t.date);
    let e=mins(t.end); if(e==null||e<=s) e=s+45;      // default 45m block
    return {t, s, e:Math.min(e, H1*60)};
  }).sort((a,b)=> a.s-b.s || a.e-b.e);

  // greedy column packing for overlaps
  const cols=[];
  ev.forEach(x=>{
    let placed=false;
    for(let i=0;i<cols.length;i++){
      if(cols[i] <= x.s){ cols[i]=x.e; x.col=i; placed=true; break; }
    }
    if(!placed){ x.col=cols.length; cols.push(x.e); }
  });
  const ncol = Math.max(1, cols.length);

  const layer=document.getElementById('layer');
  layer.innerHTML = ev.map(x=>{
    const t=x.t;
    const h=Math.max(24, ((x.e-x.s)/60)*HR - 3);
    const wpct = 100/ncol;
    const style = `top:${top(x.s)}px;height:${h}px;`+
                  `width:calc((100% - var(--gut)) * ${wpct/100} - 4px);`+
                  `left:calc(var(--gut) + (100% - var(--gut)) * ${x.col*wpct/100});`;
    const showMeta = h>=34, showWhere = h>=56 && t.location;
    return `<a class="ev ${kindClass(t)} ${t.done?'done':''}" style="${style}"
              href="${t.url}" target="_blank">
       <span class="et">${esc(t.name)||'(untitled)'}</span>
       ${showMeta?`<span class="em">${hhmm(t.date)}${t.end?'–'+hhmm(t.end):''}${durTxt(t.date,t.end)?' · '+durTxt(t.date,t.end):''}</span>`:''}
       ${showWhere?`<span class="ew">${esc(t.location)}</span>`:''}
     </a>`;
  }).join('');

  if(!items.length){
    grid.insertAdjacentHTML('afterbegin',
      `<div class="empty">nothing scheduled ${isToday?'today':'this day'}</div>`);
  }

  // ---- now line (only meaningful on today)
  if(nowTimer){ clearInterval(nowTimer); nowTimer=null; }
  function drawNow(){
    document.querySelectorAll('.nowline,.nowtag').forEach(n=>n.remove());
    document.getElementById('clk').textContent = clkTxt();
    if(!isToday) return;
    const m=nowMin();
    if(m < H0*60 || m > H1*60) return;
    const y=top(m);
    grid.insertAdjacentHTML('beforeend',
      `<div class="nowline" style="top:${y}px"></div>
       <div class="nowtag" style="top:${y}px">${clkTxt()}</div>`);
  }
  drawNow(); nowTimer=setInterval(drawNow, 30000);

  // whole day is visible when it fits; otherwise centre on now (today) or top
  if(shell.scrollHeight <= shell.clientHeight+4){ shell.classList.add('fits'); shell.scrollTop=0; }
  else if(isToday){ const m=nowMin(); shell.scrollTop = (m>=H0*60&&m<=H1*60) ? Math.max(0, top(m)-180) : 0; }
  else { shell.scrollTop = 0; }
}
</script>
</body>
</html>

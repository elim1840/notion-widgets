<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#252525;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --blue:#5b93d3; --gold:#c9a227; --red:#e06c6c; --green:#5fa87a; --purple:#9a6dd7;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);padding:11px 14px 12px;
       font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .hd{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;
      padding-bottom:6px;margin-bottom:9px;border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .hd b{font-weight:inherit}
  svg{display:block;width:100%;height:auto}
  .none{color:var(--faint);font-style:italic;padding:16px 0;font-size:12px}
  .foot{margin-top:9px;padding-top:8px;border-top:1px solid var(--hair);
        display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
        font-size:9.5px;color:var(--faint);line-height:1.55}
  .foot b{color:var(--dim);font-weight:500}
  .alert{color:var(--red)}
  text{font-family:inherit;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="hd"><span>Task pipeline · stage flow</span><b id="asof"></b></div>
<div id="out"><div class="none">loading…</div></div>

<script>
const ISO=/(\d{4}-\d{2}-\d{2})/;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayOf = v => { const m=ISO.exec(String(v==null?'':v)); return m?m[1]:null; };
const D = iso => new Date(iso+'T12:00:00');
const fmtShort = iso => { const d=D(iso); return String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()]; };
const pct = (a,b) => b>0 ? (a/b*100) : 0;
const p1 = v => (Math.round(v*10)/10).toFixed(1)+'%';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

Promise.all([
  fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()),
  fetch('../data/week.json?t='+Date.now()).then(r=>r.json()).catch(()=>null)
]).then(([T,W])=>{
  const out=document.getElementById('out');
  const c = T.counts||{};
  const total   = Number(c.total)||0;
  const open    = Number(c.open)||0;
  const done    = Number(c.done)||0;
  const overdue = Number(c.overdue)||0;

  if(!total){ out.innerHTML='<div class="none">no task rows — nothing to funnel</div>'; return; }

  const asOf = dayOf(T.today) || dayOf(T.generated);
  document.getElementById('asof').textContent = asOf ? 'as of '+fmtShort(asOf) : '';

  // ---- Stage 3: work actually surfaced into the active 7-day window.
  // Deduped across week.json task rows + tasks.json today_items, by Notion url
  // (falling back to name|date). Class rows are excluded — they are not tasks.
  const seen = new Set();
  const key = it => String(it && it.url ? it.url : (it&&it.name||'')+'|'+(dayOf(it&&it.date)||''));
  if(W && Array.isArray(W.days)){
    W.days.forEach(d=>(d.items||[]).forEach(it=>{ if(it && it.src!=='class') seen.add(key(it)); }));
  }
  (Array.isArray(T.today_items)?T.today_items:[]).forEach(it=>seen.add(key(it)));
  const active = Math.min(seen.size, open);

  // ---- 14-day observed throughput (drives the stall banner)
  const hist=(Array.isArray(T.history)?T.history:[])
    .map(h=>({d:dayOf(h.date),total:Number(h.total)||0,done:Number(h.done)||0}))
    .filter(h=>h.d).sort((a,b)=>a.d<b.d?-1:1);
  const closed14 = hist.reduce((a,h)=>a+h.done,0);
  const winDays  = hist.length;

  // ---- funnel stages. Each is a "reached this stage" count, monotone by
  // construction (total >= open >= active, and done is the lifetime terminal).
  const stages=[
    {k:'captured', lab:'Captured',            sub:'every task row on file',       n:total,  col:'var(--blue)'},
    {k:'notstart', lab:'Not started',         sub:'accepted, awaiting work',      n:open,   col:'var(--purple)'},
    {k:'active',   lab:'Active this week',    sub:'scheduled into the 7-day window', n:active, col:'var(--gold)'},
    {k:'done',     lab:'Done',                sub:'completed, lifetime to date',  n:done,   col:'var(--green)'}
  ];

  // ---- geometry
  const W_=640, PAD=6, BH=44, GAP=26, LAB=118;
  const H_ = PAD*2 + stages.length*BH + (stages.length-1)*GAP;
  const maxW = W_ - LAB - 8;
  const minW = 26;                 // so a 3-item band is still visible & clickable
  const wOf = n => n<=0 ? 0 : Math.max(minW, (n/total)*maxW);
  const cx  = LAB + maxW/2;

  let g='';
  const tops=[];
  stages.forEach((s,i)=>{
    const y = PAD + i*(BH+GAP);
    const w = wOf(s.n);
    const x = cx - w/2;
    tops.push({y,w,x});
    const share = pct(s.n,total);

    // band
    g += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${BH}" rx="3"
            fill="${s.col}" fill-opacity="0.20" stroke="${s.col}" stroke-width="1"/>`;
    // left-hand stage label rail
    g += `<rect x="0" y="${y}" width="2" height="${BH}" fill="${s.col}"/>`;
    g += `<text x="9" y="${y+17}" font-size="11.5" fill="var(--ink)">${esc(s.lab)}</text>`;
    g += `<text x="9" y="${y+31}" font-size="9" fill="var(--faint)">${esc(s.sub)}</text>`;
    // count + share, centred in the band
    const big = s.n>=1000?18:20;
    const narrow = w < 96;   // band too thin to stack a caption under the number
    g += `<text x="${cx}" y="${narrow ? y+29 : y+24}" font-size="${big}" font-weight="600" letter-spacing="-0.03em"
            text-anchor="middle" fill="var(--ink)">${s.n.toLocaleString()}</text>`;
    if(narrow){
      g += `<text x="${(x+w+7).toFixed(1)}" y="${y+27}" font-size="9" fill="var(--faint)">${p1(share)} of ${total}</text>`;
    } else {
      g += `<text x="${cx}" y="${y+37}" font-size="9" text-anchor="middle" fill="var(--faint)">${p1(share)} of ${total}</text>`;
    }

    // overdue sliver inside the Not started band — the stall, drawn to scale
    if(s.k==='notstart' && overdue>0 && s.n>0){
      const ow = w * Math.min(1, overdue/s.n);
      g += `<rect x="${x.toFixed(1)}" y="${y}" width="${ow.toFixed(1)}" height="${BH}" rx="3"
              fill="var(--red)" fill-opacity="0.14"/>`;
      g += `<text x="${(x+5).toFixed(1)}" y="${y+BH-6}" font-size="8.5" fill="var(--red)">${overdue} overdue</text>`;
    }
  });

  // ---- connectors + conversion labels in each gap
  for(let i=0;i<stages.length-1;i++){
    const a=stages[i], b=stages[i+1], ta=tops[i], tb=tops[i+1];
    const y1=ta.y+BH, y2=tb.y;
    // tapering side walls
    g += `<path d="M ${ta.x.toFixed(1)} ${y1} L ${tb.x.toFixed(1)} ${y2}
                  M ${(ta.x+ta.w).toFixed(1)} ${y1} L ${(tb.x+tb.w).toFixed(1)} ${y2}"
            stroke="var(--line)" stroke-width="1" fill="none"/>`;
    // funnel body fill between the two bands
    g += `<path d="M ${ta.x.toFixed(1)} ${y1} L ${(ta.x+ta.w).toFixed(1)} ${y1}
                  L ${(tb.x+tb.w).toFixed(1)} ${y2} L ${tb.x.toFixed(1)} ${y2} Z"
            fill="var(--hair)" fill-opacity="0.55"/>`;

    const isLast = (i===stages.length-2);
    const conv   = isLast ? pct(b.n,total) : pct(b.n,a.n);
    const lost   = Math.max(0, a.n-b.n);
    const label  = isLast
        ? p1(conv)+' end-to-end'
        : p1(conv)+' carry-through';
    const sub    = isLast
        ? done+' of '+total+' ever closed'
        : '−'+lost+' drop-off';
    const warn   = conv < 25;
    const col    = warn ? 'var(--red)' : 'var(--dim)';

    const my = y1 + (y2-y1)/2;
    g += `<text x="${(cx).toFixed(1)}" y="${(my-1).toFixed(1)}" font-size="10" font-weight="600"
            text-anchor="middle" fill="${col}">${label}</text>`;
    g += `<text x="${(cx).toFixed(1)}" y="${(my+10).toFixed(1)}" font-size="8.5"
            text-anchor="middle" fill="var(--faint)">${esc(sub)}</text>`;
  }

  const svg = `<svg viewBox="0 0 ${W_} ${H_}" role="img"
      aria-label="Task pipeline funnel: ${stages.map(s=>s.lab+' '+s.n).join(', ')}">${g}</svg>`;

  const stallTxt = winDays
    ? (closed14===0
        ? `<b class="alert">${closed14} closed in the last ${winDays} days.</b> The funnel is not leaking — it is not flowing.`
        : `<b>${closed14} closed</b> in the last ${winDays} days.`)
    : 'no history window on file';

  out.innerHTML = svg + `<div class="foot">
      <span>${stallTxt}</span>
      <span><b>${overdue}</b> of ${open} open are overdue · ${p1(pct(overdue,open))}</span>
    </div>`;
}).catch(e=>{
  document.getElementById('out').innerHTML =
    '<div class="none">data unavailable — '+esc(e&&e.message||e)+'</div>';
});
</script>
</body>
</html>

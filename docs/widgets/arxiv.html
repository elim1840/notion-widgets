<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arXiv</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#252525;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --blue:#5b93d3; --gold:#c9a227; --red:#e06c6c; --green:#5fa87a; --purple:#9a6dd7;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--ink);padding:12px 14px;
       font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

  h1{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
     font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  h1 em{font-style:normal;font-weight:400;letter-spacing:.06em;white-space:nowrap;
        font-variant-numeric:tabular-nums}
  h1 em.stale{color:var(--gold)}

  ul{list-style:none;margin-top:8px}
  li{padding:7px 0;border-bottom:1px solid var(--hair);display:flex;gap:9px;align-items:baseline}
  li:last-child{border-bottom:0}
  .dt{font-size:9.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;
      font-variant-numeric:tabular-nums;padding-top:1px;width:46px}
  .body{flex:1;min-width:0}
  a.t{color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:500;
      line-height:1.35;display:block;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  a.t:hover{color:var(--blue)}
  .au{font-size:10.5px;color:var(--dim);margin-top:2px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
  .cat{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
       border:1px solid var(--line);border-radius:2px;padding:1px 4px;
       flex:0 0 auto;align-self:flex-start;margin-top:1px}

  .note{margin-top:9px;padding:11px 12px;border:1px solid var(--line);border-radius:3px;
        background:var(--panel);font-size:11.5px;color:var(--dim);line-height:1.55}
  .note b{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
          margin-bottom:4px;color:var(--gold)}
  .note.bad b{color:var(--red)}
  .note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
             color:var(--faint);display:block;margin-top:6px;word-break:break-all;
             padding-top:6px;border-top:1px solid var(--hair)}
  .loading{margin-top:12px;font-size:11.5px;color:var(--faint)}
  [hidden]{display:none !important}
</style>
</head>
<body>

<!--
  ===================================================================
  DATA SOURCE — read this before "fixing" the widget.

  arXiv's public API (export.arxiv.org/api/query) returns Atom XML and
  sends NO Access-Control-Allow-Origin header. Verified 2026-09-07 from
  a real browser context: both http:// and https:// direct fetches fail
  with "TypeError: Failed to fetch" (CORS), as does rss.arxiv.org.
  Free proxies were also tested and rejected:
      api.allorigins.win  -> timeout / TypeError
      api.codetabs.com    -> TypeError
      corsproxy.io        -> HTTP 401, now requires an API key
      thingproxy          -> TypeError
      r.jina.ai           -> 200, but returns lossy rendered markdown,
                             is rate-limited, and is a third party in
                             the trust path. Rejected.
  So this widget reads a LOCAL snapshot at ../data/arxiv.json, which a
  scheduled job must write. Until that job runs the widget renders an
  honest "awaiting first sync" panel — it never fabricates papers.

  Expected shape of docs/data/arxiv.json:
  {
    "generated": "2026-09-08T04:00:00Z",
    "query": "cat:astro-ph.IM OR cat:eess.SP",
    "entries": [
      { "id": "http://arxiv.org/abs/2609.01234v1",
        "title": "...",
        "authors": ["A. Author", "B. Author"],
        "published": "2026-09-04T17:02:11Z",
        "primary_category": "astro-ph.IM" }
    ]
  }

  Populate it with a cron job (arXiv asks for >=3 s between requests):
    curl -sL --compressed \
      "https://export.arxiv.org/api/query?search_query=cat%3Aastro-ph.IM+OR+cat%3Aeess.SP&sortBy=submittedDate&sortOrder=descending&max_results=8" \
      | python3 -c 'import sys,json,xml.etree.ElementTree as ET; \
        ns={"a":"http://www.w3.org/2005/Atom"}; r=ET.parse(sys.stdin).getroot(); \
        print(json.dumps({"generated":__import__("datetime").datetime.utcnow().isoformat()+"Z", \
        "query":"cat:astro-ph.IM OR cat:eess.SP", \
        "entries":[{"id":e.find("a:id",ns).text.strip(), \
        "title":" ".join(e.find("a:title",ns).text.split()), \
        "authors":[a.find("a:name",ns).text for a in e.findall("a:author",ns)], \
        "published":e.find("a:published",ns).text, \
        "primary_category":e.find("{http://arxiv.org/schemas/atom}primary_category").get("term")} \
        for e in r.findall("a:entry",ns)]}))' > docs/data/arxiv.json
  ===================================================================
-->

<h1><span>arXiv &middot; SDA / astrodynamics</span><em id="stamp">loading</em></h1>

<div id="loading" class="loading">Reading local snapshot&hellip;</div>
<ul id="list" hidden></ul>
<div id="note" class="note" hidden></div>

<script>
var SRC       = '../data/arxiv.json';
var MAX_SHOW  = 8;
var STALE_HRS = 36;

function pad(n,w){ n = String(Math.floor(n)); while(n.length < w) n = '0' + n; return n; }

/* "2026-09-04T17:02:11Z" -> "04 SEP" */
var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function shortDate(iso){
  var d = new Date(iso);
  if(isNaN(d)) return '\u2014';
  return pad(d.getUTCDate(),2) + ' ' + MON[d.getUTCMonth()];
}
/* 24-hour zero-padded stamp for the header */
function syncStamp(iso){
  var d = new Date(iso);
  if(isNaN(d)) return 'synced \u2014';
  return 'synced ' + pad(d.getUTCDate(),2) + MON[d.getUTCMonth()] + ' '
       + pad(d.getUTCHours(),2) + pad(d.getUTCMinutes(),2) + 'Z';
}
function authorLine(a){
  if(!a || !a.length) return '';
  if(a.length === 1) return a[0];
  if(a.length === 2) return a[0] + ', ' + a[1];
  return a[0] + ', ' + a[1] + ' +' + (a.length - 2);
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
/* Force the human abstract page, never the API URL. */
function absUrl(id){
  var m = String(id).match(/abs\/(.+)$/);
  return m ? 'https://arxiv.org/abs/' + m[1] : String(id).replace(/^http:/, 'https:');
}

function showNote(kind, title, html, code){
  document.getElementById('loading').hidden = true;
  document.getElementById('list').hidden = true;
  var n = document.getElementById('note');
  n.hidden = false;
  n.className = 'note' + (kind === 'bad' ? ' bad' : '');
  n.innerHTML = '<b>' + title + '</b>' + html + (code ? '<code>' + code + '</code>' : '');
}

function render(d){
  var e = (d && d.entries) || [];
  if(!e.length){
    return showNote('warn', 'Awaiting first sync',
      'The local snapshot exists but contains no entries yet. The scheduled arXiv job has not written any papers.',
      SRC);
  }
  document.getElementById('list').innerHTML = e.slice(0, MAX_SHOW).map(function(p){
    return '<li>'
      + '<span class="dt">' + shortDate(p.published) + '</span>'
      + '<div class="body">'
      +   '<a class="t" href="' + esc(absUrl(p.id)) + '" target="_blank" rel="noopener">'
      +     esc(p.title) + '</a>'
      +   '<div class="au">' + esc(authorLine(p.authors)) + '</div>'
      + '</div>'
      + '<span class="cat">' + esc(p.primary_category || '') + '</span>'
      + '</li>';
  }).join('');

  var st = document.getElementById('stamp');
  st.textContent = syncStamp(d.generated);
  var ageH = (Date.now() - new Date(d.generated).getTime()) / 3600000;
  if(!isNaN(ageH) && ageH > STALE_HRS){
    st.className = 'stale';
    st.textContent += ' \u00b7 stale';
  }

  document.getElementById('loading').hidden = true;
  document.getElementById('note').hidden = true;
  document.getElementById('list').hidden = false;
}

fetch(SRC, { cache: 'no-store' })
  .then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(function(err){
    document.getElementById('stamp').textContent = 'no snapshot';
    showNote('warn', 'Awaiting first sync',
      'No local snapshot found yet. arXiv\u2019s API sends no CORS header, so this widget '
    + 'cannot call it from the browser \u2014 verified 2026-09-07, direct fetch fails with '
    + '<em>TypeError: Failed to fetch</em> over both http and https. A scheduled job must write '
    + '<strong>docs/data/arxiv.json</strong> (the recipe is in this file\u2019s HTML comment). '
    + 'Nothing is shown until it does.<br><span style="color:var(--faint)">Reason: '
    + esc(err.message) + '</span>',
      'GET ' + SRC);
  });
</script>
</body>
</html>

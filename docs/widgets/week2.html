<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>This week</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#252525;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --now:#e06c6c; --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a; --purple:#9a6dd7;
    --gut:52px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
       font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
         padding:9px 14px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .tools{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  .tools .grp{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
       border-radius:5px;padding:2px}
  .tools button{font:inherit;font-size:10px;letter-spacing:.03em;padding:3px 7px;
       border:0;border-radius:3.5px;background:transparent;color:var(--dim);cursor:pointer;
       font-variant-numeric:tabular-nums}
  .tools button:hover{background:var(--hair);color:var(--ink)}
  .tools button.on{background:var(--blue);color:#fff}
  .rng{font-size:15px;font-weight:600;letter-spacing:-.015em}
  .hint{font-size:10px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}

  /* time ruler */
  .ruler{display:grid;grid-template-columns:var(--gut) 1fr;flex:0 0 auto;
         border-bottom:1px solid var(--line);background:var(--bg)}
  .ruler .sp{border-right:1px solid var(--line)}
  .ticks{position:relative;height:17px}
  .ruler .tw{position:relative;height:17px;overflow:hidden}
  .ticks span{position:absolute;top:3px;font-size:9px;color:var(--faint);
       transform:translateX(-50%);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .ticks span.e0{transform:translateX(0)}
  .ticks span.e1{transform:translateX(-100%)}

  .body{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}

  /* ---------- GANTT TIMELINE ---------- */
  .row{display:grid;grid-template-columns:var(--gut) 1fr;
       border-bottom:1px solid var(--line);min-height:46px}
  .row:last-child{border-bottom:0}
  .row.today{background:rgba(91,147,211,.06)}
  .row.wknd{background:rgba(127,127,127,.045)}
  .row.wknd .dname{color:var(--faint)}
  .row.wknd.today{background:rgba(91,147,211,.06)}

  .dcol{border-right:1px solid var(--line);padding:7px 8px 5px;text-align:right}
  .dname{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
         font-weight:600}
  .dnum{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.1;
        font-variant-numeric:tabular-nums}
  .row.today .dnum{color:var(--blue)}
  .cnt{font-size:9px;color:var(--faint);margin-top:1px}

  /* lane spans the FULL 1fr column (no padding) so gridlines align with the ruler */
  .lane{position:relative;padding:6px 0 6px;overflow:hidden}
  .lane .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--hair);z-index:0}
  .lane .gl.mj{background:var(--line)}
  .lane .noww{position:absolute;top:0;bottom:0;width:1.5px;background:var(--now);z-index:6}
  .lane .noww::before{content:'';position:absolute;top:0;left:-2.25px;
       width:6px;height:6px;border-radius:50%;background:var(--now)}
  .stack{position:relative}

  /* proportional bar: width is ALWAYS duration-derived, never inflated for text */
  .ev{position:absolute;height:21px;border-radius:3px;padding:0 6px;
      font-size:11px;line-height:19px;text-decoration:none;
      background:var(--panel);border:1px solid var(--line);
      border-left:3px solid var(--blue);color:var(--ink);z-index:2;
      overflow:hidden;min-width:3px}
  .ev .lab{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      font-variant-numeric:tabular-nums;line-height:19px}
  .ev .lab b{font-weight:600;color:var(--dim);margin-right:5px;font-size:10.5px}
  /* label does not fit inside -> spill it to the right (or left near the edge) */
  .ev.out,.ev.outl,.ev.half{overflow:visible}
  .ev.half .tin{display:block;font-weight:600;color:var(--dim);font-size:10.5px;
      line-height:19px;font-variant-numeric:tabular-nums}
  .ev.half .lab.nm{position:absolute;left:100%;top:0;margin-left:6px;color:var(--ink);
      text-overflow:clip;pointer-events:none;max-width:none}
  .ev.out  .lab{position:absolute;left:100%;top:0;margin-left:6px;color:var(--ink);
      text-overflow:clip;pointer-events:none;max-width:none}
  .ev.outl .lab{position:absolute;right:100%;top:0;margin-right:6px;color:var(--ink);
      text-overflow:clip;pointer-events:none;max-width:none;text-align:right}
  .ev:hover{z-index:9;box-shadow:0 2px 12px rgba(0,0,0,.35);filter:brightness(1.14)}
  .ev.k-class{background:rgba(201,162,39,.17);border-color:rgba(201,162,39,.38);
      border-left-color:var(--gold)}
  .ev.k-res  {background:rgba(95,168,122,.17);border-color:rgba(95,168,122,.38);
      border-left-color:var(--green)}
  .ev.k-admin{background:rgba(154,109,215,.17);border-color:rgba(154,109,215,.38);
      border-left-color:var(--purple)}
  .ev.k-mil  {background:rgba(224,108,108,.17);border-color:rgba(224,108,108,.38);
      border-left-color:var(--now)}
  .ev.k-oth  {background:rgba(91,147,211,.17);border-color:rgba(91,147,211,.38);
      border-left-color:var(--blue)}
  .ev.done{opacity:.42}
  .ev.done .lab{text-decoration:line-through}

  /* all-day items = full-span band, the gantt way */
  .tray{display:flex;gap:4px;flex-wrap:wrap;padding:5px 8px 0 2px;position:relative;z-index:3}
  .ad{font-size:10px;line-height:15px;background:var(--panel);
      border:1px dashed var(--line);border-left:3px solid var(--faint);
      border-radius:3px;padding:0 6px;color:var(--dim);text-decoration:none;
      max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ad.k-class{border-left-color:var(--gold)} .ad.k-res{border-left-color:var(--green)}
  .ad.k-admin{border-left-color:var(--purple)} .ad.k-mil{border-left-color:var(--now)}
  .ad.k-oth{border-left-color:var(--blue)}
  .ad:hover{border-color:var(--blue);color:var(--ink)}
  .ad.done{text-decoration:line-through;opacity:.55}
  .adl{font-size:9px;color:var(--faint);letter-spacing:.08em;line-height:15px;
      text-transform:uppercase;padding-right:2px}

  footer{flex:0 0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
         padding:6px 16px;border-top:1px solid var(--line);font-size:9.5px;color:var(--faint)}
  .key{display:inline-flex;align-items:center;gap:4px}
  .sw{width:8px;height:8px;border-radius:2px;display:inline-block}
  .empty{color:var(--faint);font-style:italic;padding:20px 16px;font-size:12px}

  /* LIST mode */
  .lrow{display:grid;grid-template-columns:var(--gut) 1fr;border-bottom:1px solid var(--hair)}
  .lrow:last-child{border-bottom:0}
  .lrow.today{background:rgba(91,147,211,.05)}
  .litems{padding:6px 10px 8px 0;display:flex;flex-direction:column;gap:3px}
  .li{display:flex;gap:9px;align-items:baseline;font-size:12px;text-decoration:none;
      color:inherit;padding:2px 0;border-left:2.5px solid transparent;padding-left:8px}
  .li:hover{background:var(--panel)}
  .li.k-class{border-left-color:var(--gold)}
  .li.k-res{border-left-color:var(--green)}
  .li.k-admin{border-left-color:var(--purple)}
  .li.k-mil{border-left-color:var(--now)}
  .li .lt{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;
      flex:0 0 82px;font-weight:500}
  .li .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li.done .ln{text-decoration:line-through;color:var(--faint)}
  .li .lw{font-size:10px;color:var(--faint);flex:0 0 auto;max-width:120px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lnone{font-size:11px;color:var(--faint);font-style:italic;padding:3px 0 3px 8px}

  /* COLUMNS mode */
  .cols7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:100%}
  .c7{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-width:0}
  .c7:last-child{border-right:0}
  .c7.today{background:rgba(91,147,211,.05)}
  .c7h{padding:6px 7px 5px;border-bottom:1px solid var(--line);text-align:center}
  .c7h .dn{font-size:9px;letter-spacing:.09em;color:var(--dim);font-weight:600}
  .c7h .dd{font-size:15px;font-weight:600;line-height:1.15}
  .c7.today .dd{color:var(--blue)}
  .c7b{flex:1;overflow-y:auto;padding:5px 5px 8px;display:flex;flex-direction:column;gap:4px}
  .cc{background:var(--panel);border:1px solid var(--line);border-left:2.5px solid var(--blue);
      border-radius:4px;padding:4px 6px;font-size:10.5px;line-height:1.3;
      text-decoration:none;color:inherit;display:block}
  .cc:hover{border-color:var(--blue)}
  .cc.k-class{border-left-color:var(--gold)}
  .cc.k-res{border-left-color:var(--green)}
  .cc.k-admin{border-left-color:var(--purple)}
  .cc.k-mil{border-left-color:var(--now)}
  .cc.done{opacity:.45}
  .cc .ct{font-variant-numeric:tabular-nums;color:var(--dim);font-size:9.5px;display:block;
      letter-spacing:.01em}
  .cc .cl{display:block;margin-top:3px;font-size:9.5px;color:var(--faint);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cc .cl::before{content:"\1F4CD  ";opacity:.6;font-size:8.5px}
  .cc .cn{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
      overflow:hidden;overflow-wrap:anywhere}

  /* AGENDA mode — one continuous stream */
  .ag{padding:4px 14px 14px}
  .agd{display:flex;align-items:baseline;gap:9px;padding:11px 0 5px;
       border-bottom:1px solid var(--line);margin-bottom:5px}
  .agd .n{font-size:14px;font-weight:600}
  .agd .s{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
  .agd.today .n{color:var(--blue)}
  .agi{display:flex;gap:10px;align-items:baseline;padding:4px 0 4px 8px;font-size:12.5px;
       text-decoration:none;color:inherit;border-left:2.5px solid transparent}
  .agi:hover{background:var(--panel)}
  .agi.k-class{border-left-color:var(--gold)}
  .agi.k-res{border-left-color:var(--green)}
  .agi.k-admin{border-left-color:var(--purple)}
  .agi.k-mil{border-left-color:var(--now)}
  .agi .t{font-variant-numeric:tabular-nums;color:var(--dim);flex:0 0 84px;font-size:11.5px}
  .agi .n2{flex:1;min-width:0}
  .agi.done .n2{text-decoration:line-through;color:var(--faint)}
  .agi .w{font-size:10.5px;color:var(--faint)}

  /* BY TYPE */
  .catsec{padding:9px 14px 4px}
  .cath{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;
     letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
     padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .cath .dot{width:8px;height:8px;border-radius:2px}
  .cath .k{margin-left:auto;color:var(--faint);font-weight:400;letter-spacing:0}
  .cati{display:grid;grid-template-columns:44px 46px 1fr;gap:9px;align-items:baseline;
     padding:3px 0;font-size:12.5px;text-decoration:none;color:inherit}
  .cati:hover{background:var(--panel)}
  .cati .d{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .cati .t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11.5px}
  .cati .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cati.done .n{text-decoration:line-through;color:var(--faint)}

  /* FREE TIME */
  .frow{display:grid;grid-template-columns:var(--gut) 1fr;border-bottom:1px solid var(--hair);
        min-height:46px}
  .frow:last-child{border-bottom:0}
  .frow.today{background:rgba(91,147,211,.05)}
  .fbar{position:relative;margin:12px 10px 12px 0;height:20px;border-radius:3px;
        background:rgba(224,108,108,.13);overflow:hidden}
  .fseg{position:absolute;top:0;bottom:0;background:rgba(95,168,122,.30);
        border-left:1px solid rgba(95,168,122,.6)}
  .fseg span{position:absolute;left:4px;top:2px;font-size:9.5px;color:var(--ink);
        white-space:nowrap;opacity:.85}
  .ftot{position:absolute;right:6px;top:3px;font-size:10px;color:var(--dim);
        font-variant-numeric:tabular-nums}

  /* LOAD mode */
  .ldrow{display:grid;grid-template-columns:var(--gut) 1fr 46px;align-items:center;
      border-bottom:1px solid var(--hair);min-height:44px}
  .ldrow:last-child{border-bottom:0}
  .ldrow.today{background:rgba(91,147,211,.05)}
  .bars{display:flex;gap:2px;height:22px;align-items:flex-end;padding:0 10px 0 0}
  .bseg{height:100%;border-radius:2px;min-width:3px}
  .ldn{text-align:right;padding-right:12px;font-size:15px;font-weight:600;
      font-variant-numeric:tabular-nums}
  .ldn.zero{color:var(--faint);font-weight:400}
</style>
</head>
<body>
<header>
  <span class="rng" id="rng">—</span>
  <span class="tools">
    <span class="grp" id="rangegrp">
      <button data-r="6,24">0600-2400</button>
      <button data-r="7,22">0700-2200</button>
      <button data-r="8,20">0800-2000</button>
      <button data-r="9,18">0900-1800</button>
      <button data-r="auto">Fit</button>
    </span>
    <span class="grp" id="scopegrp">
      <button data-s="today">Today</button>
      <button data-s="week">This week</button>
      <button data-s="next">Next</button>
    </span>
    <span class="grp" id="modegrp">
      <button data-m="time">Timeline</button>
      <button data-m="list">List</button>
      <button data-m="cols">Columns</button>
      <button data-m="agenda">Agenda</button>
      <button data-m="cat">By type</button>
      <button data-m="free">Free time</button>
      <button data-m="load">Load</button>
    </span>
  </span>
  <span class="hint" id="tot"></span>
</header>
<div class="ruler"><div class="sp"></div><div class="tw"><div class="ticks" id="ticks"></div></div></div>
<div class="body" id="body"></div>
<footer>
  <span class="key"><i class="sw" style="background:var(--gold)"></i>Class</span>
  <span class="key"><i class="sw" style="background:var(--green)"></i>Research</span>
  <span class="key"><i class="sw" style="background:var(--purple)"></i>Admin</span>
  <span class="key"><i class="sw" style="background:var(--now)"></i>Military</span>
  <span class="key"><i class="sw" style="background:var(--blue)"></i>Other</span>
  <span style="flex:1"></span><span id="gen"></span>
</footer>

<script>
let H0=6, H1=24;                         // adjustable time window
let MODE='time';
let SCOPE='week';                        // today | week | next
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const mins=iso=>{const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?(+m[1])*60+(+m[2]):null;};
const hhmm=iso=>{const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?m[1]+m[2]:'';};
const pct=m=>((m-H0*60)/((H1-H0)*60))*100;

/* ---- gantt helpers -------------------------------------------------- */
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif';
let _cv=null, _mc={};
function textW(s,weight,size){
  const key=weight+'|'+size+'|'+s; if(_mc[key]!=null) return _mc[key];
  if(!_cv) _cv=document.createElement('canvas').getContext('2d');
  _cv.font=weight+' '+size+'px '+FONT;
  return _mc[key]=_cv.measureText(s).width;
}
// no `end` in the feed -> estimate a duration from the kind of thing it is.
function estDur(e){
  const k=((e.kind||'')+' '+(e.type||'')+' '+(e.meeting_type||'')+' '+(e.name||'')).toLowerCase();
  if(e.src==='class'||/lecture/.test(k)) return 90;
  if(/recitation|seminar|office hours/.test(k)) return 60;
  if(/retreat|weekend|fair|picnic|outing|crawl|party|dinner|breakfast|banquet|social/.test(k)) return 120;
  if(/meeting|orientation|reorientation|training|visiting|pub|registering|group/.test(k)) return 60;
  return 30;
}
function span(e){
  const s=mins(e.date); if(s==null) return null;
  let en=mins(e.end), est=false;
  if(en==null||en<=s){ est=true; en=s+estDur(e); }
  return {s,en,est};
}
const durTxt=m=>m>=60?(m/60).toFixed(m%60?1:0)+'h':m+'m';

function kind(e){
  const k=((e.kind||'')+' '+(e.type||'')+' '+(e.meeting_type||'')).toLowerCase();
  if(e.src==='class'||/class|lecture|recitation/.test(k)) return 'k-class';
  if(/research|serg|aeroastro|thesis|marstotable|draper/.test(k)) return 'k-res';
  if(/admin|tpp|meeting/.test(k)) return 'k-admin';
  if(/military|army/.test(k)) return 'k-mil';
  return '';
}
const KCOL={'k-class':'var(--gold)','k-res':'var(--green)','k-admin':'var(--purple)',
            'k-mil':'var(--now)','':'var(--blue)'};

let DATA=null;
let LANEW=600;                 // measured px width of the timeline lane column
const RPAD=12;                 // breathing room at the right edge for spilled labels
function measureLane(){
  const l=document.querySelector('.body .lane');
  const w = l ? l.clientWidth : ((document.getElementById('body').clientWidth||700)-52);
  return Math.max(160, w-RPAD);
}

function autoRange(days){
  let lo=24*60, hi=0, any=false;
  days.forEach(d=>d.items.forEach(e=>{
    const s=mins(e.date); if(s==null) return;
    any=true; let en=mins(e.end); if(en==null||en<=s) en=s+50;
    lo=Math.min(lo,s); hi=Math.max(hi,en);
  }));
  if(!any) return [8,20];
  return [Math.max(0,Math.floor(lo/60)-1), Math.min(24,Math.ceil(hi/60)+1)];
}

function paint(){
  const d=DATA;
  const allDays=d.days||[];
  const today=d.today;

  // SCOPE filters which days render. 'next' rolls forward from today so the
  // widget stays useful on a Friday, when the rest of "this week" is behind you.
  let days=allDays;
  if(SCOPE==='today'){
    const t=allDays.filter(x=>x.date===today);
    days = t.length?t:allDays;
  } else if(SCOPE==='next'){
    const i=allDays.findIndex(x=>x.date===today);
    days = i>=0 ? allDays.slice(i) : allDays;
  }

  const body=document.getElementById('body');
  const ruler=document.querySelector('.ruler');
  if(!days.length){ body.innerHTML='<div class="empty">no week data</div>'; return; }

  const a=new Date(days[0].date+'T12:00:00'), b=new Date(days[days.length-1].date+'T12:00:00');
  document.getElementById('rng').textContent = (days.length===1)
    ? `${DOW[a.getDay()]} ${MON[a.getMonth()]} ${a.getDate()}`
    : `${MON[a.getMonth()]} ${a.getDate()} \u2013 ${MON[b.getMonth()]} ${b.getDate()}`;
  let n=0; days.forEach(x=>n+=x.items.length);
  document.getElementById('tot').textContent = n+' events';

  const now=new Date(), nowM=now.getHours()*60+now.getMinutes();
  ruler.style.display = (MODE==='time'||MODE==='free') ? '' : 'none';
  document.querySelector('footer').style.display = MODE==='load' ? 'none' : '';

  // ---------------- TIME RULER (timeline + free time) ----------------
  if(MODE==='time'||MODE==='free'){
    let tk=''; const step=(H1-H0)>10?2:1;
    if(MODE==='time'){
      const px=m=>((m-H0*60)/((H1-H0)*60))*LANEW;
      for(let h=H0; h<=H1; h+=step){
        const cls = h===H0?'e0':(h>=H1-(step-1)?'e1':'');
        tk += `<span class="${cls}" style="left:${px(h*60).toFixed(2)}px">${String(h).padStart(2,'0')}00</span>`;
      }
    } else {
      for(let h=H0; h<=H1; h+=step){
        const cls = h===H0?'e0':(h>=H1-(step-1)?'e1':'');
        tk += `<span class="${cls}" style="left:${pct(h*60)}%">${String(h).padStart(2,'0')}00</span>`;
      }
    }
    document.getElementById('ticks').innerHTML=tk;
    if(MODE==='free') document.getElementById('ticks').style.width='';
  }

  // ---------------- TIMELINE (gantt) ----------------
  if(MODE==='time'){
    const step=(H1-H0)>10?2:1;
    const LW=LANEW;
    const T0=H0*60, T1=H1*60, SPAN=T1-T0;
    const px=m=>((m-T0)/SPAN)*LW;
    const ROWH=25, BARH=21;

    // shared gridlines: minor every hour, major on every labelled hour
    let gl=''; for(let h=H0; h<=H1; h++){
      if(h===H0) continue;
      const mj=((h-H0)%step===0)?' mj':'';
      gl+=`<span class="gl${mj}" style="left:${px(h*60).toFixed(2)}px"></span>`;
    }

    body.innerHTML = days.map(day=>{
      const dt=new Date(day.date+'T12:00:00');
      const wknd=[0,6].includes(dt.getDay());
      const timed=day.items.filter(e=>mins(e.date)!=null)
                           .sort((a,b)=>mins(a.date)-mins(b.date));
      const allday=day.items.filter(e=>mins(e.date)==null);

      const rowEnd=[];                       // right-most px consumed per lane row
      const bars=timed.map(e=>{
        const sp=span(e); if(!sp) return '';
        let {s,en,est}=sp;
        if(en<=T0 || s>=T1) return '';       // fully outside the window
        const cs=Math.max(s,T0), ce=Math.min(en,T1);
        const l=px(cs), w=Math.max(4, px(ce)-px(cs));

        const time=hhmm(e.date), name=(e.name||'(untitled)');
        // trim absurdly long names before measuring — they never fit anywhere
        const short=name.length>64?name.slice(0,63).replace(/\s+\S*$/,'')+'\u2026':name;
        const tW=textW(time,'600',10.5), nW=textW(short,'400',11), lw=tW+5+nW;

        // 3 tiers, cheapest first. The bar width NEVER changes to suit the text.
        //   in   : whole "HHMM name" fits inside the bar
        //   half : only "HHMM" fits inside; name spills to the right
        //   out  : nothing fits; whole label sits to the right (or left at the edge)
        let mode='in', lo=l, hi=l+w;
        if(lw+14>w){
          if(tW+13<=w && l+w+8+nW<=LW){ mode='half'; hi=l+w+8+nW; }
          else if(l+w+8+lw<=LW){ mode='out';  hi=l+w+8+lw; }
          else if(l-8-lw>=0){     mode='outl'; lo=l-8-lw; }
          else { mode='out'; hi=l+w+8+lw; }   // last resort: let it clip at the edge
        }
        let r=0; while(rowEnd[r]!=null && rowEnd[r]>lo-6) r++;
        rowEnd[r]=hi;

        const lab = mode==='half'
          ? `<b class="tin">${time}</b><span class="lab nm">${esc(short)}</span>`
          : `<span class="lab"><b>${time}</b>${esc(short)}</span>`;
        const cls = mode==='in' ? '' : mode;
        return `<a class="ev ${kind(e)||'k-oth'} ${mode==='in'?'':mode} ${e.done?'done':''}"
          style="left:${l.toFixed(2)}px;width:${w.toFixed(2)}px;top:${(r*ROWH).toFixed(0)}px;height:${BARH}px"
          href="${e.url}" target="_blank"
          title="${esc(time)}\u2013${String(Math.floor(en/60)%24).padStart(2,'0')}${String(en%60).padStart(2,'0')} \u00b7 ${durTxt(en-s)}${est?' (est)':''}\n${esc(name)}">${lab}</a>`;
      }).join('');

      const depth=Math.max(1,rowEnd.length);
      const stackH=depth*ROWH-(ROWH-BARH);
      const nowline = day.is_today && nowM>=T0 && nowM<=T1
        ? `<span class="noww" style="left:${px(nowM).toFixed(2)}px"></span>` : '';
      const tray = allday.length
        ? `<div class="tray"><span class="adl">all day</span>`+
          allday.map(e=>`<a class="ad ${kind(e)||'k-oth'} ${e.done?'done':''}" href="${e.url}"
             target="_blank" title="${esc(e.name)}">${esc(e.name)}</a>`).join('')+`</div>` : '';

      return `<div data-today="${day.is_today?1:0}" class="row ${day.is_today?'today':''} ${wknd?'wknd':''}">
        <div class="dcol"><div class="dname">${DOW[dt.getDay()]}</div>
          <div class="dnum">${dt.getDate()}</div>
          ${day.items.length?`<div class="cnt">${day.items.length}</div>`:''}</div>
        <div class="lane">${gl}${nowline}
          <div class="stack" style="height:${stackH}px">${bars}</div>${tray}</div></div>`;
    }).join('');
  }

  // ---------------- LIST ----------------
  else if(MODE==='list'){
    body.innerHTML = days.map(day=>{
      const dt=new Date(day.date+'T12:00:00');
      const items=[...day.items].sort((x,y)=>{
        const a=mins(x.date), b=mins(y.date);
        if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1;
        return a-b;
      });
      const rows = items.length ? items.map(e=>{
        const s0=mins(e.date);
        const t = s0==null ? '\u2014'
                : (e.end && mins(e.end)>s0 ? hhmm(e.date)+'\u2013'+hhmm(e.end) : hhmm(e.date));
        return `<a class="li ${kind(e)} ${e.done?'done':''}" href="${e.url}" target="_blank">
          <span class="lt">${t}</span><span class="ln">${esc(e.name)||'(untitled)'}</span>
          ${e.location?`<span class="lw">${esc(e.location)}</span>`:''}</a>`;
      }).join('') : '<div class="lnone">clear</div>';
      return `<div data-today="${day.is_today?1:0}" class="lrow ${day.is_today?'today':''}">
        <div class="dcol"><div class="dname">${DOW[dt.getDay()]}</div>
          <div class="dnum">${dt.getDate()}</div>
          ${day.items.length?`<div class="cnt">${day.items.length}</div>`:''}</div>
        <div class="litems">${rows}</div></div>`;
    }).join('');
  }

  // ---------------- COLUMNS ----------------
  else if(MODE==='cols'){
    body.innerHTML = `<div class="cols7">` + days.map(day=>{
      const dt=new Date(day.date+'T12:00:00');
      const items=[...day.items].sort((x,y)=>{
        const a=mins(x.date), b=mins(y.date);
        if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1; return a-b;});
      const cards = items.length ? items.map(e=>{
        const s0=mins(e.date);
        const t = s0==null ? 'ALL DAY'
                : (e.end && mins(e.end)>s0 ? hhmm(e.date)+'\u2013'+hhmm(e.end) : hhmm(e.date));
        return `<a class="cc ${kind(e)} ${e.done?'done':''}" href="${e.url}" target="_blank"
             title="${esc(t)} ${esc(e.name)}${e.location?' \u00b7 '+esc(e.location):''}">
           <span class="ct">${t}</span>
           <span class="cn">${esc(e.name)||'(untitled)'}</span>
           ${e.location?`<span class="cl">${esc(e.location)}</span>`:''}</a>`;
      }).join('') : `<div class="lnone">—</div>`;
      return `<div data-today="${day.is_today?1:0}" class="c7 ${day.is_today?'today':''}">
        <div class="c7h"><div class="dn">${DOW[dt.getDay()]}</div>
          <div class="dd">${dt.getDate()}</div></div>
        <div class="c7b">${cards}</div></div>`;
    }).join('') + `</div>`;
  }

  // ---------------- AGENDA (continuous stream) ----------------
  else if(MODE==='agenda'){
    body.innerHTML = `<div class="ag">` + days.map(day=>{
      if(!day.items.length) return '';
      const dt=new Date(day.date+'T12:00:00');
      const items=[...day.items].sort((x,y)=>{
        const a=mins(x.date), b=mins(y.date);
        if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1; return a-b;});
      return `<div data-today="${day.is_today?1:0}" class="agd ${day.is_today?'today':''}">
          <span class="n">${DOW[dt.getDay()]} ${dt.getDate()}</span>
          <span class="s">${MON[dt.getMonth()]} &middot; ${day.items.length} item${day.items.length>1?'s':''}</span>
        </div>` +
        items.map(e=>{
          const s0=mins(e.date);
          const t = s0==null ? '\u2014'
                  : (e.end && mins(e.end)>s0 ? hhmm(e.date)+'\u2013'+hhmm(e.end) : hhmm(e.date));
          return `<a class="agi ${kind(e)} ${e.done?'done':''}" href="${e.url}" target="_blank">
          <span class="t">${t}</span>
          <span class="n2">${esc(e.name)||'(untitled)'}</span>
          ${e.location?`<span class="w">${esc(e.location)}</span>`:''}</a>`;}).join('');
    }).join('') + `</div>`;
  }

  // ---------------- BY TYPE ----------------
  else if(MODE==='cat'){
    const LBL={'k-class':'Class','k-res':'Research','k-admin':'Admin','k-mil':'Military','':'Other'};
    const buckets={};
    days.forEach(day=>{
      const dt=new Date(day.date+'T12:00:00');
      day.items.forEach(e=>{
        const k=kind(e); (buckets[k]=buckets[k]||[]).push({e,dt,d:day});
      });
    });
    const order=['k-class','k-res','k-admin','k-mil',''];
    body.innerHTML = order.filter(k=>buckets[k]).map(k=>{
      const rows=buckets[k].sort((a,b)=>
        a.d.date.localeCompare(b.d.date) || ((mins(a.e.date)??1e9)-(mins(b.e.date)??1e9)));
      return `<div class="catsec">
        <div class="cath"><span class="dot" style="background:${KCOL[k]}"></span>
          ${LBL[k]}<span class="k">${rows.length}</span></div>` +
        rows.map(({e,dt})=>`<a class="cati ${e.done?'done':''}" href="${e.url}" target="_blank">
          <span class="d">${DOW[dt.getDay()]} ${dt.getDate()}</span>
          <span class="t">${mins(e.date)==null?'—':hhmm(e.date)}</span>
          <span class="n">${esc(e.name)||'(untitled)'}</span></a>`).join('') + `</div>`;
    }).join('');
  }

  // ---------------- FREE TIME ----------------
  else if(MODE==='free'){
    const DAY_S=H0*60, DAY_E=H1*60, MINGAP=60;
    body.innerHTML = days.map(day=>{
      const dt=new Date(day.date+'T12:00:00');
      const busy=day.items.filter(e=>mins(e.date)!=null).map(e=>{
        const s=mins(e.date); let en=mins(e.end); if(en==null||en<=s) en=s+50;
        return [Math.max(s,DAY_S), Math.min(en,DAY_E)];
      }).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);
      const merged=[];
      busy.forEach(b=>{
        if(merged.length && b[0]<=merged[merged.length-1][1])
          merged[merged.length-1][1]=Math.max(merged[merged.length-1][1], b[1]);
        else merged.push([...b]);
      });
      const gaps=[]; let cur=DAY_S;
      merged.forEach(([a,b])=>{ if(a-cur>=MINGAP) gaps.push([cur,a]); cur=Math.max(cur,b); });
      if(DAY_E-cur>=MINGAP) gaps.push([cur,DAY_E]);
      const total=gaps.reduce((t,[a,b])=>t+(b-a),0);
      const segs=gaps.map(([a,b])=>{
        const l=((a-DAY_S)/(DAY_E-DAY_S))*100, w=((b-a)/(DAY_E-DAY_S))*100;
        const hrs=(b-a)/60;
        return `<span class="fseg" style="left:${l}%;width:${w}%">${
          w>13?`<span>${String(Math.floor(a/60)).padStart(2,'0')}00 · ${hrs>=1?hrs.toFixed(hrs%1?1:0)+'h':''}</span>`:''}</span>`;
      }).join('');
      return `<div data-today="${day.is_today?1:0}" class="frow ${day.is_today?'today':''}">
        <div class="dcol"><div class="dname">${DOW[dt.getDay()]}</div>
          <div class="dnum">${dt.getDate()}</div></div>
        <div style="position:relative"><div class="fbar">${segs}</div>
          <span class="ftot">${(total/60).toFixed(total%60?1:0)}h free</span></div></div>`;
    }).join('');
  }

  // ---------------- LOAD ----------------
  else {
    const max=Math.max(1,...days.map(d=>d.items.length));
    body.innerHTML = days.map(day=>{
      const dt=new Date(day.date+'T12:00:00');
      const byk={};
      day.items.forEach(e=>{const k=kind(e); byk[k]=(byk[k]||0)+1;});
      const segs=Object.entries(byk).map(([k,v])=>
        `<span class="bseg" style="background:${KCOL[k]};flex:${v}"></span>`).join('');
      const w=(day.items.length/max)*100;
      return `<div data-today="${day.is_today?1:0}" class="ldrow ${day.is_today?'today':''}">
        <div class="dcol"><div class="dname">${DOW[dt.getDay()]}</div>
          <div class="dnum">${dt.getDate()}</div></div>
        <div class="bars" style="width:${Math.max(4,w)}%">${segs}</div>
        <div class="ldn ${day.items.length?'':'zero'}">${day.items.length||'—'}</div></div>`;
    }).join('');
  }

  const g=new Date(d.generated);
  document.getElementById('gen').textContent =
    'synced '+String(g.getHours()).padStart(2,'0')+String(g.getMinutes()).padStart(2,'0');
}

// two-pass: paint once to create the lane, measure its real px width,
// then repaint if the assumed width was wrong. Keeps bars pixel-exact.
function render(){
  paint();
  if(MODE!=='time') return;
  const w=measureLane();
  if(Math.abs(w-LANEW)>0.5){ LANEW=w; paint(); }
  const lane=document.querySelector('.body .lane');
  document.getElementById('ticks').style.width = lane ? lane.clientWidth+'px' : '';
}
let _rz=null;
addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{ if(DATA) render(); },90); });

// ---- controls
document.querySelectorAll('#rangegrp button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#rangegrp button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(b.dataset.r==='auto'){ const [lo,hi]=autoRange(DATA.days); H0=lo; H1=hi; }
    else { const [lo,hi]=b.dataset.r.split(',').map(Number); H0=lo; H1=hi; }
    localStorage.setItem('wk_range', b.dataset.r);
    render();
  };
});
document.querySelectorAll('#modegrp button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#modegrp button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); MODE=b.dataset.m;
    localStorage.setItem('wk_mode', MODE);
    render();
  };
});

document.querySelectorAll('#scopegrp button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#scopegrp button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); SCOPE=b.dataset.s;
    localStorage.setItem('wk_scope', SCOPE);
    render();
    if(SCOPE==='today') scrollToToday();
  };
});

// Scroll the current day to the top of the scroll area.
function scrollToToday(){
  const body=document.getElementById('body');
  const el=body.querySelector('[data-today="1"]');
  if(el && body){ body.scrollTop = Math.max(0, el.offsetTop - 2); }
}

fetch('../data/week.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  const savedR=localStorage.getItem('wk_range')||'6,24';
  const savedM=localStorage.getItem('wk_mode')||'time';
  const rb=document.querySelector(`#rangegrp button[data-r="${savedR}"]`)||document.querySelector('#rangegrp button');
  rb.classList.add('on');
  if(savedR==='auto'){const [lo,hi]=autoRange(d.days); H0=lo; H1=hi;}
  else {const [lo,hi]=savedR.split(',').map(Number); H0=lo; H1=hi;}
  const mb=document.querySelector(`#modegrp button[data-m="${savedM}"]`)||document.querySelector('#modegrp button');
  mb.classList.add('on'); MODE=savedM;

  // Default scope is 'today' so the widget opens on the current day rather than
  // Monday. On a Thursday, a Mon-start grid buries today below the fold.
  SCOPE=localStorage.getItem('wk_scope')||'today';
  const sb=document.querySelector(`#scopegrp button[data-s="${SCOPE}"]`)||document.querySelector('#scopegrp button[data-s="today"]');
  sb.classList.add('on');

  render();
  if(SCOPE==='today') scrollToToday();
})
.catch(()=>{document.getElementById('body').innerHTML='<div class="empty">data not built yet</div>';});
</script>

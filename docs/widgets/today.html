<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --accent:#5b93d3; --red:#e06c6c; --green:#5fa87a; --amber:#c9a227;
    --gold:#c9a227; --purple:#9a7fd0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#eeedea;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    padding:14px 14px 10px; -webkit-font-smoothing:antialiased;
  }

  /* ---------- header: instrument panel ----------
     Three panels (LOCAL / DATE / CAMBRIDGE) split by hairline rules, with a
     5-day forecast strip welded on underneath. Reads like a gauge cluster,
     not a card. Every number is tabular so the 1s clock tick never jitters. */
  .head{margin-bottom:12px;border:1px solid var(--line);border-radius:9px;
        background:var(--panel);overflow:hidden}
  .hp{display:grid;grid-template-columns:1fr 1fr 1fr;
      grid-template-areas:"loc date wx"}
  .pan{padding:11px 12px 12px;min-width:0;border-left:1px solid var(--hair)}
  .pan:first-child{border-left:0}
  .p-loc{grid-area:loc}.p-date{grid-area:date}.p-wx{grid-area:wx}

  .mlbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
        line-height:1;overflow-wrap:anywhere}
  .sublbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
          line-height:1;margin-top:7px;overflow-wrap:anywhere}

  .clock{font-size:34px;font-weight:300;line-height:1;margin-top:9px;
         letter-spacing:-.01em;font-variant-numeric:tabular-nums;
         display:flex;align-items:baseline;gap:0}
  /* Dimmed colon, like a station clock -- the digits read as the number, the
     separator recedes. Slight negative margins keep the glyph optically tight. */
  .clock .cn{color:var(--faint);font-weight:200;margin:0 1px;
             position:relative;top:-1px}
  .clock .sec{font-size:18px;font-weight:300;color:var(--dim);margin-left:7px;
              font-variant-numeric:tabular-nums}

  .dow{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
       line-height:1.05;margin-top:9px;overflow-wrap:anywhere}
  .dstr{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.1;
        font-variant-numeric:tabular-nums}
  .dmeta{font-size:9.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;
         margin-top:7px;line-height:1.35;font-variant-numeric:tabular-nums;
         overflow-wrap:anywhere}

  .temp{font-size:26px;font-weight:400;line-height:1;margin-top:9px;
        font-variant-numeric:tabular-nums;
        display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .temp .ic{font-size:15px}
  .temp .u{font-size:12px;color:var(--dim);font-weight:400}
  .cond{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.3;
        overflow-wrap:anywhere}
  .mstats{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:9px;
          letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
          line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .mstats b{color:var(--ink);font-weight:500;letter-spacing:.02em}

  /* 5-day strip: five equal columns, hairline rules, no wasted padding.
     Precip is shown only at >=20% -- below that it is noise. */
  .fc{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hair)}
  .fcd{padding:6px 2px 7px;text-align:center;min-width:0;
       border-left:1px solid var(--hair)}
  .fcd:first-child{border-left:0}
  .fcd .dy{font-size:9px;letter-spacing:.09em;text-transform:uppercase;
           color:var(--dim);line-height:1}
  .fcd.now .dy{color:var(--ink);font-weight:600}
  .fcd .ic{font-size:12px;line-height:1;margin-top:4px}
  .fcd .hl{font-size:10.5px;line-height:1;margin-top:4px;color:var(--dim);
           font-variant-numeric:tabular-nums}
  .fcd .hl b{color:var(--ink);font-weight:600}
  .fcd .pp{font-size:9px;line-height:1;margin-top:3px;color:var(--accent);
           font-variant-numeric:tabular-nums}

  /* Narrow sidebar: 3-across needs ~520px. Below that, LOCAL|DATE stay side by
     side and the weather panel takes a full-width second row -- laid out
     HORIZONTALLY (temp left, micro-stats right) so the second row costs ~55px
     instead of ~120px. Density is the point; nothing is padding for its own sake. */
  @media (max-width:519px){
    .hp{grid-template-columns:1fr 1fr;grid-template-areas:"loc date" "wx wx"}
    .p-wx{border-left:0;border-top:1px solid var(--hair);
          display:flex;align-items:center;gap:12px;padding:9px 12px 10px}
    .p-wx .mlbl{display:none}
    .wxL{flex:0 0 auto;min-width:0}
    .temp{margin-top:0}
    .cond{margin-top:3px}
    .mstats{margin-top:0;flex:1 1 0;min-width:0;gap:3px 10px}
  }
  @media (max-width:339px){
    .pan{padding:10px 10px 11px}
    .clock{font-size:29px}
    .clock .sec{font-size:16px}
    .p-wx{gap:10px;padding:9px 10px 10px}
    .temp{font-size:23px}
  }

  /* ---------- NOW strip: the one thing you look at ---------- */
  /* NOW on the left, NEXT on the right. Two panels, always both shown, so
     "what am I in" and "what's coming" never hide each other. */
  /* Actionable weather line -- what to carry, not what to know. */
  .wxadv{font-size:10.5px;color:var(--accent);margin-top:7px;line-height:1.35;
         overflow-wrap:anywhere}

  /* NOW stacked ABOVE NEXT -- flat rows, not two squeezed boxes. Side-by-side
     halved the width available for names and forced them to wrap badly. */
  .np{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px}
  .now{display:grid;grid-template-columns:74px 1fr;gap:11px;align-items:baseline;
       padding:9px 11px;border-radius:8px;
       background:var(--panel);border:1px solid var(--line);
       border-left:3px solid var(--accent)}
  .now.nx{border-left-color:var(--amber)}
  .now.late{border-left-color:var(--red);background:rgba(224,108,108,.07)}
  /* Left rail: label above the countdown. Right side: name, then time+room. */
  .now .lft{grid-column:1}
  .now .rgt{grid-column:2;min-width:0}
  .now .lbl{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
            line-height:1}
  .now .big{font-size:19px;font-weight:650;line-height:1.05;margin-top:4px;
            font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .now .big .u{display:block;font-size:9px;font-weight:500;color:var(--dim);
               letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  .now.nx .big{color:var(--amber)}
  .now.late .big{color:var(--red)}
  .now .n{font-size:12.5px;font-weight:600;line-height:1.32;
          overflow-wrap:anywhere;word-break:break-word}
  .now .meta{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4;
             overflow-wrap:anywhere}
  .now.none{border-left-color:var(--faint)}
  .now.none .big{font-size:13px;font-weight:500;color:var(--dim);letter-spacing:0}
  .now.none .n{font-weight:500;color:var(--dim)}

  /* ---------- counters ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 9px}
  .stat b{display:block;font-size:17px;font-weight:600;line-height:1.1;
          font-variant-numeric:tabular-nums}
  .stat span{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
             display:block;margin-top:2px}
  .over b{color:var(--red)}
  .over.clear b{color:var(--green)}

  /* ---------- section headings ---------- */
  .sec{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
       margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--hair)}
  .sec:first-of-type{margin-top:0}

  /* ---------- items: WRAP, never truncate ---------- */
  .list{display:flex;flex-direction:column}
  .item{display:grid;grid-template-columns:44px 1fr;gap:9px;align-items:start;
        padding:8px 6px;border-radius:6px;text-decoration:none;color:inherit;
        border-bottom:1px solid var(--hair)}
  .item:last-child{border-bottom:0}
  .item:hover{background:var(--panel)}
  .tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
      padding-top:1px;white-space:nowrap;font-weight:500}
  .tm.allday{font-size:10px;letter-spacing:.04em}
  .bd{min-width:0}
  .n{font-size:12.5px;line-height:1.38;overflow-wrap:anywhere;word-break:break-word}
  .meta{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;
        overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 8px}
  .pin{color:var(--dim)}
  .tag{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:3px;
       background:var(--hair);color:var(--dim);line-height:15px;white-space:nowrap}
  .item.mtg{border-left:2px solid var(--accent);padding-left:6px;margin-left:-8px}
  .item.mtg .n{font-weight:600}
  .item.done .n{text-decoration:line-through;color:var(--faint)}
  .item.done .tm{color:var(--faint)}
  .item.past .n{color:var(--dim)}

  .empty{color:var(--faint);font-style:italic;padding:14px 4px;text-align:center;font-size:11.5px}

  /* ---------- daily brief ---------- */
  .brief{margin:12px 0 0;border:1px solid var(--line);border-radius:8px;
         background:var(--panel);overflow:hidden}
  .brief summary{list-style:none;cursor:pointer;padding:9px 11px;
                 display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brief summary::-webkit-details-marker{display:none}
  .brief .bt{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .brief .bd8{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
  .brief .inner{padding:0 11px 10px}
  .brief li{font-size:11.5px;line-height:1.5;color:var(--ink);margin:0 0 5px 14px;
            overflow-wrap:anywhere}
  .brief li::marker{color:var(--faint)}
  .brief a.open{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--accent);
                text-decoration:none}
  .brief a.open:hover{text-decoration:underline}
  .brief.stale{border-color:var(--amber)}
  .brief .warn{font-size:10px;color:var(--amber);margin-bottom:6px}
  .foot{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);
        font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
  <div class="head">
    <div class="hp">
      <div class="pan p-loc">
        <div class="mlbl">Local</div>
        <div class="clock"><span id="clkh">--</span><span class="cn">:</span><span id="clkm">--</span><span class="sec" id="clks">--</span></div>
        <div class="sublbl" id="tzl">Cambridge, MA</div>
      </div>
      <div class="pan p-date">
        <div class="mlbl">Date</div>
        <div class="dow" id="w">&mdash;</div>
        <div class="dstr" id="d">&mdash;</div>
        <div class="dmeta" id="dmeta"></div>
      </div>
      <div class="pan p-wx">
        <div class="mlbl">Cambridge, MA</div>
        <div class="temp" id="wxt"><span class="u">loading</span></div>
        <div class="cond" id="wxc"></div>
        <div class="mstats" id="wx"></div>
        <div class="wxadv" id="wxadv"></div>
      </div>
    </div>
    <div class="fc" id="fc"></div>
  </div>

  <div id="nowbox"></div>

  <div id="body"></div>
  <div id="briefbox"></div>

  <div class="foot">
    <span id="gen"></span><span id="src"></span>
  </div>

<script>
const DOW=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MON=['January','February','March','April','May','June','July',
           'August','September','October','November','December'];
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function hhmm(iso){
  if(!iso || iso.length<16) return null;
  return iso.slice(11,16).replace(':','');
}
function mins(iso){
  const t=hhmm(iso); if(!t) return null;
  return (+t.slice(0,2))*60 + (+t.slice(2));
}
// A meeting is an appointment: it has a time and you attend it.
function isMeeting(it){
  const ty=(it.type||'').toLowerCase();
  const mt=(it.meeting_type||'').toLowerCase();
  if(ty==='meeting') return true;
  if(!it.type && (it.attendees||it.location)) return true;
  return ['research','draper','military','aeroastro','tpp','marstotable'].includes(mt) && !!hhmm(it.date);
}

function itemHTML(it, nowM){
  const t=hhmm(it.date), t2=hhmm(it.end);
  const m=mins(it.date);
  const past = (m!==null && nowM!==null && m<nowM);
  const cls=[
    'item',
    isMeeting(it)?'mtg':'',
    it.done?'done':'',
    (past && !it.done)?'past':''
  ].filter(Boolean).join(' ');

  const time = t ? (t2 ? `${t}<br><span style="opacity:.6">${t2}</span>` : t)
                 : '<span class="allday">ALL<br>DAY</span>';

  const bits=[];
  if(it.location) bits.push(`<span class="pin">\u{1F4CD} ${esc(it.location)}</span>`);
  if(it.attendees) bits.push(`<span>${esc(it.attendees)}</span>`);
  if(it.meeting_type) bits.push(`<span class="tag">${esc(it.meeting_type)}</span>`);
  else if(it.type) bits.push(`<span class="tag">${esc(it.type)}</span>`);

  const link = it.url ? ` href="${it.url}" target="_blank"` : '';
  const tag  = it.url ? 'a' : 'div';

  return `<${tag}${link} class="${cls}">
    <div class="tm">${time}</div>
    <div class="bd">
      <div class="n">${esc(it.name)}</div>
      ${bits.length?`<div class="meta">${bits.join('')}</div>`:''}
    </div>
  </${tag}>`;
}

// ---- daily brief: the abstract only, collapsed by default.
// Full brief (with the PDF) lives on its own Notion page; this is the headline.
fetch('../data/brief.json?t='+Date.now())
  .then(r=>r.ok?r.json():Promise.reject())
  .then(b=>{
    if(!b.lines || !b.lines.length) return;
    const d=new Date((b.date||'')+'T12:00:00');
    const stamp = isNaN(d) ? '' : `${String(d.getDate()).padStart(2,'0')} ${
      ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}`;
    const warn = b.stale
      ? `<div class="warn">\u26a0 This is the ${stamp} brief, not today's.</div>` : '';
    document.getElementById('briefbox').innerHTML=`
      <details class="brief${b.stale?' stale':''}">
        <summary><span class="bt">Daily brief</span><span class="bd8">${stamp} \u203a</span></summary>
        <div class="inner">
          ${warn}
          <ul>${b.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
          <a class="open" href="${b.url}" target="_blank">Open full brief \u2192</a>
        </div>
      </details>`;
  })
  .catch(()=>{});

// ---- live clock, 24h, ticking every second (the seconds readout demands it).
function tick(){
  const n=new Date();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('clkh').textContent=p(n.getHours());
  document.getElementById('clkm').textContent=p(n.getMinutes());
  document.getElementById('clks').textContent=p(n.getSeconds());
}
tick(); setInterval(tick, 1000);

// ---- date panel. Filled from local time immediately so the header never sits
// blank waiting on tasks.json; tasks.json may overwrite it later with its own day.
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
function paintDate(dt){
  document.getElementById('w').textContent = DOW[dt.getDay()];
  document.getElementById('d').textContent =
    `${String(dt.getDate()).padStart(2,'0')} ${MONS[dt.getMonth()]} ${dt.getFullYear()}`;
  const y=dt.getFullYear();
  const start=new Date(y,0,1);
  const doy=Math.round((new Date(y,dt.getMonth(),dt.getDate())-start)/86400000)+1;
  const total=isLeap(y)?366:365;
  const left=total-doy;
  document.getElementById('dmeta').innerHTML =
    `T\u2212${left}D EOY \u00b7 DAY ${doy}/${total}`;
}
paintDate(new Date());

// ---- weather: Open-Meteo, no key, Cambridge MA. ONE request serves the
// current conditions, the micro-stats row and the 5-day strip.
const WMO={0:'\u2600\uFE0F',1:'\u{1F324}\uFE0F',2:'\u26C5',3:'\u2601\uFE0F',
  45:'\u{1F32B}\uFE0F',48:'\u{1F32B}\uFE0F',51:'\u{1F327}\uFE0F',53:'\u{1F327}\uFE0F',
  55:'\u{1F327}\uFE0F',61:'\u{1F327}\uFE0F',63:'\u{1F327}\uFE0F',65:'\u{1F327}\uFE0F',
  71:'\u{1F328}\uFE0F',73:'\u{1F328}\uFE0F',75:'\u{1F328}\uFE0F',
  80:'\u{1F326}\uFE0F',81:'\u{1F326}\uFE0F',82:'\u26C8\uFE0F',
  95:'\u26C8\uFE0F',96:'\u26C8\uFE0F',99:'\u26C8\uFE0F'};
const WMOT={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',
  75:'Heavy snow',80:'Showers',81:'Showers',82:'Violent showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

const WX_URL='https://api.open-meteo.com/v1/forecast'
  +'?latitude=42.3736&longitude=-71.1097'
  +'&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m'
  +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
  +'&temperature_unit=fahrenheit&wind_speed_unit=mph'
  +'&timezone=America%2FNew_York&forecast_days=5';

fetch(WX_URL,{cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(w=>{
    const c=w.current, dl=w.daily;
    if(!c || !dl) throw new Error('missing fields');
    const icon=WMO[c.weather_code]||'';
    const r0=x=>(x==null?null:Math.round(x));
    const t=r0(c.temperature_2m);
    const hi=r0(dl.temperature_2m_max?.[0]);
    const lo=r0(dl.temperature_2m_min?.[0]);
    const pop=dl.precipitation_probability_max?.[0];
    const feels=r0(c.apparent_temperature);
    const wind=r0(c.wind_speed_10m);

    document.getElementById('wxt').innerHTML =
      `<span class="ic">${icon}</span>${t!=null?t:'\u2014'}<span class="u">\u00b0F</span>`;
    document.getElementById('wxc').textContent = WMOT[c.weather_code]||'';

    const st=[];
    if(feels!=null) st.push(`Feels <b>${feels}\u00b0</b>`);
    if(hi!=null&&lo!=null) st.push(`<b>${hi}\u00b0</b>/<b>${lo}\u00b0</b>`);
    if(pop!=null) st.push(`Precip <b>${pop}%</b>`);
    if(wind!=null) st.push(`Wind <b>${wind}</b> mph`);
    document.getElementById('wx').innerHTML=st.join('');

    // ---- Actionable line: the point of a weather widget is a DECISION, not
    // a reading. Umbrella, layers, or nothing. Thresholds are deliberate:
    // NWS treats >=50% as "likely"; 30-49% is worth a bag umbrella; below 20%
    // is not worth mentioning at all.
    const adv=[];
    if(pop!=null){
      if(pop>=50) adv.push('\u2602\uFE0F Take an umbrella');
      else if(pop>=30) adv.push('\u2602\uFE0F Umbrella in the bag');
      else if(pop>=20) adv.push('Slight chance of rain');
    }
    // Cambridge in September swings hard between afternoon and night.
    if(hi!=null&&lo!=null && (hi-lo)>=22) adv.push('Big swing \u2014 take a layer');
    else if(lo!=null && lo<=45) adv.push('Cold tonight \u2014 take a layer');
    if(wind!=null && wind>=20) adv.push('Windy');
    const code=c.weather_code;
    if([95,96,99].includes(code)) adv.push('\u26c8\uFE0F Storms');
    else if([71,73,75].includes(code)) adv.push('\u2744\uFE0F Snow');
    else if([45,48].includes(code)) adv.push('\u{1F32B}\uFE0F Fog \u2014 allow extra time');

    const advEl=document.getElementById('wxadv');
    if(advEl){
      if(adv.length){ advEl.textContent=adv.join(' \u00b7 '); advEl.style.display=''; }
      else { advEl.textContent='Nothing to carry'; advEl.style.display=''; }
    }

    // ---- 5-day strip. Index 0 is today. 3-letter day labels so they survive
    // ~58px columns at a 300px sidebar without ever truncating.
    const days=(dl.time||[]).slice(0,5).map((iso,i)=>{
      const dd=new Date(iso+'T12:00:00');
      const lab = i===0 ? 'TODAY' : DOW[dd.getDay()].slice(0,3);
      const dh=r0(dl.temperature_2m_max?.[i]);
      const dlo=r0(dl.temperature_2m_min?.[i]);
      const dp=dl.precipitation_probability_max?.[i];
      const di=WMO[dl.weather_code?.[i]]||'';
      return `<div class="fcd${i===0?' now':''}">
        <div class="dy">${lab}</div>
        <div class="ic">${di}</div>
        <div class="hl"><b>${dh!=null?dh:'\u2014'}</b>/${dlo!=null?dlo:'\u2014'}</div>
        ${(dp!=null&&dp>=20)?`<div class="pp">${dp}%</div>`:''}
      </div>`;
    });
    document.getElementById('fc').innerHTML=days.join('');
  })
  .catch(()=>{
    // Say it failed rather than showing a blank space that looks intentional.
    document.getElementById('wxt').innerHTML='<span class="u">weather unavailable</span>';
    document.getElementById('fc').innerHTML='';
  });

fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  const now=new Date();
  const nowM=now.getHours()*60+now.getMinutes();
  const dt=new Date((d.today||now.toISOString().slice(0,10))+'T12:00:00');

  paintDate(dt);

  const c=d.counts||{};

  const items=(d.today_items||[]).slice();

  // ---- NOW / NEXT: the single most useful line in the widget
  const timed=items.filter(x=>hhmm(x.date) && !x.done)
                   .sort((a,b)=>mins(a.date)-mins(b.date));
  // Find BOTH: what you're inside right now, and what's coming after it.
  // A timed item whose window covers the clock IS happening now -- including a
  // task. Previously only the next item showed, so a task you should have been
  // doing read as "NEXT", which is exactly backwards.
  let cur=null, nxt=null, late=false;
  for(const it of timed){
    const s=mins(it.date), e=it.end?mins(it.end):s+45;
    if(nowM>=s && nowM<=e && !cur){ cur=it; continue; }
    if(s>nowM && !nxt){ nxt=it; }
  }
  // Nothing covering the clock, but something already started and isn't done:
  // that is running late, and it is the most important thing on the widget.
  if(!cur){
    const started=timed.filter(it=>{
      const s=mins(it.date), e=it.end?mins(it.end):s+45;
      return s<=nowM && e<nowM;
    });
    if(started.length){ cur=started[started.length-1]; late=true; }
  }

  const panel=(it, isNext)=>{
    if(!it){
      return `<div class="now none">
        <div class="lft">
          <div class="lbl">${isNext?'NEXT':'NOW'}</div>
          <div class="big">${isNext?'\u2014':'\u2014'}</div>
        </div>
        <div class="rgt">
          <div class="n">${isNext?'Nothing later today':'Nothing on right now'}</div>
          <div class="meta">${isNext?'day is clear from here':'no timed item covering this moment'}</div>
        </div>
      </div>`;
    }
    const s=hhmm(it.date), e=hhmm(it.end);
    const where = it.location ? `\u{1F4CD} ${esc(it.location)}` : '';

    // The countdown is the headline number, not a footnote.
    let big='', unit='';
    if(isNext){
      const m=Math.round(mins(it.date)-nowM);
      if(m<=0){ big='now'; }
      else if(m<60){ big=String(m); unit='min'; }
      else { big=`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`; unit='away'; }
    } else if(late){
      const m=Math.round(nowM-(it.end?mins(it.end):mins(it.date)+45));
      big = m<60 ? String(m) : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
      unit = m<60 ? 'min over' : 'over';
    } else if(e){
      const m=Math.round(mins(it.end)-nowM);
      big = m<60 ? String(m) : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
      unit = m<60 ? 'min left' : 'left';
    } else {
      big = s; unit='started';
    }

    const cls = isNext ? ' nx' : (late ? ' late' : '');
    const lbl = isNext ? 'NEXT' : (late ? 'LATE' : 'NOW');

    return `<div class="now${cls}">
      <div class="lft">
        <div class="lbl">${lbl}</div>
        <div class="big">${big}${unit?`<span class="u">${unit}</span>`:''}</div>
      </div>
      <div class="rgt">
        <div class="n">${esc(it.name)}</div>
        <div class="meta">${e?`${s}\u2013${e}`:s}${where?` \u00b7 ${where}`:''}</div>
      </div>
    </div>`;
  };

  document.getElementById('nowbox').innerHTML =
    `<div class="np">${panel(cur,false)}${panel(nxt,true)}</div>`;

  // ---- ONE agenda, chronological. Meetings and tasks interleaved, because the
  // day happens in one order -- splitting them made you read two lists and
  // merge them mentally.
  const bySlot=(a,b)=>{
    const A=mins(a.date), B=mins(b.date);
    if(A===null&&B===null) return 0;
    if(A===null) return 1;   // all-day items sink to the bottom
    if(B===null) return -1;
    return A-B;
  };
  const ordered=items.slice().sort(bySlot);

  let h='';
  if(ordered.length){
    const timedRows=ordered.filter(x=>mins(x.date)!==null);
    const allday=ordered.filter(x=>mins(x.date)===null);
    if(timedRows.length){
      h+=`<div class="sec">Today \u00b7 ${ordered.length} item${ordered.length===1?'':'s'}</div>`;
      h+=`<div class="list">${timedRows.map(x=>itemHTML(x,nowM)).join('')}</div>`;
    }
    if(allday.length){
      h+=`<div class="sec">No set time \u00b7 ${allday.length}</div>`;
      h+=`<div class="list">${allday.map(x=>itemHTML(x,nowM)).join('')}</div>`;
    }
  } else {
    h='<div class="empty">nothing scheduled today</div>';
  }
  document.getElementById('body').innerHTML=h;

  const g=d.generated||'';
  document.getElementById('gen').textContent = g?('synced '+g.slice(11,16)):'';
  document.getElementById('src').textContent = (c.past_meetings!=null)
    ? `${c.past_meetings} past meetings not counted` : '';
})
.catch(()=>{document.getElementById('body').innerHTML='<div class="empty">data not built yet</div>';});
</script>
</body>
</html>

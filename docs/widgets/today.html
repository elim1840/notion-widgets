<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --accent:#5b93d3; --red:#e06c6c; --green:#5fa87a; --amber:#c9a227;
    --gold:#c9a227; --purple:#9a7fd0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#eeedea;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    padding:14px 14px 10px; -webkit-font-smoothing:antialiased;
  }

  /* ---------- header ---------- */
  .head{margin-bottom:12px}
  .toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .date{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
  .clock{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
         letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
  .subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
  .day{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .wx{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;
      white-space:nowrap}
  .wx .t{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .wx .hl{font-variant-numeric:tabular-nums}

  /* ---------- NOW strip: the one thing you look at ---------- */
  /* NOW on the left, NEXT on the right. Two panels, always both shown, so
     "what am I in" and "what's coming" never hide each other. */
  .np{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 12px}
  @media (max-width:340px){ .np{grid-template-columns:1fr} }
  .now{padding:10px 11px;border-radius:8px;min-width:0;
       background:var(--panel);border:1px solid var(--line);
       border-left:3px solid var(--accent)}
  .now.nx{border-left-color:var(--amber)}
  .now.late{border-left-color:var(--red);background:rgba(224,108,108,.07)}
  .now .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  /* The countdown is the number he actually reads. It was 10px and unreadable;
     it is now the largest thing in the panel. */
  .now .big{font-size:20px;font-weight:650;line-height:1.05;margin-top:5px;
            font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .now .big .u{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:0}
  .now.nx .big{color:var(--amber)}
  .now.late .big{color:var(--red)}
  .now .n{font-size:12px;font-weight:600;margin-top:5px;line-height:1.3;
          overflow-wrap:anywhere;word-break:break-word}
  .now .meta{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4;
             overflow-wrap:anywhere}
  .now.none{border-left-color:var(--faint)}
  .now.none .big{font-size:13px;font-weight:500;color:var(--dim);letter-spacing:0}
  .now.none .n{font-weight:500;color:var(--dim)}

  /* ---------- counters ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 9px}
  .stat b{display:block;font-size:17px;font-weight:600;line-height:1.1;
          font-variant-numeric:tabular-nums}
  .stat span{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
             display:block;margin-top:2px}
  .over b{color:var(--red)}
  .over.clear b{color:var(--green)}

  /* ---------- section headings ---------- */
  .sec{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
       margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--hair)}
  .sec:first-of-type{margin-top:0}

  /* ---------- items: WRAP, never truncate ---------- */
  .list{display:flex;flex-direction:column}
  .item{display:grid;grid-template-columns:44px 1fr;gap:9px;align-items:start;
        padding:8px 6px;border-radius:6px;text-decoration:none;color:inherit;
        border-bottom:1px solid var(--hair)}
  .item:last-child{border-bottom:0}
  .item:hover{background:var(--panel)}
  .tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
      padding-top:1px;white-space:nowrap;font-weight:500}
  .tm.allday{font-size:10px;letter-spacing:.04em}
  .bd{min-width:0}
  .n{font-size:12.5px;line-height:1.38;overflow-wrap:anywhere;word-break:break-word}
  .meta{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;
        overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 8px}
  .pin{color:var(--dim)}
  .tag{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:3px;
       background:var(--hair);color:var(--dim);line-height:15px;white-space:nowrap}
  .item.mtg{border-left:2px solid var(--accent);padding-left:6px;margin-left:-8px}
  .item.mtg .n{font-weight:600}
  .item.done .n{text-decoration:line-through;color:var(--faint)}
  .item.done .tm{color:var(--faint)}
  .item.past .n{color:var(--dim)}

  .empty{color:var(--faint);font-style:italic;padding:14px 4px;text-align:center;font-size:11.5px}

  /* ---------- daily brief ---------- */
  .brief{margin:12px 0 0;border:1px solid var(--line);border-radius:8px;
         background:var(--panel);overflow:hidden}
  .brief summary{list-style:none;cursor:pointer;padding:9px 11px;
                 display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brief summary::-webkit-details-marker{display:none}
  .brief .bt{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .brief .bd8{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
  .brief .inner{padding:0 11px 10px}
  .brief li{font-size:11.5px;line-height:1.5;color:var(--ink);margin:0 0 5px 14px;
            overflow-wrap:anywhere}
  .brief li::marker{color:var(--faint)}
  .brief a.open{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--accent);
                text-decoration:none}
  .brief a.open:hover{text-decoration:underline}
  .brief.stale{border-color:var(--amber)}
  .brief .warn{font-size:10px;color:var(--amber);margin-bottom:6px}
  .foot{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);
        font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
  <div class="head">
    <div class="toprow">
      <div class="date" id="d">—</div>
      <div class="clock" id="clk">--:--</div>
    </div>
    <div class="subrow">
      <div class="day" id="w"></div>
      <div class="wx" id="wx"></div>
    </div>
  </div>

  <div id="nowbox"></div>

  <div id="body"></div>
  <div id="briefbox"></div>

  <div class="foot">
    <span id="gen"></span><span id="src"></span>
  </div>

<script>
const DOW=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MON=['January','February','March','April','May','June','July',
           'August','September','October','November','December'];
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function hhmm(iso){
  if(!iso || iso.length<16) return null;
  return iso.slice(11,16).replace(':','');
}
function mins(iso){
  const t=hhmm(iso); if(!t) return null;
  return (+t.slice(0,2))*60 + (+t.slice(2));
}
// A meeting is an appointment: it has a time and you attend it.
function isMeeting(it){
  const ty=(it.type||'').toLowerCase();
  const mt=(it.meeting_type||'').toLowerCase();
  if(ty==='meeting') return true;
  if(!it.type && (it.attendees||it.location)) return true;
  return ['research','draper','military','aeroastro','tpp','marstotable'].includes(mt) && !!hhmm(it.date);
}

function itemHTML(it, nowM){
  const t=hhmm(it.date), t2=hhmm(it.end);
  const m=mins(it.date);
  const past = (m!==null && nowM!==null && m<nowM);
  const cls=[
    'item',
    isMeeting(it)?'mtg':'',
    it.done?'done':'',
    (past && !it.done)?'past':''
  ].filter(Boolean).join(' ');

  const time = t ? (t2 ? `${t}<br><span style="opacity:.6">${t2}</span>` : t)
                 : '<span class="allday">ALL<br>DAY</span>';

  const bits=[];
  if(it.location) bits.push(`<span class="pin">\u{1F4CD} ${esc(it.location)}</span>`);
  if(it.attendees) bits.push(`<span>${esc(it.attendees)}</span>`);
  if(it.meeting_type) bits.push(`<span class="tag">${esc(it.meeting_type)}</span>`);
  else if(it.type) bits.push(`<span class="tag">${esc(it.type)}</span>`);

  const link = it.url ? ` href="${it.url}" target="_blank"` : '';
  const tag  = it.url ? 'a' : 'div';

  return `<${tag}${link} class="${cls}">
    <div class="tm">${time}</div>
    <div class="bd">
      <div class="n">${esc(it.name)}</div>
      ${bits.length?`<div class="meta">${bits.join('')}</div>`:''}
    </div>
  </${tag}>`;
}

// ---- daily brief: the abstract only, collapsed by default.
// Full brief (with the PDF) lives on its own Notion page; this is the headline.
fetch('../data/brief.json?t='+Date.now())
  .then(r=>r.ok?r.json():Promise.reject())
  .then(b=>{
    if(!b.lines || !b.lines.length) return;
    const d=new Date((b.date||'')+'T12:00:00');
    const stamp = isNaN(d) ? '' : `${String(d.getDate()).padStart(2,'0')} ${
      ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}`;
    const warn = b.stale
      ? `<div class="warn">\u26a0 This is the ${stamp} brief, not today's.</div>` : '';
    document.getElementById('briefbox').innerHTML=`
      <details class="brief${b.stale?' stale':''}">
        <summary><span class="bt">Daily brief</span><span class="bd8">${stamp} \u203a</span></summary>
        <div class="inner">
          ${warn}
          <ul>${b.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
          <a class="open" href="${b.url}" target="_blank">Open full brief \u2192</a>
        </div>
      </details>`;
  })
  .catch(()=>{});

// ---- live clock, 24h. Ticks every 10s so the NOW strip stays honest.
function tick(){
  const n=new Date();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('clk').textContent=`${p(n.getHours())}${p(n.getMinutes())}`;
}
tick(); setInterval(tick, 10000);

// ---- weather: Open-Meteo, no key, Cambridge MA (same source as weather.html)
// WMO code -> compact glyph. Kept small deliberately; this is a status line,
// not a forecast widget.
const WMO={0:'\u2600\uFE0F',1:'\u{1F324}\uFE0F',2:'\u26C5',3:'\u2601\uFE0F',
  45:'\u{1F32B}\uFE0F',48:'\u{1F32B}\uFE0F',51:'\u{1F327}\uFE0F',53:'\u{1F327}\uFE0F',
  55:'\u{1F327}\uFE0F',61:'\u{1F327}\uFE0F',63:'\u{1F327}\uFE0F',65:'\u{1F327}\uFE0F',
  71:'\u{1F328}\uFE0F',73:'\u{1F328}\uFE0F',75:'\u{1F328}\uFE0F',
  80:'\u{1F326}\uFE0F',81:'\u{1F326}\uFE0F',82:'\u26C8\uFE0F',
  95:'\u26C8\uFE0F',96:'\u26C8\uFE0F',99:'\u26C8\uFE0F'};

const WX_URL='https://api.open-meteo.com/v1/forecast'
  +'?latitude=42.3736&longitude=-71.1097'
  +'&current=temperature_2m,weather_code'
  +'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
  +'&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=1';

fetch(WX_URL,{cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(w=>{
    const c=w.current, dl=w.daily;
    if(!c || !dl) throw new Error('missing fields');
    const icon=WMO[c.weather_code]||'';
    const t=Math.round(c.temperature_2m);
    const hi=Math.round(dl.temperature_2m_max[0]);
    const lo=Math.round(dl.temperature_2m_min[0]);
    const pop=dl.precipitation_probability_max?.[0];
    let s=`${icon} <span class="t">${t}\u00b0</span> <span class="hl">${hi}/${lo}</span>`;
    if(pop!=null && pop>=20) s+=` <span style="color:var(--accent)">${pop}%</span>`;
    document.getElementById('wx').innerHTML=s;
  })
  .catch(()=>{
    // Say it failed rather than showing a blank space that looks intentional.
    document.getElementById('wx').innerHTML='<span style="opacity:.55">weather unavailable</span>';
  });

fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  const now=new Date();
  const nowM=now.getHours()*60+now.getMinutes();
  const dt=new Date((d.today||now.toISOString().slice(0,10))+'T12:00:00');

  document.getElementById('d').textContent=`${MON[dt.getMonth()]} ${dt.getDate()}`;
  document.getElementById('w').textContent=DOW[dt.getDay()];

  const c=d.counts||{};

  const items=(d.today_items||[]).slice();

  // ---- NOW / NEXT: the single most useful line in the widget
  const timed=items.filter(x=>hhmm(x.date) && !x.done)
                   .sort((a,b)=>mins(a.date)-mins(b.date));
  // Find BOTH: what you're inside right now, and what's coming after it.
  // A timed item whose window covers the clock IS happening now -- including a
  // task. Previously only the next item showed, so a task you should have been
  // doing read as "NEXT", which is exactly backwards.
  let cur=null, nxt=null, late=false;
  for(const it of timed){
    const s=mins(it.date), e=it.end?mins(it.end):s+45;
    if(nowM>=s && nowM<=e && !cur){ cur=it; continue; }
    if(s>nowM && !nxt){ nxt=it; }
  }
  // Nothing covering the clock, but something already started and isn't done:
  // that is running late, and it is the most important thing on the widget.
  if(!cur){
    const started=timed.filter(it=>{
      const s=mins(it.date), e=it.end?mins(it.end):s+45;
      return s<=nowM && e<nowM;
    });
    if(started.length){ cur=started[started.length-1]; late=true; }
  }

  const panel=(it, isNext)=>{
    if(!it){
      return `<div class="now none">
        <div class="lbl">${isNext?'NEXT':'NOW'}</div>
        <div class="big">${isNext?'Clear':'Free'}</div>
        <div class="n">${isNext?'nothing later today':'no timed item right now'}</div>
      </div>`;
    }
    const s=hhmm(it.date), e=hhmm(it.end);
    const where = it.location ? `\u{1F4CD} ${esc(it.location)}` : '';

    // The countdown is the headline number, not a footnote.
    let big='', unit='';
    if(isNext){
      const m=Math.round(mins(it.date)-nowM);
      if(m<=0){ big='now'; }
      else if(m<60){ big=String(m); unit='min'; }
      else { big=`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`; unit='away'; }
    } else if(late){
      const m=Math.round(nowM-(it.end?mins(it.end):mins(it.date)+45));
      big = m<60 ? String(m) : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
      unit = m<60 ? 'min over' : 'over';
    } else if(e){
      const m=Math.round(mins(it.end)-nowM);
      big = m<60 ? String(m) : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
      unit = m<60 ? 'min left' : 'left';
    } else {
      big = s; unit='started';
    }

    const cls = isNext ? ' nx' : (late ? ' late' : '');
    const lbl = isNext ? 'NEXT' : (late ? 'RUNNING LATE' : 'NOW');

    return `<div class="now${cls}">
      <div class="lbl">${lbl}</div>
      <div class="big">${big}${unit?` <span class="u">${unit}</span>`:''}</div>
      <div class="n">${esc(it.name)}</div>
      <div class="meta">${e?`${s}\u2013${e}`:s}${where?` \u00b7 ${where}`:''}</div>
    </div>`;
  };

  document.getElementById('nowbox').innerHTML =
    `<div class="np">${panel(cur,false)}${panel(nxt,true)}</div>`;

  // ---- ONE agenda, chronological. Meetings and tasks interleaved, because the
  // day happens in one order -- splitting them made you read two lists and
  // merge them mentally.
  const bySlot=(a,b)=>{
    const A=mins(a.date), B=mins(b.date);
    if(A===null&&B===null) return 0;
    if(A===null) return 1;   // all-day items sink to the bottom
    if(B===null) return -1;
    return A-B;
  };
  const ordered=items.slice().sort(bySlot);

  let h='';
  if(ordered.length){
    const timedRows=ordered.filter(x=>mins(x.date)!==null);
    const allday=ordered.filter(x=>mins(x.date)===null);
    if(timedRows.length){
      h+=`<div class="sec">Today \u00b7 ${ordered.length} item${ordered.length===1?'':'s'}</div>`;
      h+=`<div class="list">${timedRows.map(x=>itemHTML(x,nowM)).join('')}</div>`;
    }
    if(allday.length){
      h+=`<div class="sec">No set time \u00b7 ${allday.length}</div>`;
      h+=`<div class="list">${allday.map(x=>itemHTML(x,nowM)).join('')}</div>`;
    }
  } else {
    h='<div class="empty">nothing scheduled today</div>';
  }
  document.getElementById('body').innerHTML=h;

  const g=d.generated||'';
  document.getElementById('gen').textContent = g?('synced '+g.slice(11,16)):'';
  document.getElementById('src').textContent = (c.past_meetings!=null)
    ? `${c.past_meetings} past meetings not counted` : '';
})
.catch(()=>{document.getElementById('body').innerHTML='<div class="empty">data not built yet</div>';});
</script>
</body>
</html>

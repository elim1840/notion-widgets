<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
    --accent:#5b93d3; --red:#e06c6c; --green:#5fa87a; --amber:#c9a227;
    --gold:#c9a227; --purple:#9a7fd0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#eeedea;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    padding:14px 14px 10px; -webkit-font-smoothing:antialiased;
  }
  /* ---------- header: date left, clock right, one weather line ----------
     Stripped to what is decision-relevant. Removed: "LOCAL" and "Cambridge, MA"
     labels (he knows where he is), the T-minus counter and day-of-year (never
     acted on), and the 5-day strip's second row. */
  .head{margin-bottom:11px;border:1px solid var(--line);border-radius:9px;
        background:var(--panel);padding:10px 12px 9px}
  .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .hleft{min-width:0}
  .dow{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.035em;
       line-height:1.05;overflow-wrap:anywhere}
  .dstr{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.1;
        font-variant-numeric:tabular-nums}
  .clock{font-size:30px;font-weight:300;line-height:.95;letter-spacing:-.015em;
         font-variant-numeric:tabular-nums;display:flex;align-items:baseline;
         flex:0 0 auto}
  .clock .cn{color:var(--faint);font-weight:200;margin:0 1px;position:relative;top:-2px}
  .clock .sec{font-size:15px;font-weight:300;color:var(--dim);margin-left:6px;
              font-variant-numeric:tabular-nums}

  /* One weather line: now, then the next two days. Nothing below it. */
  .wxline{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 14px;
          margin-top:10px;padding-top:9px;border-top:1px solid var(--hair);
          font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;
          line-height:1.5}
  .wxline .nowt{color:var(--ink);font-size:15px;font-weight:600;letter-spacing:-.01em}
  .wxline .cond{color:var(--dim)}
  .wxline .d2{white-space:nowrap}
  .wxline .d2 b{color:var(--ink);font-weight:600}
  .wxline .adv{color:var(--accent)}

  @media (max-width:339px){
    .clock{font-size:30px}
    .clock .sec{font-size:15px}
    .wxline{font-size:11px;gap:2px 9px}
  }

  /* ---------- NOW strip: the one thing you look at ---------- */
  /* NOW on the left, NEXT on the right. Two panels, always both shown, so
     "what am I in" and "what's coming" never hide each other. */
  /* Actionable weather line -- what to carry, not what to know. */
  .wxadv{font-size:11px;color:var(--accent);margin-top:7px;line-height:1.35;
         overflow-wrap:anywhere}

  /* NOW stacked ABOVE NEXT -- flat rows, not two squeezed boxes. Side-by-side
     halved the width available for names and forced them to wrap badly. */
  .np{display:flex;flex-direction:column;gap:7px;margin:11px 0 13px}
  .now.nx{border-left-color:var(--amber)}
  .now.late{border-left-color:var(--red);background:rgba(224,108,108,.07)}
  /* Left rail: label above the countdown. Right side: name, then time+room. */
  /* One line, read left to right: "NEXT — in 2h09". Stacking the label above
     the number and the unit below it made a 3-line tower in an 82px rail, which
     is why it looked broken. A countdown is a phrase, not a stat block. */
  .now{display:block;padding:11px 13px;border-radius:8px;
       background:var(--panel);border:1px solid var(--line);
       border-left:3px solid var(--accent)}
  .now .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .now .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--dim);font-weight:600}
  .now .big{font-size:19px;font-weight:650;line-height:1.15;
            font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .now .big .u{font-size:13px;font-weight:500;color:var(--dim);
               letter-spacing:0;text-transform:none;margin-left:3px}
  .now.nx .big{color:var(--amber)}
  .now.late .big{color:var(--red)}
  .now .n{font-size:13px;font-weight:600;line-height:1.42;margin-top:7px;
          overflow-wrap:anywhere;word-break:break-word}
  .now .meta{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.45;
             overflow-wrap:anywhere}
  .now.none{border-left-color:var(--faint)}
  .now.none .big{font-size:13px;font-weight:500;color:var(--dim);letter-spacing:0}
  .now.none .n{font-weight:500;color:var(--dim)}

  /* ---------- counters ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 9px}
  .stat b{display:block;font-size:19px;font-weight:600;line-height:1.1;
          font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
             display:block;margin-top:2px}
  .over b{color:var(--red)}
  .over.clear b{color:var(--green)}

  /* ---------- section headings ---------- */
  .sec{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
       margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--hair)}
  .sec:first-of-type{margin-top:0}

  /* ---------- agenda as time blocks: WRAP, never truncate ---------- */
  .list{display:flex;flex-direction:column;gap:4px}
  /* 58px rail: "1030" and "1200" need room to sit on one line each at 12px.
     At 50px they were wrapping or crowding the title. */
  .item{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch;
        padding:9px 10px 9px 0;border-radius:6px;text-decoration:none;color:inherit;
        border-left:2px solid var(--hair);position:relative}
  .item:hover{background:var(--panel)}
  .tm{display:flex;flex-direction:column;font-size:12px;color:var(--dim);
      font-variant-numeric:tabular-nums;font-weight:600;padding-left:10px;
      white-space:nowrap;line-height:1.35}
  .tm .t1{color:var(--ink)}
  .tm .t2{color:var(--faint);font-weight:500}
  .tm .dur{font-size:10px;color:var(--faint);font-weight:500;letter-spacing:.03em;
           margin-top:3px}
  .tm .allday{font-size:10px;letter-spacing:.06em;color:var(--faint);font-weight:600}
  .bd{min-width:0;display:flex;flex-direction:column;justify-content:center}
  /* 1.45 line-height: titles wrap to 2-3 lines here and 1.35 made them dense. */
  .n{font-size:13px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}
  .meta{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.45;
        overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 9px;
        align-items:center}
  .pin{color:var(--dim)}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;
       background:var(--hair);color:var(--dim);line-height:16px;white-space:nowrap}
  /* Category rails: meetings blue, everything else neutral. */
  .item.mtg{border-left-color:var(--accent);background:rgba(91,147,211,.045)}
  .item.mtg .n{font-weight:600}
  /* Happening right now. */
  .item.live{border-left-color:var(--green);background:rgba(95,168,122,.08)}
  .item.live .n{font-weight:600}
  .item.done{border-left-color:var(--green)}
  .item.done .n{text-decoration:line-through;color:var(--faint)}
  .item.done .tm .t1{color:var(--faint)}
  .item.past{opacity:.62}

  .empty{color:var(--faint);font-style:italic;padding:14px 4px;text-align:center;font-size:12px}

  /* ---------- daily brief ---------- */
  .brief{margin:12px 0 0;border:1px solid var(--line);border-radius:8px;
         background:var(--panel);overflow:hidden}
  .brief summary{list-style:none;cursor:pointer;padding:9px 11px;
                 display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brief summary::-webkit-details-marker{display:none}
  .brief .bt{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .brief .bd8{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
  .brief .inner{padding:0 11px 10px}
  .brief li{font-size:12px;line-height:1.5;color:var(--ink);margin:0 0 5px 14px;
            overflow-wrap:anywhere}
  .brief li::marker{color:var(--faint)}
  .brief a.open{display:inline-block;margin-top:4px;font-size:11px;color:var(--accent);
                text-decoration:none}
  .brief a.open:hover{text-decoration:underline}
  .brief.stale{border-color:var(--amber)}
  .brief .warn{font-size:10px;color:var(--amber);margin-bottom:6px}
  .foot{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);
        font-size:10px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
  <div class="head">
    <div class="hrow">
      <div class="hleft">
        <div class="dow" id="w">&mdash;</div>
        <div class="dstr" id="d">&mdash;</div>
      </div>
      <div class="clock"><span id="clkh">--</span><span class="cn">:</span><span id="clkm">--</span><span class="sec" id="clks">--</span></div>
    </div>
    <div class="wxline" id="wxline"></div>
  </div>

  <div id="nowbox"></div>

  <div id="body"></div>
  <div id="briefbox"></div>

  <div class="foot">
    <span id="gen"></span><span id="src"></span>
  </div>

<script>
const DOW=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MON=['January','February','March','April','May','June','July',
           'August','September','October','November','December'];
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function hhmm(iso){
  if(!iso || iso.length<16) return null;
  return iso.slice(11,16).replace(':','');
}
function mins(iso){
  const t=hhmm(iso); if(!t) return null;
  return (+t.slice(0,2))*60 + (+t.slice(2));
}
// A meeting is an appointment: it has a time and you attend it.
function isMeeting(it){
  const ty=(it.type||'').toLowerCase();
  const mt=(it.meeting_type||'').toLowerCase();
  if(ty==='meeting') return true;
  if(!it.type && (it.attendees||it.location)) return true;
  return ['research','draper','military','aeroastro','tpp','marstotable'].includes(mt) && !!hhmm(it.date);
}

// Agenda row as a TIME BLOCK: the left rail shows start and end, and the row's
// minimum height scales with duration so a 2h event visibly outweighs a 15m one.
// Height is capped so a 4h block cannot push the rest of the day off screen,
// and items with no end time get the base height rather than a fabricated one.
function itemHTML(it, nowM){
  const t=hhmm(it.date), t2=hhmm(it.end);
  const m=mins(it.date), m2=it.end?mins(it.end):null;
  const past = (m!==null && nowM!==null && m<nowM);
  const live = (m!==null && m2!==null && nowM>=m && nowM<=m2);

  const cls=[
    'item',
    isMeeting(it)?'mtg':'',
    it.done?'done':'',
    (past && !it.done)?'past':'',
    live?'live':''
  ].filter(Boolean).join(' ');

  // Duration -> height. 1px per minute past the first 30, clamped to 96px.
  let dur = (m!==null && m2!==null) ? Math.max(0, m2-m) : null;
  let hStyle='';
  if(dur!==null && dur>30){
    hStyle=` style="min-height:${Math.min(96, 34+Math.round((dur-30)*0.34))}px"`;
  }

  const time = t
    ? `<span class="t1">${t}</span>${t2?`<span class="t2">${t2}</span>`:''}`
    : '<span class="allday">ALL DAY</span>';
  const durTxt = (dur!==null && dur>=15)
    ? `<span class="dur">${dur>=60?`${Math.floor(dur/60)}h${dur%60?String(dur%60).padStart(2,'0'):''}`:`${dur}m`}</span>`
    : '';

  const bits=[];
  if(it.location) bits.push(`<span class="pin">\u{1F4CD} ${esc(it.location)}</span>`);
  if(it.attendees) bits.push(`<span>${esc(it.attendees)}</span>`);
  if(it.meeting_type) bits.push(`<span class="tag">${esc(it.meeting_type)}</span>`);
  else if(it.type) bits.push(`<span class="tag">${esc(it.type)}</span>`);

  const link = it.url ? ` href="${it.url}" target="_blank"` : '';
  const tag  = it.url ? 'a' : 'div';

  return `<${tag}${link} class="${cls}"${hStyle}>
    <div class="tm">${time}${durTxt}</div>
    <div class="bd">
      <div class="n">${esc(it.name)}</div>
      ${bits.length?`<div class="meta">${bits.join('')}</div>`:''}
    </div>
  </${tag}>`;
}

// ---- daily brief: the abstract only, collapsed by default.
// Full brief (with the PDF) lives on its own Notion page; this is the headline.
fetch('../data/brief.json?t='+Date.now())
  .then(r=>r.ok?r.json():Promise.reject())
  .then(b=>{
    if(!b.lines || !b.lines.length) return;
    const d=new Date((b.date||'')+'T12:00:00');
    const stamp = isNaN(d) ? '' : `${String(d.getDate()).padStart(2,'0')} ${
      ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}`;
    const warn = b.stale
      ? `<div class="warn">\u26a0 This is the ${stamp} brief, not today's.</div>` : '';
    document.getElementById('briefbox').innerHTML=`
      <details class="brief${b.stale?' stale':''}">
        <summary><span class="bt">Daily brief</span><span class="bd8">${stamp} \u203a</span></summary>
        <div class="inner">
          ${warn}
          <ul>${b.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
          <a class="open" href="${b.url}" target="_blank">Open full brief \u2192</a>
        </div>
      </details>`;
  })
  .catch(()=>{});

// ---- live clock, 24h, ticking every second (the seconds readout demands it).
function tick(){
  const n=new Date();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('clkh').textContent=p(n.getHours());
  document.getElementById('clkm').textContent=p(n.getMinutes());
  document.getElementById('clks').textContent=p(n.getSeconds());
}
tick(); setInterval(tick, 1000);

// ---- date panel. Filled from local time immediately so the header never sits
// blank waiting on tasks.json; tasks.json may overwrite it later with its own day.
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
function paintDate(dt){
  document.getElementById('w').textContent = DOW[dt.getDay()];
  document.getElementById('d').textContent =
    `${String(dt.getDate()).padStart(2,'0')} ${MONS[dt.getMonth()]} ${dt.getFullYear()}`;
}
paintDate(new Date());

// ---- weather: Open-Meteo, no key, Cambridge MA. ONE request serves the
// current conditions, the micro-stats row and the 5-day strip.
const WMO={0:'\u2600\uFE0F',1:'\u{1F324}\uFE0F',2:'\u26C5',3:'\u2601\uFE0F',
  45:'\u{1F32B}\uFE0F',48:'\u{1F32B}\uFE0F',51:'\u{1F327}\uFE0F',53:'\u{1F327}\uFE0F',
  55:'\u{1F327}\uFE0F',61:'\u{1F327}\uFE0F',63:'\u{1F327}\uFE0F',65:'\u{1F327}\uFE0F',
  71:'\u{1F328}\uFE0F',73:'\u{1F328}\uFE0F',75:'\u{1F328}\uFE0F',
  80:'\u{1F326}\uFE0F',81:'\u{1F326}\uFE0F',82:'\u26C8\uFE0F',
  95:'\u26C8\uFE0F',96:'\u26C8\uFE0F',99:'\u26C8\uFE0F'};
const WMOT={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',
  75:'Heavy snow',80:'Showers',81:'Showers',82:'Violent showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

const WX_URL='https://api.open-meteo.com/v1/forecast'
  +'?latitude=42.3736&longitude=-71.1097'
  +'&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m'
  +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
  +'&temperature_unit=fahrenheit&wind_speed_unit=mph'
  +'&timezone=America%2FNew_York&forecast_days=5';

fetch(WX_URL,{cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(w=>{
    const c=w.current, dl=w.daily;
    if(!c || !dl) throw new Error('missing fields');
    const r0=x=>(x==null?null:Math.round(x));
    const t=r0(c.temperature_2m);
    const hi=r0(dl.temperature_2m_max?.[0]);
    const lo=r0(dl.temperature_2m_min?.[0]);
    const pop=dl.precipitation_probability_max?.[0];

    // ONE line: now, today's range, then the next two days. No second row.
    const parts=[];
    parts.push(`<span class="nowt">${WMO[c.weather_code]||''} ${t!=null?t:'\u2014'}\u00b0</span>`);
    const cond=WMOT[c.weather_code]||'';
    if(cond) parts.push(`<span class="cond">${cond}</span>`);
    if(hi!=null&&lo!=null) parts.push(`<span class="d2"><b>${hi}\u00b0</b>/${lo}\u00b0</span>`);

    // Next two days only -- day 3+ is not a decision you make this morning.
    for(let i=1;i<=2;i++){
      const iso=dl.time?.[i];
      if(!iso) continue;
      const dd=new Date(iso+'T12:00:00');
      const lab=DOW[dd.getDay()].slice(0,3);
      const dh=r0(dl.temperature_2m_max?.[i]);
      const dlo=r0(dl.temperature_2m_min?.[i]);
      const di=WMO[dl.weather_code?.[i]]||'';
      const dp=dl.precipitation_probability_max?.[i];
      parts.push(`<span class="d2">${lab} ${di} <b>${dh!=null?dh:'\u2014'}</b>/${dlo!=null?dlo:'\u2014'}${(dp!=null&&dp>=30)?` ${dp}%`:''}</span>`);
    }

    // Only say something if there is something to carry or expect.
    const adv=[];
    if(pop!=null){
      if(pop>=50) adv.push('\u2602\uFE0F Umbrella');
      else if(pop>=30) adv.push('\u2602\uFE0F Maybe umbrella');
    }
    if(hi!=null&&lo!=null && (hi-lo)>=22) adv.push('Layer for tonight');
    else if(lo!=null && lo<=45) adv.push('Cold tonight');
    const code=c.weather_code;
    if([95,96,99].includes(code)) adv.push('\u26c8\uFE0F Storms');
    else if([71,73,75].includes(code)) adv.push('\u2744\uFE0F Snow');
    else if([45,48].includes(code)) adv.push('\u{1F32B}\uFE0F Fog');
    if(adv.length) parts.push(`<span class="adv">${adv.join(' \u00b7 ')}</span>`);

    document.getElementById('wxline').innerHTML=parts.join('');
  })
  .catch(()=>{
    document.getElementById('wxline').innerHTML='<span style="opacity:.55">weather unavailable</span>';
  });

fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  const now=new Date();
  const nowM=now.getHours()*60+now.getMinutes();
  const dt=new Date((d.today||now.toISOString().slice(0,10))+'T12:00:00');

  paintDate(dt);

  const c=d.counts||{};

  const items=(d.today_items||[]).slice();

  // ---- NOW / NEXT: the single most useful line in the widget
  const timed=items.filter(x=>hhmm(x.date) && !x.done)
                   .sort((a,b)=>mins(a.date)-mins(b.date));
  // Find BOTH: what covers the clock right now, and what comes after.
  // No LATE state -- a task whose window has passed is either happening (NOW)
  // or it is not the thing you are looking at. Late-ness belongs in nowbar,
  // not here; two panels answering the same question is one too many.
  let cur=null, nxt=null;
  const late=false;
  for(const it of timed){
    const s=mins(it.date), e=it.end?mins(it.end):s+45;
    if(nowM>=s && nowM<=e && !cur){ cur=it; continue; }
    if(s>nowM && !nxt){ nxt=it; }
  }

  const panel=(it, isNext)=>{
    if(!it){
      return `<div class="now none">
        <div class="top">
          <span class="lbl">${isNext?'NEXT':'NOW'}</span>
          <span class="big">${isNext?'nothing later':'nothing on'}</span>
        </div>
        <div class="meta">${isNext?'day is clear from here':'no timed item covering this moment'}</div>
      </div>`;
    }
    const s=hhmm(it.date), e=hhmm(it.end);
    const where = it.location ? `\u{1F4CD} ${esc(it.location)}` : '';

    // Phrasing, not a stat block. "in 2h09" / "45 min left" read as language.
    let big='', unit='';
    if(isNext){
      const m=Math.round(mins(it.date)-nowM);
      if(m<=0){ big='now'; }
      else if(m<60){ big=`in ${m}`; unit='min'; }
      else { big=`in ${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`; }
    } else if(late){
      const m=Math.round(nowM-(it.end?mins(it.end):mins(it.date)+45));
      big = m<60 ? `${m}` : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
      unit = m<60 ? 'min over' : 'over';
    } else if(e){
      const m=Math.round(mins(it.end)-nowM);
      big = m<60 ? `${m}` : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
      unit = m<60 ? 'min left' : 'left';
    } else {
      big = s; unit='started';
    }

    const cls = isNext ? ' nx' : (late ? ' late' : '');
    const lbl = isNext ? 'NEXT' : (late ? 'LATE' : 'NOW');

    return `<div class="now${cls}">
      <div class="top">
        <span class="lbl">${lbl}</span>
        <span class="big">${big}${unit?`<span class="u">${unit}</span>`:''}</span>
      </div>
      <div class="n">${esc(it.name)}</div>
      <div class="meta">${e?`${s}\u2013${e}`:s}${where?` \u00b7 ${where}`:''}</div>
    </div>`;
  };

  document.getElementById('nowbox').innerHTML =
    `<div class="np">${panel(cur,false)}${panel(nxt,true)}</div>`;

  // ---- ONE agenda, chronological. Meetings and tasks interleaved, because the
  // day happens in one order -- splitting them made you read two lists and
  // merge them mentally.
  const bySlot=(a,b)=>{
    const A=mins(a.date), B=mins(b.date);
    if(A===null&&B===null) return 0;
    if(A===null) return 1;   // all-day items sink to the bottom
    if(B===null) return -1;
    return A-B;
  };
  const ordered=items.slice().sort(bySlot);

  let h='';
  if(ordered.length){
    const timedRows=ordered.filter(x=>mins(x.date)!==null);
    const allday=ordered.filter(x=>mins(x.date)===null);
    if(timedRows.length){
      h+=`<div class="sec">Today \u00b7 ${ordered.length} item${ordered.length===1?'':'s'}</div>`;
      h+=`<div class="list">${timedRows.map(x=>itemHTML(x,nowM)).join('')}</div>`;
    }
    if(allday.length){
      h+=`<div class="sec">No set time \u00b7 ${allday.length}</div>`;
      h+=`<div class="list">${allday.map(x=>itemHTML(x,nowM)).join('')}</div>`;
    }
  } else {
    h='<div class="empty">nothing scheduled today</div>';
  }
  document.getElementById('body').innerHTML=h;

  const g=d.generated||'';
  document.getElementById('gen').textContent = g?('synced '+g.slice(11,16)):'';
  document.getElementById('src').textContent = (c.past_meetings!=null)
    ? `${c.past_meetings} past meetings not counted` : '';
})
.catch(()=>{document.getElementById('body').innerHTML='<div class="empty">data not built yet</div>';});
</script>
</body>
</html>

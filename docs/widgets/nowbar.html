<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now Bar</title>
<style>
:root{
  --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#262626;
  --ink:#e9e9e7; --dim:#9b9a97; --faint:#6b6a67;
  --blue:#5b93d3; --gold:#c9a227; --green:#5fa87a; --red:#e06c6c; --amber:#c9a227;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#ecebe7;
    --ink:#37352f; --dim:#787774; --faint:#9b9a97;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  padding:0;
}
.bar{
  position:relative;
  display:flex; align-items:stretch;
  background:var(--panel);
  border:1px solid var(--line); border-radius:4px;
  min-height:126px;
  overflow:hidden;
}
/* left accent: the state colour, readable from across the room */
.bar::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
  background:var(--accent,var(--faint));
}
.cell{
  display:flex; flex-direction:column; justify-content:center;
  padding:13px 18px 20px; min-width:0;
  border-right:1px solid var(--hair);
}
.cell:last-child{border-right:0}
.lab{
  font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); font-weight:600; margin-bottom:6px;
}

/* --- clock --- */
.c-clock{flex:0 0 auto; padding-left:23px; align-items:flex-start}
.clock{
  font-size:46px; line-height:1; font-weight:300;
  font-variant-numeric:tabular-nums; letter-spacing:.01em;
  display:flex; align-items:baseline;
}
.clock .sec{font-size:18px; font-weight:400; color:var(--dim); margin-left:7px}
.dateline{font-size:10px; letter-spacing:.14em; color:var(--faint); margin-top:8px; text-transform:uppercase}

/* --- state (hero) --- */
.c-state{flex:1 1 58%; gap:0}
.chip{
  display:inline-flex; align-items:center; gap:7px;
  font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent,var(--dim)); margin-bottom:7px;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent,var(--dim));flex:0 0 auto}
.name{
  font-size:21px; line-height:1.22; font-weight:500; color:var(--ink);
  overflow-wrap:break-word;
}
.name.sm{font-size:17px}
.name.xs{font-size:15px; line-height:1.28}
.meta{
  margin-top:7px; font-size:12.5px; color:var(--dim);
  display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px;
}
.meta b{color:var(--ink); font-weight:600}
.meta .rm{color:var(--gold); font-weight:600}
.left{font-weight:700; color:var(--accent,var(--ink))}

/* --- next --- */
.c-next{flex:0 1 30%; min-width:190px}
.cd{font-size:30px; line-height:1; font-weight:400; color:var(--ink); font-variant-numeric:tabular-nums}
.cd.warn{color:var(--amber)}
.nname{margin-top:8px; font-size:13px; line-height:1.3; color:var(--dim); overflow-wrap:break-word}
.nmeta{margin-top:5px; font-size:11.5px; color:var(--faint)}
.nmeta .rm{color:var(--gold)}

/* --- tally --- */
.c-tally{flex:0 0 auto; align-items:flex-start; gap:9px; padding-right:20px}
.tally{display:flex; flex-direction:column; gap:8px}
.trow{display:flex; align-items:baseline; gap:8px; font-size:11px; letter-spacing:.06em; color:var(--faint); text-transform:uppercase}
.tnum{font-size:19px; line-height:1; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; min-width:22px; text-align:right}
.tnum.red{color:var(--red)}
.tnum.green{color:var(--green)}

/* --- day rail --- */
.rail{position:absolute; left:0; right:0; bottom:0; height:14px; background:transparent}
.railtrack{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--hair)}
.railfill{position:absolute; left:0; bottom:0; height:3px; background:var(--line)}
.tick{position:absolute; bottom:0; width:2px; height:8px; background:var(--faint); border-radius:1px; transform:translateX(-1px)}
.tick.done{background:var(--green); opacity:.55}
.tick.miss{background:var(--red)}
.now{position:absolute; bottom:0; width:2px; height:14px; background:var(--accent,var(--blue)); transform:translateX(-1px)}
.railend{position:absolute; bottom:4px; font-size:8.5px; letter-spacing:.12em; color:var(--faint)}
.railend.l{left:23px} .railend.r{right:8px}

.err{padding:16px 22px; color:var(--red); font-size:13px}
@media (max-width:1040px){ .c-tally{display:none} }
@media (max-width:760px){
  .clock{font-size:34px}
  .cell{padding:11px 14px 18px}
  .c-clock{padding-left:20px}
  .name{font-size:18px} .name.sm{font-size:16px} .name.xs{font-size:14px}
  .c-next{min-width:150px; flex-basis:34%}
  .cd{font-size:25px}
  .nname{font-size:12px}
}
@media (max-width:580px){
  .clock{font-size:30px}
  .name{font-size:16px} .name.sm{font-size:15px} .name.xs{font-size:13.5px}
  .meta{font-size:11.5px}
  .c-next{min-width:126px; flex-basis:30%}
  .cd{font-size:22px}
}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="cell c-clock"><div class="clock" id="clock">--:--</div></div></div>

<script>
"use strict";
var DATA=null, LONG=["SUN","MON","TUE","WED","THU","FRI","SAT"],
    MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

/* ---------- helpers (pure, testable) ---------- */
function pad(n){return (n<10?"0":"")+n;}
function hhmm(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
/* 'in 45m' / 'in 2h05' / 'in <1m' */
function dur(ms){
  var m=Math.floor(ms/60000);
  if(m<1) return "<1m";
  if(m<60) return m+"m";
  return Math.floor(m/60)+"h"+pad(m%60);
}
function parseLocal(s){
  /* ISO with offset -> Date; date-only -> null (all-day, no time) */
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  var d=new Date(s);
  return isNaN(d.getTime())?null:d;
}
/* Build the timed schedule. Never fabricates a duration:
   end is used only when it is strictly after start. */
function buildTimed(items){
  var out=[];
  for(var i=0;i<items.length;i++){
    var it=items[i], s=parseLocal(it.date);
    if(!s) continue;
    var e=parseLocal(it.end);
    if(e && e.getTime()<=s.getTime()) e=null;
    out.push({
      name:(it.name||"Untitled").trim(),
      start:s, end:e, hasEnd:!!e,
      done:!!it.done,
      room:(it.location||"").trim(),
      kind:(it.type||it.meeting_type||"").trim()
    });
  }
  out.sort(function(a,b){return a.start-b.start;});
  return out;
}
/* The whole state machine. now = Date. Returns a render spec. */
function compute(now, sched){
  var t=now.getTime(), i, ev;
  var timed=sched.filter(function(e){return !e.done;});

  /* 1. LATE — a not-done event whose end passed 3-45m ago (3m grace so a
        cleanly-finished event does not flash red the instant it ends) */
  var late=null;
  for(i=0;i<timed.length;i++){
    ev=timed[i];
    var over=t-ev.end;
    if(ev.hasEnd && over>=3*60000 && over<45*60000){
      if(!late || ev.end>late.end) late=ev;
    }
  }
  /* 2. NOW — inside a not-done event with a real end */
  var cur=null;
  for(i=0;i<timed.length;i++){
    ev=timed[i];
    if(ev.hasEnd && ev.start.getTime()<=t && t<ev.end.getTime()){
      /* latest start wins; tie broken by later end (the anchoring commitment) */
      if(!cur || ev.start>cur.start || (+ev.start===+cur.start && ev.end>cur.end)) cur=ev;
    }
  }
  /* 2b. point-in-time item (no end) that just came due, 10m grace */
  var pt=null;
  if(!cur){
    for(i=0;i<timed.length;i++){
      ev=timed[i];
      if(!ev.hasEnd && ev.start.getTime()<=t && t-ev.start.getTime()<10*60000){
        if(!pt || ev.start>pt.start) pt=ev;
      }
    }
  }
  /* 3. NEXT — first not-done start strictly ahead */
  var next=null;
  for(i=0;i<timed.length;i++){
    if(timed[i].start.getTime()>t){next=timed[i];break;}
  }
  /* tallies */
  var missed=0;
  for(i=0;i<timed.length;i++){
    ev=timed[i];
    var eff=ev.hasEnd?ev.end.getTime():ev.start.getTime();
    if(eff<=t) missed++;
  }
  var anyTimed=sched.length>0;
  var lastEnd=null;
  for(i=0;i<sched.length;i++){
    ev=sched[i];
    var z=ev.hasEnd?ev.end.getTime():ev.start.getTime();
    if(lastEnd===null||z>lastEnd) lastEnd=z;
  }

  var st;
  if(!anyTimed){
    st={state:"EMPTY",accent:"var(--faint)",chip:"Nothing scheduled",
        headline:"No timed items today",meta:[]};
  } else if(late && (!cur || late.end.getTime()>=cur.start.getTime())){
    st={state:"LATE",accent:"var(--red)",chip:"Running late",ev:late,
        headline:late.name,
        meta:[{k:"ended",v:"should have ended "+hhmm(late.end)},
              {k:"over",v:dur(t-late.end.getTime())+" over"}],
        room:late.room};
  } else if(cur){
    st={state:"NOW",accent:"var(--blue)",chip:"You are here",ev:cur,
        headline:cur.name,
        meta:[{k:"range",v:hhmm(cur.start)+"\u2013"+hhmm(cur.end)},
              {k:"left",v:dur(cur.end.getTime()-t)+" left"}],
        room:cur.room};
  } else if(pt){
    st={state:"DUE",accent:"var(--amber)",chip:"Due now",ev:pt,
        headline:pt.name,
        meta:[{k:"at",v:"due at "+hhmm(pt.start)},{k:"over",v:dur(t-pt.start.getTime())+" ago"}],
        room:pt.room};
  } else if(next && !sched.some(function(e){return e.start.getTime()<=t;})){
    st={state:"BEFORE",accent:"var(--green)",chip:"Day not started",
        headline:"First up "+hhmm(next.start),
        meta:[{k:"in",v:"in "+dur(next.start.getTime()-t)}]};
  } else if(next){
    st={state:"GAP",accent:"var(--green)",chip:"Clear right now",
        headline:"Free until "+hhmm(next.start),
        meta:[{k:"gap",v:dur(next.start.getTime()-t)+" free"}]};
  } else {
    st={state:"AFTER",accent:"var(--faint)",chip:"Day is clear from here",
        headline:"Nothing left today",
        meta:lastEnd?[{k:"last",v:"last item "+hhmm(new Date(lastEnd))}]:[]};
  }
  st.next=next;
  st.missed=missed;
  st.lastEnd=lastEnd;
  return st;
}

/* ---------- render ---------- */
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
/* Some Notion titles are whole pasted paragraphs (200+ chars). A strip cannot
   show those. Cut at a sentence break if there is one, else at a WORD boundary
   — never mid-word, never a CSS one-line ellipsis. Remainder marked with an
   ellipsis character so it is obvious there is more, and it still wraps. */
function clampName(s,max){
  s=String(s).replace(/\s+/g," ").trim();
  if(s.length<=max) return s;
  var stop=s.slice(0,max+1).search(/[.!?](\s|$)/);
  if(stop>=Math.floor(max*0.45)) return s.slice(0,stop+1);
  var cut=s.lastIndexOf(" ",max);
  if(cut<Math.floor(max*0.5)) cut=max;
  return s.slice(0,cut).replace(/[,;:\-\u2014]$/,"")+"\u2026";
}
function nameCls(s){var n=s.length; return n>78?"name xs":(n>44?"name sm":"name");}

var RAIL_A=6, RAIL_B=24; /* 0600 -> 2400 */
function railPct(d){
  var h=d.getHours()+d.getMinutes()/60;
  return Math.max(0,Math.min(100,(h-RAIL_A)/(RAIL_B-RAIL_A)*100));
}

function render(){
  var bar=document.getElementById("bar");
  if(!DATA){return;}
  var now=new Date();
  var sched=buildTimed(DATA.today_items||[]);
  var st=compute(now,sched);

  var h=[];
  /* clock */
  h.push('<div class="cell c-clock"><div class="clock"><span>'+hhmm(now)+
    '</span><span class="sec">:'+pad(now.getSeconds())+'</span></div>'+
    '<div class="dateline">'+LONG[now.getDay()]+" "+pad(now.getDate())+" "+MON[now.getMonth()]+'</div></div>');

  /* state */
  var m=[];
  if(st.room) m.push('<span class="rm">'+esc(st.room)+'</span>');
  (st.meta||[]).forEach(function(x){
    if(x.k==="left"||x.k==="over"||x.k==="in"||x.k==="gap") m.push('<span class="left">'+esc(x.v)+'</span>');
    else m.push('<b>'+esc(x.v)+'</b>');
  });
  /* Text budget scales with the strip's width so the bar never grows taller
     than a strip. Measured, not guessed — see verification notes. */
  var W=document.documentElement.clientWidth||1280;
  var headMax = W>=1180?104 : (W>=1040?86 : (W>=820?76 : (W>=640?60 : 46)));
  var nextMax = W>=1180?58  : (W>=1040?50 : (W>=820?44 : (W>=640?38 : 30)));
  var head=clampName(st.headline,headMax);
  h.push('<div class="cell c-state"><div class="chip"><span class="dot"></span>'+esc(st.chip)+'</div>'+
    '<div class="'+nameCls(head)+'">'+esc(head)+'</div>'+
    (m.length?'<div class="meta">'+m.join("")+'</div>':'')+'</div>');

  /* next */
  if(st.next){
    var gap=st.next.start.getTime()-now.getTime();
    var rng=hhmm(st.next.start)+(st.next.hasEnd?"\u2013"+hhmm(st.next.end):"");
    h.push('<div class="cell c-next"><div class="lab">Next</div>'+
      '<div class="cd'+(gap<15*60000?" warn":"")+'">in '+dur(gap)+'</div>'+
      '<div class="nname">'+esc(clampName(st.next.name,nextMax))+'</div>'+
      '<div class="nmeta">'+rng+(st.next.room?' \u00b7 <span class="rm">'+esc(st.next.room)+'</span>':"")+'</div></div>');
  } else {
    h.push('<div class="cell c-next"><div class="lab">Next</div>'+
      '<div class="cd" style="color:var(--faint)">\u2014</div>'+
      '<div class="nname">Nothing further scheduled today</div></div>');
  }

  /* tally */
  var all=DATA.today_items||[];
  var doneN=all.filter(function(i){return i.done;}).length;
  var openN=all.length-doneN;
  h.push('<div class="cell c-tally"><div class="tally">'+
    '<div class="trow"><span class="tnum">'+openN+'</span>open today</div>'+
    '<div class="trow"><span class="tnum green">'+doneN+'</span>done of '+all.length+'</div>'+
    '</div></div>');

  /* rail */
  var ticks="";
  sched.forEach(function(e){
    var cls="tick"+(e.done?" done":(((e.hasEnd?e.end:e.start).getTime()<=now.getTime())?" miss":""));
    ticks+='<div class="'+cls+'" style="left:'+railPct(e.start).toFixed(2)+'%"></div>';
  });
  h.push('<div class="rail"><div class="railtrack"></div>'+
    '<div class="railfill" style="width:'+railPct(now).toFixed(2)+'%"></div>'+ticks+
    '<div class="now" style="left:'+railPct(now).toFixed(2)+'%"></div>'+
    '<div class="railend l">0600</div><div class="railend r">2400</div></div>');

  bar.style.setProperty("--accent",st.accent);
  bar.setAttribute("data-state",st.state);
  bar.innerHTML=h.join("");
}

function tickClock(){
  var el=document.querySelector(".clock");
  if(!el) return;
  var n=new Date();
  el.innerHTML='<span>'+hhmm(n)+'</span><span class="sec">:'+pad(n.getSeconds())+'</span>';
}

fetch("../data/tasks.json",{cache:"no-store"})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(j){
    DATA=j; render();
    setInterval(tickClock,1000);
    setInterval(render,20000);
  })
  .catch(function(e){
    document.getElementById("bar").innerHTML='<div class="err">Data unavailable \u2014 '+esc(e.message)+'</div>';
  });
</script>
</body>
</html>

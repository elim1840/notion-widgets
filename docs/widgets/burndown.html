<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burndown</title>
<style>
  :root{
    --bg:#191919; --panel:#202020; --line:#2f2f2f; --hair:#252525;
    --ink:#e9e9e7; --dim:#9b9a97; --faint:#6f6e6b;
    --blue:#5b93d3; --gold:#c9a227; --red:#e06c6c; --green:#5fa87a; --purple:#9a6dd7;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f7f7f5; --line:#e6e5e1; --hair:#efeeec;
           --ink:#37352f; --dim:#787774; --faint:#9b9a97; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);padding:12px 14px;
       font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .hd{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;
      padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  .st{border-left:2px solid var(--hair);padding-left:9px}
  .st.red{border-left-color:var(--red)}
  .st.blue{border-left-color:var(--blue)}
  .n{font-size:24px;font-weight:600;letter-spacing:-.035em;line-height:1;
     font-variant-numeric:tabular-nums}
  .n.small{font-size:15px;letter-spacing:-.01em;line-height:1.15}
  .n.red{color:var(--red)} .n.dimc{color:var(--faint)}
  .u{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;
     display:block;margin-top:4px}
  svg{display:block;width:100%;height:auto}
  .ax{font-size:9px;fill:var(--faint);font-family:inherit}
  .lgd{display:flex;gap:12px;font-size:9.5px;color:var(--faint);margin-top:7px;flex-wrap:wrap}
  .lgd span{display:flex;align-items:center;gap:4px}
  .lgd i{width:9px;height:9px;border-radius:2px;display:block}
  .lgd i.dash{width:14px;height:0;border-top:1.5px dashed var(--faint);border-radius:0}
  .compo{margin-top:11px;padding-top:9px;border-top:1px solid var(--hair)}
  .compolab{font-size:9.5px;color:var(--faint);text-transform:uppercase;
            letter-spacing:.08em;margin-bottom:6px}
  .cbar{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--hair)}
  .cbar i{display:block;height:100%}
  .note{font-size:9.5px;color:var(--faint);margin-top:9px;line-height:1.5}
  .note b{color:var(--dim);font-weight:500}
  .none{color:var(--faint);font-style:italic;padding:14px 0}
</style>
</head>
<body>
<div class="hd"><span>Backlog burndown</span><span id="win"></span></div>
<div id="out"><div class="none">loading…</div></div>

<script>
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ISO=/(\d{4}-\d{2}-\d{2})/;
const dayOf = v => { const m=ISO.exec(String(v||'')); return m?m[1]:null; };
const D = iso => new Date(iso+'T12:00:00');
const fmtShort = iso => { const d=D(iso); return d.getDate()+' '+MON[d.getMonth()]; };

fetch('../data/tasks.json?t='+Date.now()).then(r=>r.json()).then(T=>{
  const out=document.getElementById('out');
  const c = T.counts||{};
  const open = Number(c.open)||0, doneAll = Number(c.done)||0,
        overdue = Number(c.overdue)||0, totalAll = Number(c.total)||0;
  const openNotLate = Math.max(0, open - overdue);

  const hist = (Array.isArray(T.history)?T.history:[])
    .map(h=>({d:dayOf(h.date), total:Number(h.total)||0, done:Number(h.done)||0}))
    .filter(h=>h.d).sort((a,b)=> a.d<b.d?-1:a.d>b.d?1:0);

  if(!hist.length){
    out.innerHTML='<div class="none">no history rows — no backlog trend to plot</div>';
    return;
  }
  const N=hist.length, first=hist[0].d, last=hist[N-1].d;
  document.getElementById('win').textContent = fmtShort(first)+' – '+fmtShort(last)+' · '+N+'d';

  // ---- Reconstruct the open-count series backwards from the known current open
  // count: open at day i = open_now + (completions recorded after day i).
  // With zero recorded completions this is a FLAT line — which is the truth, not
  // a rendering failure. Labelled as reconstructed below.
  const openSeries = new Array(N);
  let acc = 0;
  for(let i=N-1;i>=0;i--){ openSeries[i] = open + acc; acc += hist[i].done; }

  const burned = hist.reduce((a,h)=>a+h.done,0);
  const rate = burned / N;                                  // items closed per day
  const daysToClear = rate > 0 ? Math.ceil(open / rate) : null;
  const clearTxt = daysToClear===null ? 'never' : daysToClear.toLocaleString();
  const clearSub = daysToClear===null
      ? 'at the current rate (0.00/day)'
      : 'days at '+rate.toFixed(2)+'/day';

  // ---- chart geometry
  const W=560, H=150, L=32, R=8, Tp=10, B=20;
  const iw = W-L-R, ih = H-Tp-B;
  const yMax = Math.max(1, Math.ceil(Math.max(...openSeries)/10)*10);
  const x = i => L + (N===1 ? iw/2 : i*(iw/(N-1)));
  const y = v => Tp + ih - (v/yMax)*ih;

  // stacked daily load bars (scheduled that day: done vs not done), scaled to
  // their own right-hand axis so they stay legible next to a 147-item backlog.
  const loadMax = Math.max(1, ...hist.map(h=>h.total));
  const bw = Math.max(4, Math.min(16, (iw/N)*0.62));

  let g='';
  // gridlines
  for(let k=0;k<=4;k++){
    const v = yMax*k/4, yy=y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--hair)" stroke-width="1"/>`;
    g += `<text class="ax" x="${L-5}" y="${yy+3}" text-anchor="end">${Math.round(v)}</text>`;
  }
  // daily load bars (bottom 40% of plot area)
  hist.forEach((h,i)=>{
    const bh = (h.total/loadMax) * (ih*0.40);
    const dh = (h.done /loadMax) * (ih*0.40);
    const y0 = Tp+ih;
    if(h.total>0){
      g += `<rect x="${x(i)-bw/2}" y="${y0-bh}" width="${bw}" height="${bh}"
             fill="var(--blue)" opacity=".22" rx="1.5"><title>${h.d}: ${h.total} scheduled, ${h.done} done</title></rect>`;
    }
    if(h.done>0){
      g += `<rect x="${x(i)-bw/2}" y="${y0-dh}" width="${bw}" height="${dh}"
             fill="var(--green)" rx="1.5"><title>${h.d}: ${h.done} done</title></rect>`;
    }
  });
  // ideal burndown reference: open -> 0 across the same window
  g += `<line x1="${x(0)}" y1="${y(openSeries[0])}" x2="${x(N-1)}" y2="${y(0)}"
         stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  // actual reconstructed open line
  const pts = openSeries.map((v,i)=>x(i)+','+y(v)).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  openSeries.forEach((v,i)=>{
    g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i===N-1?3:1.8}" fill="var(--red)">
           <title>${hist[i].d}: ${v} open</title></circle>`;
  });
  // x labels: first, middle, last
  [0, Math.floor((N-1)/2), N-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{
    const anch = i===0?'start':i===N-1?'end':'middle';
    g += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${anch}">${fmtShort(hist[i].d)}</text>`;
  });

  const pct = v => totalAll>0 ? (v/totalAll*100) : 0;

  out.innerHTML = `
    <div class="stats">
      <div class="st blue"><div class="n">${open}</div><span class="u">Open now</span></div>
      <div class="st red"><div class="n red">${overdue}</div><span class="u">Overdue</span></div>
      <div class="st"><div class="n ${daysToClear===null?'small dimc':''}">${clearTxt}</div>
        <span class="u">${daysToClear===null?'to clear':'days to clear'}</span></div>
    </div>

    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Backlog burndown">${g}</svg>
    <div class="lgd">
      <span><i style="background:var(--red)"></i>open backlog (reconstructed)</span>
      <span><i class="dash"></i>ideal burndown</span>
      <span><i style="background:var(--blue);opacity:.3"></i>scheduled that day</span>
      <span><i style="background:var(--green)"></i>completed that day</span>
    </div>

    <div class="compo">
      <div class="compolab">Current state · ${totalAll} rows</div>
      <div class="cbar">
        <i style="width:${pct(overdue)}%;background:var(--red)" title="${overdue} overdue"></i>
        <i style="width:${pct(openNotLate)}%;background:var(--blue)" title="${openNotLate} open, not late"></i>
        <i style="width:${pct(doneAll)}%;background:var(--green)" title="${doneAll} done"></i>
      </div>
      <div class="lgd">
        <span><i style="background:var(--red)"></i>${overdue} overdue</span>
        <span><i style="background:var(--blue)"></i>${openNotLate} open, not late</span>
        <span><i style="background:var(--green)"></i>${doneAll} done</span>
      </div>
    </div>

    <div class="note">
      <b>${N} days of history</b> back this chart (${first} → ${last}) — that is all
      there is. history[] stores per-day scheduled/completed counts, not a daily
      backlog snapshot, so the red line is <b>reconstructed</b> backwards from the
      ${open} currently open plus completions recorded after each day.
      ${burned===0
        ? `Zero completions were recorded in the window, so the reconstruction is flat at ${open} and the burn rate is 0.00/day — the backlog will <b>never</b> clear at the current rate. That is the real reading, not a missing series.`
        : `Burn rate ${rate.toFixed(2)}/day over ${N} days (${burned} closed).`}
    </div>`;
})
.catch(()=>{ document.getElementById('out').innerHTML='<div class="none">data unavailable</div>'; });
</script>
</body>
</html>
